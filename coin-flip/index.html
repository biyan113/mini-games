<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080914">
  <title>霓虹抛硬币</title>
  <style>
    /* ---------- 基础与移动端限制 ---------- */
    :root {
      color-scheme: dark;
      --bg: #080914;
      --panel: rgba(20, 22, 43, 0.72);
      --line: rgba(255, 255, 255, 0.09);
      --text: #f6f7ff;
      --muted: #8e93ad;
      --cyan: #51edf2;
      --purple: #a78bfa;
      --pink: #fb71c7;
      --gold: #ffd76a;
      --danger: #ff6f91;
      --flip-duration: 1450ms;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
    }

    body {
      position: fixed;
      inset: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 5%, rgba(92, 70, 190, 0.2), transparent 36%),
        radial-gradient(circle at 90% 88%, rgba(0, 216, 222, 0.12), transparent 38%),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      border: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
      touch-action: none;
    }

    button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    button:disabled {
      cursor: default;
    }

    [hidden] {
      display: none !important;
    }

    /* ---------- 氛围背景 ---------- */
    .ambient {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.2;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }

    .orb {
      position: absolute;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.16;
      animation: drift 9s ease-in-out infinite alternate;
    }

    .orb-one {
      top: 18%;
      left: -120px;
      background: var(--purple);
    }

    .orb-two {
      right: -130px;
      bottom: 10%;
      background: var(--cyan);
      animation-delay: -4s;
    }

    /* ---------- 手机优先的整体布局 ---------- */
    .game-shell {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 11px;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    .topbar {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      min-height: 42px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid rgba(81, 237, 242, 0.28);
      border-radius: 12px;
      color: var(--cyan);
      background: linear-gradient(145deg, rgba(81, 237, 242, 0.13), rgba(167, 139, 250, 0.08));
      box-shadow: inset 0 0 15px rgba(81, 237, 242, 0.06), 0 0 20px rgba(81, 237, 242, 0.08);
      font-size: 20px;
    }

    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 750;
      letter-spacing: 0.08em;
    }

    .brand-en {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.24em;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-button {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.045);
      transition: border-color 160ms ease, background 160ms ease, opacity 160ms ease;
    }

    .icon-button svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .icon-button:disabled {
      opacity: 0.35;
    }

    /* ---------- 分数与进度 ---------- */
    .score-panel {
      flex: 0 0 auto;
      padding: 14px 15px 12px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.065), rgba(255, 255, 255, 0.025));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 12px 40px rgba(0, 0, 0, 0.16);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .score-grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr 1fr;
      align-items: center;
    }

    .score-item {
      min-width: 0;
      padding: 0 12px;
      border-left: 1px solid var(--line);
    }

    .score-item:first-child {
      padding-left: 0;
      border-left: 0;
    }

    .score-item:last-child {
      padding-right: 0;
    }

    .score-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .score-value {
      font-size: 24px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }

    #score {
      color: var(--text);
      font-size: 32px;
      text-shadow: 0 0 20px rgba(81, 237, 242, 0.2);
    }

    #score.bump {
      animation: score-bump 280ms ease;
    }

    #streak {
      color: var(--purple);
    }

    #streak.hot {
      color: var(--pink);
      text-shadow: 0 0 16px rgba(251, 113, 199, 0.45);
    }

    .progress-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 0 7px;
      color: var(--muted);
      font-size: 10px;
    }

    .lives {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .heart {
      color: var(--danger);
      font-size: 13px;
      line-height: 1;
      filter: drop-shadow(0 0 5px rgba(255, 111, 145, 0.4));
      transition: color 200ms ease, opacity 200ms ease, transform 200ms ease;
    }

    .heart.lost {
      color: #55586d;
      opacity: 0.55;
      filter: none;
      transform: scale(0.86);
    }

    .progress-track {
      height: 5px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.07);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--purple), var(--pink), var(--cyan));
      box-shadow: 0 0 12px rgba(81, 237, 242, 0.45);
      transition: width 400ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* ---------- 硬币舞台 ---------- */
    .play-area {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      align-items: center;
      min-height: 0;
    }

    .status {
      display: flex;
      flex: 0 0 25px;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      margin: 0;
      color: #b9bed4;
      font-size: 13px;
      text-align: center;
      transition: color 180ms ease;
    }

    .status.success {
      color: var(--cyan);
    }

    .status.error {
      color: var(--danger);
    }

    .coin-button {
      position: relative;
      display: grid;
      flex: 1 1 auto;
      width: 100%;
      min-height: 170px;
      padding: 0;
      place-items: center;
      border-radius: 24px;
      background: transparent;
      perspective: 900px;
      isolation: isolate;
    }

    .coin-button::before,
    .coin-button::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .coin-button::before {
      z-index: -2;
      width: min(65vw, 250px);
      height: min(65vw, 250px);
      border: 1px solid rgba(81, 237, 242, 0.08);
      background: radial-gradient(circle, rgba(81, 237, 242, 0.07), transparent 66%);
      box-shadow: 0 0 65px rgba(81, 237, 242, 0.05), inset 0 0 45px rgba(167, 139, 250, 0.04);
      transition: border-color 250ms ease, box-shadow 250ms ease;
    }

    .coin-button::after {
      z-index: -1;
      width: min(53vw, 205px);
      height: min(53vw, 205px);
      border: 1px dashed rgba(167, 139, 250, 0.16);
      animation: ring-spin 24s linear infinite;
    }

    .coin-button.is-ready::before {
      border-color: rgba(81, 237, 242, 0.2);
      box-shadow: 0 0 75px rgba(81, 237, 242, 0.11), inset 0 0 50px rgba(81, 237, 242, 0.05);
    }

    .coin-flight {
      position: relative;
      z-index: 2;
      display: block;
      width: clamp(132px, 40vw, 178px);
      aspect-ratio: 1;
      transform-style: preserve-3d;
    }

    .coin {
      position: absolute;
      inset: 0;
      display: block;
      transform: rotateY(0deg);
      transform-style: preserve-3d;
      transition: transform var(--flip-duration) cubic-bezier(0.18, 0.68, 0.2, 1);
      will-change: transform;
    }

    .coin-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 5px solid rgba(255, 255, 255, 0.28);
      border-radius: 50%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow:
        inset 0 0 0 4px rgba(70, 40, 5, 0.15),
        inset 0 0 25px rgba(255, 255, 255, 0.35),
        0 15px 35px rgba(0, 0, 0, 0.35);
    }

    .coin-face::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px dashed rgba(70, 40, 5, 0.25);
      border-radius: 50%;
    }

    .coin-face::after {
      content: "";
      position: absolute;
      top: -35%;
      left: -60%;
      width: 65%;
      height: 170%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transform: rotate(25deg);
    }

    .coin-front {
      color: #633a06;
      background: radial-gradient(circle at 34% 26%, #fff8c8 0, #ffdd72 26%, #f2ad32 64%, #a85b0d 100%);
    }

    .coin-back {
      color: #073d50;
      background: radial-gradient(circle at 34% 26%, #e2ffff 0, #75edf1 27%, #24aebc 64%, #116079 100%);
      transform: rotateY(180deg);
    }

    .coin-back::before {
      border-color: rgba(4, 57, 73, 0.26);
    }

    .coin-character {
      position: relative;
      z-index: 1;
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: clamp(54px, 17vw, 76px);
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .coin-en {
      position: relative;
      z-index: 1;
      margin-top: 7px;
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      opacity: 0.62;
    }

    .coin-shadow {
      position: absolute;
      z-index: 0;
      left: 50%;
      bottom: 10%;
      width: 112px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.58);
      filter: blur(9px);
      transform: translateX(-50%);
    }

    .coin-button.is-flipping .coin-flight {
      animation: coin-toss var(--flip-duration) cubic-bezier(0.25, 0.7, 0.3, 1);
    }

    .coin-button.is-flipping .coin-shadow {
      animation: shadow-pulse var(--flip-duration) ease-in-out;
    }

    .points-pop {
      position: absolute;
      z-index: 5;
      top: 38%;
      left: 50%;
      color: var(--cyan);
      font-size: 26px;
      font-weight: 850;
      opacity: 0;
      pointer-events: none;
      text-shadow: 0 0 20px rgba(81, 237, 242, 0.65);
      transform: translate(-50%, 0);
    }

    .points-pop.show {
      animation: points-rise 850ms ease-out;
    }

    .particles {
      position: absolute;
      z-index: 4;
      top: 43%;
      left: 50%;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--particle-color);
      box-shadow: 0 0 8px var(--particle-color);
      animation: particle-burst 750ms ease-out forwards;
    }

    /* ---------- 猜测按钮与玩法提示 ---------- */
    .controls {
      flex: 0 0 auto;
      width: 100%;
    }

    .guess-label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.16em;
      text-align: center;
    }

    .guess-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .guess-button {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 54px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.045);
      transition: transform 140ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
    }

    .guess-button::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0;
      background: linear-gradient(120deg, rgba(255, 215, 106, 0.12), transparent);
      transition: opacity 180ms ease;
    }

    .guess-button[data-side="tails"]::before {
      background: linear-gradient(120deg, rgba(81, 237, 242, 0.12), transparent);
    }

    .guess-button.selected {
      border-color: rgba(255, 215, 106, 0.55);
      background: rgba(255, 215, 106, 0.07);
      box-shadow: inset 0 0 18px rgba(255, 215, 106, 0.04), 0 0 18px rgba(255, 215, 106, 0.05);
    }

    .guess-button[data-side="tails"].selected {
      border-color: rgba(81, 237, 242, 0.55);
      background: rgba(81, 237, 242, 0.07);
      box-shadow: inset 0 0 18px rgba(81, 237, 242, 0.04), 0 0 18px rgba(81, 237, 242, 0.06);
    }

    .guess-button.selected::before {
      opacity: 1;
    }

    .guess-button:disabled {
      opacity: 0.55;
    }

    .guess-button.selected:disabled {
      opacity: 0.85;
    }

    .guess-icon {
      position: relative;
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border: 1px solid rgba(255, 215, 106, 0.42);
      border-radius: 50%;
      color: var(--gold);
      background: rgba(255, 215, 106, 0.07);
      font-family: "Songti SC", "STSong", serif;
      font-size: 16px;
      font-weight: 800;
    }

    [data-side="tails"] .guess-icon {
      border-color: rgba(81, 237, 242, 0.4);
      color: var(--cyan);
      background: rgba(81, 237, 242, 0.07);
    }

    .guess-copy {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .guess-name {
      font-size: 15px;
      font-weight: 750;
      letter-spacing: 0.08em;
    }

    .guess-en {
      margin-top: 1px;
      color: var(--muted);
      font-size: 7px;
      font-weight: 750;
      letter-spacing: 0.2em;
    }

    .flip-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 10px;
    }

    .flip-hint .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      animation: dot-pulse 1.8s ease-in-out infinite;
    }

    .rules {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 29px;
      border: 1px solid rgba(255, 255, 255, 0.055);
      border-radius: 12px;
      color: #858ba6;
      background: rgba(255, 255, 255, 0.025);
      font-size: 9px;
      white-space: nowrap;
    }

    .rules i {
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #5f647b;
    }

    .keyboard-hint {
      display: none;
    }

    .shake {
      animation: shake 300ms ease;
    }

    /* ---------- 暂停与结算弹窗 ---------- */
    .game-dialog {
      width: min(calc(100% - 36px), 390px);
      margin: auto;
      padding: 27px 24px 22px;
      overflow: visible;
      border: 1px solid rgba(167, 139, 250, 0.28);
      border-radius: 26px;
      color: var(--text);
      background: linear-gradient(145deg, rgba(29, 30, 57, 0.98), rgba(12, 14, 29, 0.98));
      box-shadow: 0 24px 90px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 0 55px rgba(167, 139, 250, 0.08);
      text-align: center;
    }

    .game-dialog::backdrop {
      background: rgba(3, 4, 12, 0.76);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
    }

    .game-dialog[open] {
      animation: dialog-in 220ms ease-out;
    }

    .dialog-icon {
      display: grid;
      width: 62px;
      height: 62px;
      margin: 0 auto 16px;
      place-items: center;
      border: 1px solid rgba(81, 237, 242, 0.25);
      border-radius: 20px;
      color: var(--cyan);
      background: rgba(81, 237, 242, 0.07);
      box-shadow: 0 0 25px rgba(81, 237, 242, 0.1);
      font-size: 29px;
      font-weight: 300;
    }

    .game-dialog[data-kind="win"] .dialog-icon {
      border-color: rgba(255, 215, 106, 0.3);
      color: var(--gold);
      background: rgba(255, 215, 106, 0.08);
      box-shadow: 0 0 30px rgba(255, 215, 106, 0.12);
    }

    .game-dialog[data-kind="lose"] .dialog-icon {
      border-color: rgba(255, 111, 145, 0.28);
      color: var(--danger);
      background: rgba(255, 111, 145, 0.07);
    }

    .dialog-eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 750;
      letter-spacing: 0.25em;
    }

    .dialog-title {
      margin: 0;
      font-size: 27px;
      letter-spacing: 0.05em;
    }

    .dialog-description {
      margin: 10px auto 18px;
      color: #9fa5bd;
      font-size: 12px;
      line-height: 1.7;
    }

    .dialog-score {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 18px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.035);
    }

    .dialog-score > span {
      color: var(--muted);
      font-size: 11px;
    }

    .dialog-score strong {
      color: var(--cyan);
      font-size: 28px;
      font-variant-numeric: tabular-nums;
    }

    .dialog-score small {
      color: var(--purple);
      font-size: 11px;
    }

    .dialog-actions {
      display: grid;
      gap: 9px;
    }

    .primary-button,
    .secondary-button {
      min-height: 49px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 750;
      letter-spacing: 0.08em;
    }

    .primary-button {
      color: #071419;
      background: linear-gradient(100deg, #7cf7f2, #65dce9);
      box-shadow: 0 8px 25px rgba(81, 237, 242, 0.16);
    }

    .secondary-button {
      border: 1px solid var(--line);
      color: #aab0c7;
      background: rgba(255, 255, 255, 0.035);
    }

    /* ---------- 动画 ---------- */
    @keyframes drift {
      to { transform: translate(35px, -25px) scale(1.15); }
    }

    @keyframes ring-spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes coin-toss {
      0%, 100% { transform: translateY(0) scale(1); }
      38% { transform: translateY(-42px) scale(1.07); }
      68% { transform: translateY(-13px) scale(1.025); }
    }

    @keyframes shadow-pulse {
      0%, 100% { opacity: 0.8; transform: translateX(-50%) scale(1); }
      40% { opacity: 0.28; transform: translateX(-50%) scale(0.58); }
    }

    @keyframes score-bump {
      50% { color: var(--cyan); transform: scale(1.15); }
    }

    @keyframes points-rise {
      0% { opacity: 0; transform: translate(-50%, 12px) scale(0.8); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -60px) scale(1.08); }
    }

    @keyframes particle-burst {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--particle-x), var(--particle-y)) scale(0.2); }
    }

    @keyframes dot-pulse {
      50% { opacity: 0.35; box-shadow: 0 0 2px var(--cyan); }
    }

    @keyframes shake {
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }

    @keyframes dialog-in {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 鼠标设备增加清晰的悬停反馈 */
    @media (hover: hover) {
      .icon-button:not(:disabled):hover,
      .secondary-button:hover {
        border-color: rgba(81, 237, 242, 0.3);
        background: rgba(81, 237, 242, 0.07);
      }

      .guess-button:not(:disabled):hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .coin-button:not(:disabled):hover .coin-flight {
        filter: brightness(1.08);
      }

      .primary-button:hover {
        filter: brightness(1.08);
      }
    }

    /* 矮屏压缩垂直空间，保证所有操作仍在一屏内 */
    @media (max-height: 700px) {
      .game-shell { gap: 8px; padding-top: max(10px, env(safe-area-inset-top)); }
      .score-panel { padding-top: 11px; padding-bottom: 10px; }
      .progress-meta { margin-top: 8px; }
      .coin-button { min-height: 145px; }
      .coin-flight { width: clamp(122px, 35vh, 155px); }
      .coin-character { font-size: clamp(50px, 16vh, 66px); }
      .coin-shadow { bottom: 5%; }
      .guess-button { min-height: 49px; }
      .flip-hint { margin-top: 6px; }
      .rules { min-height: 25px; }
    }

    @media (min-width: 700px) {
      .keyboard-hint {
        display: block;
        flex: 0 0 auto;
        color: #656b84;
        font-size: 9px;
        text-align: center;
      }
    }

    /* 尊重系统的减少动态效果设置 */
    @media (prefers-reduced-motion: reduce) {
      :root { --flip-duration: 400ms; }
      .orb, .coin-button::after, .flip-hint .dot { animation: none; }
      .coin-button.is-flipping .coin-flight { animation-duration: 400ms; }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
  </div>

  <main class="game-shell" aria-label="霓虹抛硬币游戏">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <div>
          <h1>霓虹抛硬币</h1>
          <p class="brand-en">NEON COIN FLIP</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="restartButton" type="button" aria-label="重新开始" title="重新开始（R）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M5.5 15a7 7 0 1 0 .5-7l-2 2"/></svg>
        </button>
        <button class="icon-button" id="pauseButton" type="button" aria-label="暂停游戏" title="暂停（P）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
        </button>
      </div>
    </header>

    <section class="score-panel" aria-label="游戏数据">
      <div class="score-grid">
        <div class="score-item">
          <span class="score-label">当前得分</span>
          <strong class="score-value" id="score">0</strong>
        </div>
        <div class="score-item">
          <span class="score-label">最高分</span>
          <strong class="score-value" id="bestScore">0</strong>
        </div>
        <div class="score-item">
          <span class="score-label">当前连击</span>
          <strong class="score-value" id="streak">×0</strong>
        </div>
      </div>
      <div class="progress-meta">
        <span>目标 · 100 分获胜</span>
        <div class="lives" id="lives" aria-label="剩余三次机会"></div>
      </div>
      <div class="progress-track" role="progressbar" aria-label="胜利进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <section class="play-area" aria-label="抛硬币操作区">
      <p class="status" id="status" aria-live="polite">先猜正面还是反面</p>

      <button class="coin-button" id="coinButton" type="button" aria-label="抛硬币">
        <span class="coin-flight" aria-hidden="true">
          <span class="coin" id="coin">
            <span class="coin-face coin-front">
              <span class="coin-character">正</span>
              <span class="coin-en">HEADS</span>
            </span>
            <span class="coin-face coin-back">
              <span class="coin-character">反</span>
              <span class="coin-en">TAILS</span>
            </span>
          </span>
        </span>
        <span class="coin-shadow" aria-hidden="true"></span>
      </button>

      <div class="points-pop" id="pointsPop" aria-hidden="true"></div>
      <div class="particles" id="particles" aria-hidden="true"></div>

      <div class="controls">
        <p class="guess-label">我 猜 这 次 是</p>
        <div class="guess-buttons" id="guessButtons" role="group" aria-label="选择正反面">
          <button class="guess-button" type="button" data-side="heads" aria-pressed="false">
            <span class="guess-icon" aria-hidden="true">正</span>
            <span class="guess-copy"><span class="guess-name">正面</span><span class="guess-en">HEADS</span></span>
          </button>
          <button class="guess-button" type="button" data-side="tails" aria-pressed="false">
            <span class="guess-icon" aria-hidden="true">反</span>
            <span class="guess-copy"><span class="guess-name">反面</span><span class="guess-en">TAILS</span></span>
          </button>
        </div>
        <p class="flip-hint"><span class="dot" aria-hidden="true"></span>选好预测后，点击硬币抛掷</p>
      </div>
    </section>

    <footer class="rules" aria-label="游戏规则">
      <span>猜对 +10 起</span><i></i><span>连击每次 +5</span><i></i><span>3 次失误结束</span>
    </footer>
    <div class="keyboard-hint">← / → 选择　·　空格抛硬币　·　P 暂停　·　R 重开</div>
  </main>

  <dialog class="game-dialog" id="gameDialog" data-kind="pause" aria-labelledby="dialogTitle" aria-describedby="dialogDescription">
    <div class="dialog-icon" id="dialogIcon" aria-hidden="true">Ⅱ</div>
    <p class="dialog-eyebrow" id="dialogEyebrow">TAKE A BREATH</p>
    <h2 class="dialog-title" id="dialogTitle">游戏暂停</h2>
    <p class="dialog-description" id="dialogDescription">休息一下，随时继续你的连击。</p>
    <div class="dialog-score">
      <span id="dialogScoreLabel">当前得分</span>
      <strong id="finalScore">0</strong>
      <small id="finalStreak">最高连击 ×0</small>
    </div>
    <div class="dialog-actions">
      <button class="primary-button" id="dialogPrimary" type="button">继续游戏</button>
      <button class="secondary-button" id="dialogSecondary" type="button">重新开始</button>
    </div>
  </dialog>

  <script>
    (() => {
      "use strict";

      // ---------- 常量与页面元素 ----------
      const WIN_SCORE = 100;
      const MAX_LIVES = 3;
      const STORAGE_KEY = "neonCoinFlipBest";
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const FLIP_DURATION = reducedMotion ? 400 : 1450;
      const SIDE_NAME = { heads: "正面", tails: "反面" };

      const $ = (id) => document.getElementById(id);
      const scoreEl = $("score");
      const bestScoreEl = $("bestScore");
      const streakEl = $("streak");
      const livesEl = $("lives");
      const statusEl = $("status");
      const progressTrack = $("progressTrack");
      const progressFill = $("progressFill");
      const coinButton = $("coinButton");
      const coin = $("coin");
      const guessButtons = Array.from(document.querySelectorAll(".guess-button"));
      const guessGroup = $("guessButtons");
      const pauseButton = $("pauseButton");
      const restartButton = $("restartButton");
      const pointsPop = $("pointsPop");
      const particles = $("particles");
      const gameDialog = $("gameDialog");
      const dialogPrimary = $("dialogPrimary");
      const dialogSecondary = $("dialogSecondary");

      // ---------- 可变的单局状态 ----------
      let phase = "ready"; // ready / flipping / settling / paused / over
      let score = 0;
      let bestScore = loadBestScore();
      let streak = 0;
      let maxStreak = 0;
      let lives = MAX_LIVES;
      let choice = null;
      let flipCount = 0;
      let flipTimer = null;
      let finishTimer = null;

      // localStorage 在隐私模式下可能不可用，读写都要安全降级。
      function loadBestScore() {
        try {
          const saved = Number.parseInt(localStorage.getItem(STORAGE_KEY), 10);
          return Number.isFinite(saved) && saved >= 0 ? saved : 0;
        } catch (error) {
          return 0;
        }
      }

      function saveBestScore() {
        try {
          localStorage.setItem(STORAGE_KEY, String(bestScore));
        } catch (error) {
          // 无法存储时仍保留本次页面中的最高分，不影响游戏。
        }
      }

      function setStatus(text, tone = "") {
        statusEl.textContent = text;
        statusEl.className = `status${tone ? ` ${tone}` : ""}`;
      }

      // 集中刷新界面，避免分数、按钮状态和实际游戏状态不同步。
      function render() {
        scoreEl.textContent = score;
        bestScoreEl.textContent = bestScore;
        streakEl.textContent = `×${streak}`;
        streakEl.classList.toggle("hot", streak >= 2);

        const progress = Math.min(100, (score / WIN_SCORE) * 100);
        progressFill.style.width = `${progress}%`;
        progressTrack.setAttribute("aria-valuenow", String(Math.round(progress)));

        livesEl.replaceChildren();
        for (let i = 0; i < MAX_LIVES; i += 1) {
          const heart = document.createElement("span");
          heart.className = `heart${i >= lives ? " lost" : ""}`;
          heart.textContent = "♥";
          heart.setAttribute("aria-hidden", "true");
          livesEl.appendChild(heart);
        }
        livesEl.setAttribute("aria-label", `剩余 ${lives} 次机会`);

        const canPlay = phase === "ready";
        guessButtons.forEach((button) => {
          const selected = button.dataset.side === choice;
          button.disabled = !canPlay;
          button.classList.toggle("selected", selected);
          button.setAttribute("aria-pressed", String(selected));
        });

        coinButton.disabled = !canPlay;
        coinButton.classList.toggle("is-ready", canPlay && choice !== null);
        pauseButton.disabled = !canPlay;
      }

      function chooseSide(side) {
        if (phase !== "ready") return;
        choice = side;
        setStatus(`已猜${SIDE_NAME[side]}，点击硬币开抛`);
        render();
      }

      // ---------- 抛掷与计分 ----------
      function flipCoin() {
        if (phase !== "ready") return;

        if (!choice) {
          setStatus("先选择正面或反面，再抛硬币", "error");
          guessGroup.classList.remove("shake");
          void guessGroup.offsetWidth; // 重新触发提示动画
          guessGroup.classList.add("shake");
          return;
        }

        phase = "flipping";
        const outcome = Math.random() < 0.5 ? "heads" : "tails";
        flipCount += 1;

        // 每次至少旋转四圈半，最终角度决定停在哪一面。
        const finalAngle = flipCount * 1800 + (outcome === "tails" ? 180 : 0);
        coin.style.transform = `rotateY(${finalAngle}deg)`;
        coinButton.classList.remove("is-ready");
        coinButton.classList.add("is-flipping");
        setStatus("硬币旋转中…");
        render();

        clearTimeout(flipTimer);
        flipTimer = setTimeout(() => settleCoin(outcome), FLIP_DURATION);
      }

      function settleCoin(outcome) {
        coinButton.classList.remove("is-flipping");
        const guessedRight = choice === outcome;
        let gained = 0;

        if (guessedRight) {
          streak += 1;
          maxStreak = Math.max(maxStreak, streak);
          // 基础 10 分，每多一连击增加 5 分，单次最高 30 分。
          gained = 10 + Math.min(streak - 1, 4) * 5;
          score += gained;

          if (score > bestScore) {
            bestScore = score;
            saveBestScore();
          }

          setStatus(`猜中${SIDE_NAME[outcome]}！连击 ×${streak}，+${gained} 分`, "success");
          showScoreFeedback(gained);
        } else {
          lives -= 1;
          streak = 0;
          setStatus(`结果是${SIDE_NAME[outcome]}，连击中断`, "error");
        }

        scoreEl.classList.remove("bump");
        if (gained) {
          void scoreEl.offsetWidth;
          scoreEl.classList.add("bump");
        }

        const hasWon = score >= WIN_SCORE;
        const hasLost = lives <= 0;
        phase = hasWon || hasLost ? "settling" : "ready";
        render();

        // 稍作停留，让玩家看清最后的硬币面和结果再弹窗。
        if (hasWon || hasLost) {
          finishTimer = setTimeout(() => endGame(hasWon), reducedMotion ? 100 : 650);
        }
      }

      function showScoreFeedback(gained) {
        pointsPop.textContent = `+${gained}`;
        pointsPop.classList.remove("show");
        void pointsPop.offsetWidth;
        pointsPop.classList.add("show");

        if (reducedMotion) return;
        const colors = ["#51edf2", "#a78bfa", "#fb71c7", "#ffd76a"];
        for (let i = 0; i < 14; i += 1) {
          const particle = document.createElement("span");
          const angle = (Math.PI * 2 * i) / 14 + Math.random() * 0.25;
          const distance = 65 + Math.random() * 60;
          particle.className = "particle";
          particle.style.setProperty("--particle-x", `${Math.cos(angle) * distance}px`);
          particle.style.setProperty("--particle-y", `${Math.sin(angle) * distance}px`);
          particle.style.setProperty("--particle-color", colors[i % colors.length]);
          particle.addEventListener("animationend", () => particle.remove(), { once: true });
          particles.appendChild(particle);
        }
      }

      // ---------- 暂停、结算与重开 ----------
      function pauseGame() {
        if (phase !== "ready") return;
        phase = "paused";
        render();
        openDialog("pause");
      }

      function resumeGame() {
        if (phase !== "paused") return;
        phase = "ready";
        if (gameDialog.open) gameDialog.close();
        setStatus(choice ? `继续猜${SIDE_NAME[choice]}，点击硬币开抛` : "先猜正面还是反面");
        render();
        coinButton.focus({ preventScroll: true });
      }

      function endGame(won) {
        phase = "over";
        render();
        openDialog(won ? "win" : "lose");
      }

      function openDialog(kind) {
        const content = {
          pause: {
            icon: "Ⅱ",
            eyebrow: "TAKE A BREATH",
            title: "游戏暂停",
            description: "休息一下，随时继续你的连击。",
            scoreLabel: "当前得分",
            primary: "继续游戏"
          },
          win: {
            icon: "✦",
            eyebrow: "NEON CHAMPION",
            title: "挑战成功！",
            description: "突破 100 分，霓虹好运正当时！",
            scoreLabel: "本局得分",
            primary: "再来一局"
          },
          lose: {
            icon: "×",
            eyebrow: "TRY YOUR LUCK AGAIN",
            title: "游戏结束",
            description: "三次机会已用完，调整手感再挑战。",
            scoreLabel: "本局得分",
            primary: "重新开始"
          }
        }[kind];

        gameDialog.dataset.kind = kind;
        $("dialogIcon").textContent = content.icon;
        $("dialogEyebrow").textContent = content.eyebrow;
        $("dialogTitle").textContent = content.title;
        $("dialogDescription").textContent = content.description;
        $("dialogScoreLabel").textContent = content.scoreLabel;
        $("finalScore").textContent = score;
        $("finalStreak").textContent = `最高连击 ×${maxStreak}`;
        dialogPrimary.textContent = content.primary;
        dialogSecondary.hidden = kind !== "pause";

        if (!gameDialog.open) gameDialog.showModal();
        dialogPrimary.focus({ preventScroll: true });
      }

      function restartGame() {
        clearTimeout(flipTimer);
        clearTimeout(finishTimer);
        flipTimer = null;
        finishTimer = null;

        if (gameDialog.open) gameDialog.close();
        phase = "ready";
        score = 0;
        streak = 0;
        maxStreak = 0;
        lives = MAX_LIVES;
        choice = null;
        flipCount = 0;

        // 立即归位硬币，关闭过渡可避免重开时反向旋转。
        coin.style.transition = "none";
        coin.style.transform = "rotateY(0deg)";
        void coin.offsetWidth;
        coin.style.transition = "";
        coinButton.classList.remove("is-flipping", "is-ready");
        pointsPop.classList.remove("show");
        pointsPop.textContent = "";
        particles.replaceChildren();

        setStatus("先猜正面还是反面");
        render();
      }

      // ---------- 触屏、鼠标与键盘事件 ----------
      guessButtons.forEach((button) => {
        button.addEventListener("click", () => chooseSide(button.dataset.side));
      });
      coinButton.addEventListener("click", flipCoin);
      pauseButton.addEventListener("click", pauseGame);
      restartButton.addEventListener("click", restartGame);

      dialogPrimary.addEventListener("click", () => {
        if (phase === "paused") resumeGame();
        else if (phase === "over") restartGame();
      });
      dialogSecondary.addEventListener("click", restartGame);

      // Escape 可解除暂停，但不能直接关闭胜负结算。
      gameDialog.addEventListener("cancel", (event) => {
        event.preventDefault();
        if (phase === "paused") resumeGame();
      });

      document.addEventListener("keydown", (event) => {
        if (event.repeat) return;

        if (phase === "paused") {
          if (event.code === "KeyP" || event.code === "Escape") {
            event.preventDefault();
            resumeGame();
          } else if (event.code === "KeyR") {
            event.preventDefault();
            restartGame();
          }
          return;
        }

        if (phase === "over") {
          if (event.code === "KeyR" || event.code === "Enter") {
            event.preventDefault();
            restartGame();
          }
          return;
        }

        if (event.code === "ArrowLeft" || event.code === "Digit1") {
          event.preventDefault();
          chooseSide("heads");
        } else if (event.code === "ArrowRight" || event.code === "Digit2") {
          event.preventDefault();
          chooseSide("tails");
        } else if (event.code === "Space" || event.code === "Enter") {
          // 按钮获得焦点时交给浏览器原生 click，避免空格触发两次。
          if (document.activeElement instanceof HTMLButtonElement) return;
          event.preventDefault();
          flipCoin();
        } else if (event.code === "KeyP") {
          event.preventDefault();
          pauseGame();
        } else if (event.code === "KeyR") {
          event.preventDefault();
          restartGame();
        }
      });

      // 禁止双击缩放、双指缩放手势和橡皮筋滚动。
      document.addEventListener("dblclick", (event) => event.preventDefault());
      document.addEventListener("gesturestart", (event) => event.preventDefault());
      document.addEventListener("touchmove", (event) => event.preventDefault(), { passive: false });

      // 切到后台时自动暂停，返回后由玩家主动继续。
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && phase === "ready") pauseGame();
      });

      render();
    })();
  </script>
</body>
</html>
