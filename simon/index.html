<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070912">
  <meta name="description" content="记忆灯：观察霓虹亮灯顺序，按相同顺序轻点，完成 12 轮记忆挑战。">
  <title>记忆灯 · 霓虹记忆挑战</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070912;
      --panel: rgba(17, 22, 39, 0.72);
      --line: rgba(255, 255, 255, 0.09);
      --text: #f3f6ff;
      --muted: #858da6;
      --cyan: #2de2e6;
      --violet: #9b87f5;
      --board-size: min(88vw, 390px, 43dvh);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background: var(--bg);
    }

    body {
      position: fixed;
      inset: 0;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 55vw;
      height: 55vw;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      opacity: 0.14;
    }

    body::before {
      top: -22vw;
      left: -22vw;
      background: var(--cyan);
    }

    body::after {
      right: -28vw;
      bottom: -20vw;
      background: var(--violet);
    }

    button {
      font: inherit;
      color: inherit;
      border: 0;
      cursor: pointer;
      touch-action: none;
    }

    button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    button:disabled {
      cursor: default;
    }

    [hidden] {
      display: none !important;
    }

    .app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 480px;
      height: 100%;
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }

    .topbar {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 11px;
    }

    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      grid-template-columns: repeat(2, 8px);
      gap: 4px;
      padding: 9px;
      border: 1px solid rgba(45, 226, 230, 0.24);
      border-radius: 12px;
      background: rgba(45, 226, 230, 0.07);
      box-shadow: inset 0 0 14px rgba(45, 226, 230, 0.05);
      transform: rotate(45deg);
    }

    .brand-mark i {
      width: 8px;
      height: 8px;
      border-radius: 3px;
      background: var(--cyan);
      box-shadow: 0 0 8px rgba(45, 226, 230, 0.7);
    }

    .brand-mark i:nth-child(2) { background: #9b87f5; box-shadow: 0 0 8px rgba(155, 135, 245, 0.7); }
    .brand-mark i:nth-child(3) { background: #ffc857; box-shadow: 0 0 8px rgba(255, 200, 87, 0.7); }
    .brand-mark i:nth-child(4) { background: #ff4d8d; box-shadow: 0 0 8px rgba(255, 77, 141, 0.7); }

    .eyebrow {
      margin: 0 0 2px;
      color: #707a96;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.2em;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 750;
      line-height: 1.05;
      letter-spacing: 0.08em;
    }

    .header-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
    }

    .icon-button,
    .pause-button {
      height: 40px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.035);
      transition: border-color 160ms ease, background 160ms ease, opacity 160ms ease;
    }

    .icon-button {
      display: grid;
      width: 40px;
      padding: 0;
      place-items: center;
      border-radius: 13px;
      color: #aab3ca;
    }

    .icon-button svg {
      width: 19px;
      height: 19px;
    }

    .pause-button {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 13px;
      border-radius: 13px;
      color: #d9deed;
      font-size: 13px;
      font-weight: 600;
    }

    .pause-button svg {
      width: 15px;
      height: 15px;
    }

    .icon-button:not(:disabled):active,
    .pause-button:not(:disabled):active {
      background: rgba(45, 226, 230, 0.1);
      border-color: rgba(45, 226, 230, 0.32);
    }

    .pause-button:disabled {
      opacity: 0.35;
    }

    .game-main {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      gap: clamp(8px, 1.4dvh, 13px);
      padding-top: 8px;
    }

    .intro {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      letter-spacing: 0.02em;
    }

    .intro strong {
      color: #cbd3e8;
      font-weight: 500;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      position: relative;
      padding: 10px 8px 9px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.018));
      text-align: center;
    }

    .stat::after {
      content: "";
      position: absolute;
      top: 0;
      left: 25%;
      width: 50%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(45, 226, 230, 0.38), transparent);
    }

    .stat-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.12em;
    }

    .stat-value {
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 21px;
      font-weight: 700;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .stat-value small {
      margin-left: 2px;
      color: #646d85;
      font-size: 11px;
      font-weight: 500;
    }

    .stat.best .stat-value {
      color: #ffe19a;
      text-shadow: 0 0 18px rgba(255, 200, 87, 0.2);
    }

    .game-shell {
      display: grid;
      place-items: center;
      min-height: 0;
    }

    .board {
      position: relative;
      display: grid;
      width: var(--board-size);
      height: var(--board-size);
      grid-template-columns: repeat(2, 1fr);
      gap: clamp(10px, 2.8vw, 15px);
      padding: clamp(10px, 2.8vw, 15px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: clamp(27px, 8vw, 40px);
      background:
        radial-gradient(circle at 50% 45%, rgba(45, 226, 230, 0.045), transparent 52%),
        linear-gradient(145deg, rgba(22, 28, 48, 0.95), rgba(9, 12, 24, 0.98));
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      outline: none;
      isolation: isolate;
      transition: box-shadow 250ms ease;
    }

    .board::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -1px;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(45, 226, 230, 0.08), transparent 35%, transparent 65%, rgba(155, 135, 245, 0.08));
      pointer-events: none;
    }

    .board[data-phase="input"] {
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.4), 0 0 35px rgba(45, 226, 230, 0.055), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .pad {
      --rgb: 45, 226, 230;
      position: relative;
      display: grid;
      min-width: 0;
      min-height: 0;
      padding: 0;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(var(--rgb), 0.25);
      border-radius: clamp(19px, 5vw, 27px);
      background:
        radial-gradient(circle at 50% 42%, rgba(var(--rgb), 0.12), transparent 70%),
        linear-gradient(145deg, rgba(var(--rgb), 0.09), rgba(var(--rgb), 0.025));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.055), inset 0 -12px 25px rgba(0, 0, 0, 0.12);
      color: rgb(var(--rgb));
      opacity: 1;
      transition: transform 100ms ease, background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .pad::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.32), transparent 64%);
      opacity: 0;
      transition: opacity 140ms ease;
      pointer-events: none;
    }

    .pad--1 { --rgb: 155, 135, 245; }
    .pad--2 { --rgb: 255, 200, 87; }
    .pad--3 { --rgb: 255, 77, 141; }

    .board[data-phase="input"] .pad:active {
      transform: scale(0.96);
      border-color: rgba(var(--rgb), 0.55);
    }

    .pad.is-lit {
      z-index: 1;
      transform: scale(0.96);
      border-color: rgba(var(--rgb), 0.95);
      background:
        radial-gradient(circle at 50% 44%, rgba(var(--rgb), 0.82), rgba(var(--rgb), 0.34) 70%),
        rgb(var(--rgb));
      box-shadow: 0 0 16px rgba(var(--rgb), 0.55), 0 0 38px rgba(var(--rgb), 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .pad.is-lit::after {
      opacity: 0.48;
    }

    .pad.is-wrong {
      animation: shake 320ms ease;
      border-color: #ff5264;
      background: rgba(255, 50, 72, 0.42);
      box-shadow: 0 0 28px rgba(255, 50, 72, 0.35);
      color: #fff;
    }

    .pad-icon {
      width: 34%;
      height: 34%;
      overflow: visible;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.72;
      filter: drop-shadow(0 0 8px rgba(var(--rgb), 0.28));
      transition: opacity 150ms ease, transform 150ms ease, filter 150ms ease;
    }

    .pad.is-lit .pad-icon {
      color: #fff;
      opacity: 1;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
      transform: scale(1.08);
    }

    .pad-number {
      position: absolute;
      right: 11px;
      bottom: 8px;
      color: rgba(var(--rgb), 0.48);
      font-family: ui-monospace, monospace;
      font-size: 9px;
    }

    .pad.is-lit .pad-number {
      color: rgba(255, 255, 255, 0.7);
    }

    .hub {
      position: absolute;
      z-index: 3;
      top: 50%;
      left: 50%;
      display: flex;
      width: clamp(76px, 23vw, 98px);
      height: clamp(76px, 23vw, 98px);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      background: radial-gradient(circle at 45% 35%, #192137, #090d19 72%);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.65), 0 0 0 6px rgba(7, 9, 18, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.09);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      margin-bottom: 5px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 9px var(--cyan);
    }

    .board[data-phase="showing"] .status-dot,
    .board[data-phase="input"] .status-dot {
      animation: breathe 1.2s ease-in-out infinite;
    }

    .board[data-phase="over"] .status-dot {
      background: #ff5264;
      box-shadow: 0 0 9px #ff5264;
    }

    .hub strong {
      font-size: clamp(13px, 3.7vw, 16px);
      font-weight: 650;
      letter-spacing: 0.08em;
    }

    .hub small {
      margin-top: 4px;
      color: #6f7890;
      font-size: clamp(8px, 2.2vw, 10px);
      white-space: nowrap;
    }

    .play-info {
      width: min(100%, 390px);
      margin: 0 auto;
    }

    .message-row {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 20px;
      gap: 7px;
    }

    .message-row .live-dot {
      flex: 0 0 auto;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #65708a;
    }

    .message {
      margin: 0;
      overflow: hidden;
      color: #939cb4;
      font-size: 12px;
      line-height: 20px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress-track {
      height: 3px;
      margin-top: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.06);
    }

    .progress-fill {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--violet));
      box-shadow: 0 0 12px rgba(45, 226, 230, 0.45);
      transition: width 180ms ease;
    }

    .primary-button {
      display: flex;
      width: min(100%, 390px);
      min-height: 49px;
      align-items: center;
      justify-content: center;
      align-self: center;
      gap: 9px;
      padding: 13px 22px;
      border: 1px solid rgba(45, 226, 230, 0.4);
      border-radius: 16px;
      background: linear-gradient(110deg, rgba(45, 226, 230, 0.2), rgba(105, 102, 224, 0.22));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 8px 28px rgba(17, 172, 183, 0.08);
      color: #eaffff;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.08em;
      transition: transform 120ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .primary-button svg {
      width: 18px;
      height: 18px;
    }

    .primary-button:active {
      transform: scale(0.98);
      background: linear-gradient(110deg, rgba(45, 226, 230, 0.3), rgba(105, 102, 224, 0.3));
    }

    .key-tip {
      margin: -2px 0 0;
      color: #555e75;
      font-size: 10px;
      line-height: 1.4;
      text-align: center;
    }

    kbd {
      display: inline-block;
      min-width: 15px;
      margin: 0 1px;
      padding: 0 3px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.035);
      color: #7e879e;
      font: 9px ui-monospace, monospace;
      line-height: 15px;
    }

    .modal-backdrop {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      place-items: center;
      background: rgba(3, 5, 12, 0.76);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      animation: fade-in 180ms ease both;
    }

    .modal {
      position: relative;
      width: min(100%, 360px);
      padding: 30px 25px 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 0, rgba(45, 226, 230, 0.09), transparent 43%),
        linear-gradient(155deg, #171d31, #0c101e);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.58), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      text-align: center;
      animation: modal-in 260ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .modal-close {
      position: absolute;
      top: 13px;
      right: 13px;
      display: grid;
      width: 32px;
      height: 32px;
      padding: 0;
      place-items: center;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      color: #8992a9;
      font-size: 22px;
      line-height: 1;
    }

    .result-icon,
    .pause-icon {
      display: grid;
      width: 68px;
      height: 68px;
      margin: 0 auto 17px;
      place-items: center;
      border: 1px solid rgba(255, 77, 141, 0.28);
      border-radius: 22px;
      background: rgba(255, 77, 141, 0.08);
      color: #ff7ba8;
      box-shadow: 0 0 32px rgba(255, 77, 141, 0.08);
    }

    .result-icon svg,
    .pause-icon svg {
      width: 31px;
      height: 31px;
    }

    .modal.is-victory .result-icon {
      border-color: rgba(255, 200, 87, 0.36);
      background: rgba(255, 200, 87, 0.09);
      color: #ffd66e;
      box-shadow: 0 0 36px rgba(255, 200, 87, 0.12);
    }

    .pause-icon {
      border-color: rgba(45, 226, 230, 0.27);
      background: rgba(45, 226, 230, 0.07);
      color: var(--cyan);
      box-shadow: 0 0 32px rgba(45, 226, 230, 0.08);
      border-radius: 50%;
    }

    .modal-eyebrow {
      margin: 0 0 7px;
      color: #737e98;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
    }

    .modal h2 {
      margin: 0;
      font-size: 26px;
      font-weight: 750;
      letter-spacing: 0.05em;
    }

    .modal-description {
      margin: 11px auto 20px;
      color: #929cb4;
      font-size: 13px;
      line-height: 1.7;
    }

    .new-record {
      display: inline-block;
      margin: -7px 0 15px;
      padding: 4px 10px;
      border: 1px solid rgba(255, 200, 87, 0.22);
      border-radius: 99px;
      background: rgba(255, 200, 87, 0.07);
      color: #ffd66e;
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .result-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      margin-bottom: 20px;
      padding: 14px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .result-stats > div + div {
      border-left: 1px solid var(--line);
    }

    .result-stats span {
      display: block;
      margin-bottom: 5px;
      color: #737e98;
      font-size: 10px;
    }

    .result-stats strong {
      font: 700 23px ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    .modal .primary-button {
      width: 100%;
    }

    .secondary-button {
      margin-top: 12px;
      padding: 8px 16px;
      background: transparent;
      color: #7e88a0;
      font-size: 12px;
    }

    .pause-summary {
      margin: -7px 0 21px;
      color: #c2cade;
      font: 12px ui-monospace, monospace;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.45; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modal-in {
      from { opacity: 0; transform: translateY(14px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-height: 620px) and (orientation: portrait) {
      :root { --board-size: min(80vw, 43dvh); }
      .app { padding-top: max(9px, env(safe-area-inset-top)); padding-bottom: max(9px, env(safe-area-inset-bottom)); }
      .intro, .key-tip { display: none; }
      .game-main { gap: 8px; padding-top: 6px; }
      .stat { padding-top: 7px; padding-bottom: 7px; }
      .primary-button { min-height: 44px; padding-top: 10px; padding-bottom: 10px; }
    }

    @media (orientation: landscape) and (max-height: 540px) {
      :root { --board-size: min(42vw, 70dvh, 300px); }
      .app { max-width: 820px; padding-top: max(9px, env(safe-area-inset-top)); padding-bottom: max(9px, env(safe-area-inset-bottom)); }
      .eyebrow, .key-tip { display: none; }
      h1 { font-size: 21px; }
      .brand-mark { transform: rotate(45deg) scale(0.85); }
      .game-main {
        display: grid;
        grid-template-columns: minmax(210px, 1fr) auto;
        grid-template-rows: auto auto auto auto;
        align-content: center;
        gap: 10px 28px;
        padding-top: 5px;
      }
      .intro { grid-column: 1; text-align: left; }
      .stats { grid-column: 1; }
      .game-shell { grid-column: 2; grid-row: 1 / 5; }
      .play-info { grid-column: 1; }
      .primary-button { grid-column: 1; min-height: 42px; padding: 9px 18px; }
      .modal { padding: 20px 24px 18px; }
      .result-icon, .pause-icon { width: 48px; height: 48px; margin-bottom: 10px; border-radius: 16px; }
      .result-icon svg, .pause-icon svg { width: 24px; height: 24px; }
      .modal h2 { font-size: 22px; }
      .modal-description { margin: 7px auto 12px; line-height: 1.45; }
      .result-stats { margin-bottom: 13px; padding: 9px 0; }
      .new-record { margin-bottom: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand" aria-label="记忆灯">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <div>
          <p class="eyebrow">霓虹记忆挑战</p>
          <h1>记忆灯</h1>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-button" id="soundButton" type="button" aria-label="关闭音效" aria-pressed="true" title="关闭音效">
          <svg id="soundOnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/>
          </svg>
          <svg id="soundOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
            <path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 5M21 9l-5 5"/>
          </svg>
        </button>
        <button class="pause-button" id="pauseButton" type="button" disabled aria-label="暂停游戏">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          <span>暂停</span>
        </button>
      </div>
    </header>

    <main class="game-main">
      <p class="intro">观察亮灯顺序，<strong>再按相同顺序轻点</strong></p>

      <section class="stats" aria-label="游戏数据">
        <div class="stat">
          <span class="stat-label">当前轮次</span>
          <strong class="stat-value"><span id="roundValue">0</span><small>/ 12</small></strong>
        </div>
        <div class="stat">
          <span class="stat-label">当前得分</span>
          <strong class="stat-value" id="scoreValue">0</strong>
        </div>
        <div class="stat best">
          <span class="stat-label">最高分</span>
          <strong class="stat-value" id="bestValue">0</strong>
        </div>
      </section>

      <section class="game-shell" aria-label="记忆灯游戏区">
        <div class="board" id="board" data-phase="idle" tabindex="-1">
          <button class="pad pad--0" type="button" data-pad="0" disabled aria-label="青色圆环灯，键盘 1">
            <svg class="pad-icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="12"/></svg>
            <span class="pad-number" aria-hidden="true">1</span>
          </button>
          <button class="pad pad--1" type="button" data-pad="1" disabled aria-label="紫色三角灯，键盘 2">
            <svg class="pad-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 11 38 36H10Z"/></svg>
            <span class="pad-number" aria-hidden="true">2</span>
          </button>
          <button class="pad pad--2" type="button" data-pad="2" disabled aria-label="金色方形灯，键盘 3">
            <svg class="pad-icon" viewBox="0 0 48 48" aria-hidden="true"><rect x="12" y="12" width="24" height="24" rx="4"/></svg>
            <span class="pad-number" aria-hidden="true">3</span>
          </button>
          <button class="pad pad--3" type="button" data-pad="3" disabled aria-label="粉色星形灯，键盘 4">
            <svg class="pad-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="m24 9 4.4 9.3 10.1 1.3-7.4 7 1.9 10-9-4.9-9 4.9 1.9-10-7.4-7 10.1-1.3Z"/></svg>
            <span class="pad-number" aria-hidden="true">4</span>
          </button>
          <div class="hub" aria-hidden="true">
            <span class="status-dot"></span>
            <strong id="statusText">准备</strong>
            <small id="statusHint">12 轮挑战</small>
          </div>
        </div>
      </section>

      <section class="play-info" aria-label="游戏进度">
        <div class="message-row">
          <span class="live-dot" aria-hidden="true"></span>
          <p class="message" id="message" aria-live="polite">从一盏灯开始，逐轮挑战你的记忆</p>
        </div>
        <div class="progress-track" aria-hidden="true"><span class="progress-fill" id="progressFill"></span></div>
      </section>

      <button class="primary-button" id="startButton" type="button">
        <span id="startButtonText">开始游戏</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
      </button>
      <p class="key-tip">触屏轻点灯板，也可按 <kbd>1</kbd>–<kbd>4</kbd> 操作 · <kbd>P</kbd> 暂停</p>
    </main>
  </div>

  <div class="modal-backdrop" id="resultModal" hidden>
    <section class="modal" id="resultCard" role="dialog" aria-modal="true" aria-labelledby="resultTitle" aria-describedby="resultDescription">
      <button class="modal-close" id="resultCloseButton" type="button" aria-label="关闭结果弹窗">×</button>
      <div class="result-icon" aria-hidden="true">
        <svg id="failureIcon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 26 24 6M10 8l2 2m8 12 2 2M5 16h3m16 0h3M16 5v3m0 16v3"/></svg>
        <svg id="victoryIcon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M10 5h12v6a6 6 0 0 1-12 0V5Z"/><path d="M10 8H5v2a5 5 0 0 0 5 5m12-7h5v2a5 5 0 0 1-5 5M16 17v5m-5 5h10m-7-5h4"/></svg>
      </div>
      <p class="modal-eyebrow" id="resultEyebrow">记忆中断</p>
      <h2 id="resultTitle">灯光熄灭了</h2>
      <p class="modal-description" id="resultDescription">差一点！记住亮灯顺序，再试一次吧。</p>
      <span class="new-record" id="newRecordBadge" hidden>✦ 新的最高纪录</span>
      <div class="result-stats">
        <div><span>本局得分</span><strong id="resultScore">0</strong></div>
        <div><span>到达轮次</span><strong id="resultRound">0</strong></div>
      </div>
      <button class="primary-button" id="restartButton" type="button">
        <span id="restartButtonText">再来一局</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>
      </button>
    </section>
  </div>

  <div class="modal-backdrop" id="pauseModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="pauseTitle" aria-describedby="pauseDescription">
      <div class="pause-icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="currentColor"><rect x="9" y="7" width="5" height="18" rx="1.5"/><rect x="18" y="7" width="5" height="18" rx="1.5"/></svg>
      </div>
      <p class="modal-eyebrow">进度已保留</p>
      <h2 id="pauseTitle">稍作休息</h2>
      <p class="modal-description" id="pauseDescription">灯光和顺序都在等你，准备好再继续。</p>
      <p class="pause-summary">第 <span id="pauseRound">0</span> 轮 · <span id="pauseScore">0</span> 分</p>
      <button class="primary-button" id="resumeButton" type="button">
        <span>继续游戏</span>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m8 5 11 7-11 7V5Z"/></svg>
      </button>
      <button class="secondary-button" id="pauseRestartButton" type="button">重新开始本局</button>
    </section>
  </div>

  <script>
    (() => {
      "use strict";

      // 基础配置与页面元素
      const MAX_ROUNDS = 12;
      const BEST_KEY = "memory-lights-best-v1";
      const SOUND_KEY = "memory-lights-sound-v1";
      const frequencies = [261.63, 329.63, 392.0, 523.25];

      const board = document.getElementById("board");
      const pads = [...document.querySelectorAll("[data-pad]")];
      const roundValue = document.getElementById("roundValue");
      const scoreValue = document.getElementById("scoreValue");
      const bestValue = document.getElementById("bestValue");
      const statusText = document.getElementById("statusText");
      const statusHint = document.getElementById("statusHint");
      const message = document.getElementById("message");
      const progressFill = document.getElementById("progressFill");
      const startButton = document.getElementById("startButton");
      const startButtonText = document.getElementById("startButtonText");
      const pauseButton = document.getElementById("pauseButton");
      const soundButton = document.getElementById("soundButton");
      const soundOnIcon = document.getElementById("soundOnIcon");
      const soundOffIcon = document.getElementById("soundOffIcon");
      const resultModal = document.getElementById("resultModal");
      const resultCard = document.getElementById("resultCard");
      const pauseModal = document.getElementById("pauseModal");

      let phase = "idle"; // idle / showing / input / transition / paused / over / won
      let pausedFrom = null;
      let sequence = [];
      let inputIndex = 0;
      let round = 0;
      let score = 0;
      let bestScore = readNumber(BEST_KEY);
      let runId = 0;
      let activeWait = null;
      let newRecord = false;
      let soundEnabled = readSoundSetting();
      let audioContext = null;
      const feedbackTimers = new Map();

      function readNumber(key) {
        try {
          const value = Number.parseInt(localStorage.getItem(key) || "0", 10);
          return Number.isFinite(value) && value > 0 ? value : 0;
        } catch (_) {
          return 0;
        }
      }

      function readSoundSetting() {
        try {
          return localStorage.getItem(SOUND_KEY) !== "off";
        } catch (_) {
          return true;
        }
      }

      function saveSetting(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (_) {
          // 隐私模式下存储不可用时，游戏仍可正常运行。
        }
      }

      // 使用 Web Audio 合成短音效，不加载任何音频文件。
      function ensureAudio() {
        if (!soundEnabled) return null;
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return null;
        if (!audioContext) audioContext = new AudioCtor();
        if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
        return audioContext;
      }

      function playTone(frequency, duration = 0.18, delay = 0, type = "sine", volume = 0.1) {
        const context = ensureAudio();
        if (!context) return;
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        const startAt = context.currentTime + delay;
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, startAt);
        gain.gain.setValueAtTime(0.0001, startAt);
        gain.gain.exponentialRampToValueAtTime(volume, startAt + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.start(startAt);
        oscillator.stop(startAt + duration + 0.03);
      }

      function playPadSound(index) {
        playTone(frequencies[index], 0.2, 0, "sine", 0.11);
        playTone(frequencies[index] * 2, 0.12, 0, "sine", 0.025);
      }

      function playSuccessSound() {
        playTone(659.25, 0.16, 0, "sine", 0.07);
        playTone(880, 0.22, 0.09, "sine", 0.07);
      }

      function playFailureSound() {
        playTone(165, 0.34, 0, "sawtooth", 0.065);
        playTone(110, 0.42, 0.09, "sawtooth", 0.055);
      }

      function playVictorySound() {
        [523.25, 659.25, 783.99, 1046.5].forEach((note, index) => {
          playTone(note, 0.34, index * 0.11, "sine", 0.075);
        });
      }

      function updateSoundButton() {
        soundOnIcon.hidden = !soundEnabled;
        soundOffIcon.hidden = soundEnabled;
        soundButton.setAttribute("aria-pressed", String(soundEnabled));
        const label = soundEnabled ? "关闭音效" : "开启音效";
        soundButton.setAttribute("aria-label", label);
        soundButton.title = label;
      }

      function updateStats() {
        roundValue.textContent = String(round);
        scoreValue.textContent = score.toLocaleString("zh-CN");
        bestValue.textContent = bestScore.toLocaleString("zh-CN");
      }

      function addScore(points) {
        score += points;
        if (score > bestScore) {
          bestScore = score;
          newRecord = true;
          saveSetting(BEST_KEY, String(bestScore));
        }
        updateStats();
      }

      function setMessage(text) {
        message.textContent = text;
      }

      function updateUI() {
        board.dataset.phase = phase;
        pads.forEach(pad => { pad.disabled = phase !== "input"; });
        pauseButton.disabled = !["showing", "input", "transition"].includes(phase);

        const views = {
          idle: ["准备", "12 轮挑战"],
          showing: ["观察", `第 ${round} / ${MAX_ROUNDS} 轮`],
          input: ["请重复", `${inputIndex} / ${sequence.length} 步`],
          transition: ["正确", `第 ${round} 轮完成`],
          paused: ["已暂停", `第 ${round} / ${MAX_ROUNDS} 轮`],
          over: ["熄灭", "再试一次"],
          won: ["完成", "全部点亮"]
        };
        const view = views[phase] || views.idle;
        statusText.textContent = view[0];
        statusHint.textContent = view[1];
        startButtonText.textContent = phase === "idle" ? "开始游戏" : "重新开始";
        updateStats();
      }

      function updateProgress() {
        const percent = sequence.length && ["input", "transition", "won"].includes(phase)
          ? (inputIndex / sequence.length) * 100
          : 0;
        progressFill.style.width = `${percent}%`;
      }

      function clearPadLights() {
        feedbackTimers.forEach(timer => clearTimeout(timer));
        feedbackTimers.clear();
        pads.forEach(pad => pad.classList.remove("is-lit", "is-wrong"));
      }

      function lightDemoPad(index) {
        clearPadLights();
        pads[index].classList.add("is-lit");
      }

      function flashUserPad(index, isWrong = false) {
        const pad = pads[index];
        clearTimeout(feedbackTimers.get(index));
        pad.classList.remove("is-lit", "is-wrong");
        // 强制重启动画，快速重复点击同一盏灯也有清晰反馈。
        void pad.offsetWidth;
        pad.classList.add(isWrong ? "is-wrong" : "is-lit");
        const timer = setTimeout(() => {
          pad.classList.remove("is-lit", "is-wrong");
          feedbackTimers.delete(index);
        }, isWrong ? 380 : 190);
        feedbackTimers.set(index, timer);
      }

      // 可暂停的计时器：暂停时记录剩余时间，继续后接着倒数。
      function wait(duration, token) {
        return new Promise(resolve => {
          const task = {
            remaining: duration,
            timer: null,
            startedAt: 0,
            finish: null
          };
          task.finish = () => {
            if (task.timer) clearTimeout(task.timer);
            task.timer = null;
            if (activeWait === task) activeWait = null;
            resolve(token === runId);
          };
          activeWait = task;
          armWait(task);
        });
      }

      function armWait(task) {
        task.startedAt = performance.now();
        task.timer = setTimeout(task.finish, task.remaining);
      }

      function freezeWait() {
        if (!activeWait || !activeWait.timer) return;
        clearTimeout(activeWait.timer);
        activeWait.timer = null;
        activeWait.remaining = Math.max(0, activeWait.remaining - (performance.now() - activeWait.startedAt));
      }

      function cancelWait() {
        if (activeWait) activeWait.finish();
      }

      async function beginRound(token) {
        if (token !== runId) return;
        round += 1;
        sequence.push(Math.floor(Math.random() * pads.length));
        inputIndex = 0;
        phase = "showing";
        updateUI();
        updateProgress();
        setMessage(`观察亮灯 · 本轮共 ${round} 步`);

        if (!await wait(520, token)) return;
        const lightDuration = Math.max(250, 370 - round * 8);
        const gapDuration = Math.max(120, 190 - round * 4);

        for (const index of sequence) {
          if (token !== runId) return;
          lightDemoPad(index);
          playPadSound(index);
          if (!await wait(lightDuration, token)) return;
          clearPadLights();
          if (!await wait(gapDuration, token)) return;
        }

        if (token !== runId) return;
        phase = "input";
        inputIndex = 0;
        updateUI();
        updateProgress();
        setMessage("轮到你了 · 按相同顺序轻点");
      }

      async function completeRound(token) {
        phase = "transition";
        updateUI();
        updateProgress();
        setMessage(round >= MAX_ROUNDS ? "全部顺序正确！" : `第 ${round} 轮完成 · 准备增加一盏灯`);
        playSuccessSound();
        if (!await wait(800, token)) return;

        if (round >= MAX_ROUNDS) {
          phase = "won";
          updateUI();
          playVictorySound();
          showResult(true);
        } else {
          beginRound(token);
        }
      }

      async function handleWrongPad(index, token) {
        phase = "over";
        flashUserPad(index, true);
        updateUI();
        updateProgress();
        setMessage(`顺序错误 · 你到达了第 ${round} 轮`);
        playFailureSound();
        if (navigator.vibrate) navigator.vibrate(60);
        if (!await wait(480, token)) return;
        showResult(false);
      }

      function handlePadInput(index) {
        if (phase !== "input") return;
        ensureAudio();

        if (index === sequence[inputIndex]) {
          flashUserPad(index);
          playPadSound(index);
          if (navigator.vibrate) navigator.vibrate(10);
          inputIndex += 1;
          addScore(10);

          if (inputIndex === sequence.length) {
            addScore(round * 5); // 完成整轮可获得随轮次增长的奖励分。
            completeRound(runId);
          } else {
            updateUI();
            updateProgress();
            setMessage(`正确 · 还需点亮 ${sequence.length - inputIndex} 盏`);
          }
        } else {
          handleWrongPad(index, runId);
        }
      }

      function showResult(victory) {
        resultCard.classList.toggle("is-victory", victory);
        document.getElementById("failureIcon").hidden = victory;
        document.getElementById("victoryIcon").hidden = !victory;
        document.getElementById("resultEyebrow").textContent = victory ? "挑战完成" : "记忆中断";
        document.getElementById("resultTitle").textContent = victory ? "全部点亮！" : "灯光熄灭了";
        document.getElementById("resultDescription").textContent = victory
          ? `出色的记忆力！你已完成全部 ${MAX_ROUNDS} 轮挑战。`
          : "差一点！记住亮灯顺序，再试一次吧。";
        document.getElementById("resultScore").textContent = score.toLocaleString("zh-CN");
        document.getElementById("resultRound").textContent = `${round} / ${MAX_ROUNDS}`;
        document.getElementById("newRecordBadge").hidden = !newRecord;
        document.getElementById("restartButtonText").textContent = victory ? "再挑战一次" : "再来一局";
        resultModal.hidden = false;
        focusModal(resultModal, document.getElementById("restartButton"));
      }

      function startGame() {
        runId += 1;
        const token = runId;
        cancelWait();
        clearPadLights();
        resultModal.hidden = true;
        pauseModal.hidden = true;
        sequence = [];
        inputIndex = 0;
        round = 0;
        score = 0;
        newRecord = false;
        pausedFrom = null;
        phase = "showing";
        updateUI();
        updateProgress();
        ensureAudio();
        startButton.blur();
        beginRound(token);
      }

      function pauseGame() {
        if (!["showing", "input", "transition"].includes(phase)) return;
        pausedFrom = phase;
        phase = "paused";
        freezeWait();
        updateUI();
        document.getElementById("pauseRound").textContent = String(round);
        document.getElementById("pauseScore").textContent = score.toLocaleString("zh-CN");
        pauseModal.hidden = false;
        focusModal(pauseModal, document.getElementById("resumeButton"));
      }

      function resumeGame() {
        if (phase !== "paused") return;
        phase = pausedFrom || "input";
        pausedFrom = null;
        pauseModal.hidden = true;
        updateUI();
        updateProgress();
        ensureAudio();
        if (activeWait && !activeWait.timer) armWait(activeWait);
        board.focus({ preventScroll: true });
      }

      function focusModal(modal, target) {
        requestAnimationFrame(() => {
          if (!modal.hidden) target.focus({ preventScroll: true });
        });
      }

      function trapFocus(event, modal) {
        const focusable = [...modal.querySelectorAll("button:not(:disabled), [href], [tabindex]:not([tabindex='-1'])")]
          .filter(element => !element.hidden);
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }

      pads.forEach((pad, index) => {
        pad.addEventListener("click", () => handlePadInput(index));
        pad.addEventListener("contextmenu", event => event.preventDefault());
      });

      startButton.addEventListener("click", startGame);
      document.getElementById("restartButton").addEventListener("click", startGame);
      document.getElementById("pauseRestartButton").addEventListener("click", startGame);
      pauseButton.addEventListener("click", pauseGame);
      document.getElementById("resumeButton").addEventListener("click", resumeGame);
      document.getElementById("resultCloseButton").addEventListener("click", () => {
        resultModal.hidden = true;
        startButton.focus({ preventScroll: true });
      });

      soundButton.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        saveSetting(SOUND_KEY, soundEnabled ? "on" : "off");
        updateSoundButton();
        if (soundEnabled) playTone(523.25, 0.12, 0, "sine", 0.07);
      });

      // 键盘 1–4 对应四盏灯，P 或 Esc 控制暂停。
      document.addEventListener("keydown", event => {
        const openModal = !resultModal.hidden ? resultModal : (!pauseModal.hidden ? pauseModal : null);
        if (event.key === "Tab" && openModal) {
          trapFocus(event, openModal);
          return;
        }
        if (event.repeat) return;

        if (phase === "paused" && (event.key.toLowerCase() === "p" || event.key === "Escape")) {
          event.preventDefault();
          resumeGame();
          return;
        }
        if (openModal) return;

        if (["1", "2", "3", "4"].includes(event.key)) {
          event.preventDefault();
          handlePadInput(Number(event.key) - 1);
        } else if ((event.key.toLowerCase() === "p" || event.key === "Escape") && ["showing", "input", "transition"].includes(phase)) {
          event.preventDefault();
          pauseGame();
        } else if (event.key === "Enter" && phase === "idle" && document.activeElement === document.body) {
          startGame();
        }
      });

      // 禁止页面拖动、双击缩放及双指缩放手势。
      document.addEventListener("touchmove", event => event.preventDefault(), { passive: false });
      document.addEventListener("dblclick", event => event.preventDefault(), { passive: false });
      document.addEventListener("gesturestart", event => event.preventDefault(), { passive: false });

      // 切到后台时自动暂停，避免玩家错过演示顺序。
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && ["showing", "input", "transition"].includes(phase)) pauseGame();
      });

      updateSoundButton();
      updateUI();
      updateProgress();
    })();
  </script>
</body>
</html>
