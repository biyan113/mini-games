<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070914">
  <meta name="color-scheme" content="dark">
  <title>霓虹跳棋 · 单人挑战</title>
  <style>
    :root {
      --bg: #070914;
      --panel: rgba(18, 23, 44, 0.78);
      --line: rgba(143, 164, 255, 0.16);
      --text: #f3f7ff;
      --muted: #8c96b8;
      --cyan: #55f6ff;
      --cyan-strong: #13dcea;
      --violet: #9b7bff;
      --pink: #ff6fd8;
      --danger: #ff8ba7;
      --frame-pad: clamp(7px, 2vw, 12px);
      --board-size: min(92vw, clamp(230px, calc(100dvh - 294px), 440px));
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }

    body {
      position: fixed;
      inset: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 8%, rgba(116, 73, 255, 0.22), transparent 34%),
        radial-gradient(circle at 90% 85%, rgba(0, 225, 255, 0.12), transparent 32%),
        linear-gradient(145deg, #090b19 0%, #050710 58%, #090817 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(114, 139, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(114, 139, 255, 0.045) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }

    button {
      font: inherit;
    }

    button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    .app {
      position: relative;
      width: 100%;
      max-width: 520px;
      height: 100%;
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(7px, 1.2dvh, 12px);
    }

    .topbar,
    .stats,
    .controls,
    .rules {
      width: var(--board-size);
      flex: 0 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 45px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(85, 246, 255, 0.24);
      border-radius: 13px;
      color: var(--cyan);
      background: linear-gradient(145deg, rgba(85, 246, 255, 0.1), rgba(155, 123, 255, 0.1));
      box-shadow: inset 0 0 16px rgba(85, 246, 255, 0.05), 0 0 20px rgba(85, 246, 255, 0.06);
    }

    .brand-mark svg {
      width: 26px;
      height: 26px;
    }

    .brand-line {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 5.4vw, 27px);
      line-height: 1.1;
      letter-spacing: 0.08em;
      font-weight: 800;
    }

    .brand-tag {
      padding: 2px 5px;
      border: 1px solid rgba(155, 123, 255, 0.32);
      border-radius: 5px;
      color: #bdaaff;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .brand-subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.28em;
    }

    .top-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #a9b3d1;
      font-size: 11px;
      white-space: nowrap;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 9px var(--cyan);
      animation: breathe 2.2s ease-in-out infinite;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat-card {
      position: relative;
      min-width: 0;
      padding: 9px 6px 8px;
      overflow: hidden;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: linear-gradient(145deg, rgba(25, 31, 57, 0.86), rgba(13, 17, 34, 0.8));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025);
    }

    .stat-card::after {
      content: "";
      position: absolute;
      left: 28%;
      right: 28%;
      bottom: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent, var(--cyan)), transparent);
      opacity: 0.7;
    }

    .stat-card:nth-child(2) {
      --accent: var(--violet);
    }

    .stat-card:nth-child(3) {
      --accent: var(--pink);
    }

    .stat-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.12em;
    }

    .stat-value {
      display: block;
      color: var(--text);
      font-size: clamp(19px, 5vw, 24px);
      line-height: 1.1;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .stat-value.bump {
      animation: score-bump 0.28s ease-out;
    }

    .board-area {
      flex: 0 0 auto;
      width: var(--board-size);
    }

    .board-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      padding: var(--frame-pad);
      border: 1px solid rgba(112, 147, 255, 0.23);
      border-radius: clamp(20px, 6vw, 30px);
      background:
        radial-gradient(circle at 50% 42%, rgba(56, 71, 125, 0.25), transparent 60%),
        linear-gradient(145deg, rgba(24, 30, 57, 0.97), rgba(10, 14, 29, 0.98));
      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.42),
        0 0 32px rgba(67, 91, 255, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.055),
        inset 0 0 36px rgba(0, 0, 0, 0.22);
      isolation: isolate;
    }

    .board-frame::before {
      content: "";
      position: absolute;
      inset: 5px;
      z-index: -1;
      border: 1px solid rgba(85, 246, 255, 0.035);
      border-radius: inherit;
      pointer-events: none;
    }

    .board {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(7, 1fr);
      touch-action: none;
    }

    .cell-placeholder {
      visibility: hidden;
      pointer-events: none;
    }

    .cell {
      position: relative;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: inherit;
      background: transparent;
      cursor: pointer;
      touch-action: none;
    }

    .cell:focus-visible {
      outline: 2px solid rgba(85, 246, 255, 0.85);
      outline-offset: -2px;
    }

    .hole {
      position: absolute;
      inset: 11%;
      border: 1px solid rgba(127, 153, 224, 0.12);
      border-radius: 50%;
      background: radial-gradient(circle at 50% 62%, #10172b 0%, #080c19 58%, #04060e 100%);
      box-shadow:
        inset 0 4px 7px rgba(0, 0, 0, 0.82),
        0 1px 0 rgba(170, 190, 255, 0.07);
      transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
    }

    .peg {
      position: absolute;
      inset: 6%;
      z-index: 2;
      border: 1px solid rgba(180, 252, 255, 0.42);
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.4);
      pointer-events: none;
      background:
        radial-gradient(circle at 32% 24%, rgba(255, 255, 255, 0.96) 0 3%, rgba(197, 253, 255, 0.8) 5%, transparent 18%),
        radial-gradient(circle at 35% 30%, #79f9ff 0%, #24cbdf 28%, #5966e9 62%, #332066 88%, #191337 100%);
      box-shadow:
        0 0 9px rgba(85, 246, 255, 0.65),
        0 0 20px rgba(85, 151, 255, 0.25),
        0 6px 7px rgba(0, 0, 0, 0.42),
        inset -4px -6px 10px rgba(16, 9, 65, 0.48),
        inset 2px 2px 5px rgba(255, 255, 255, 0.25);
      transition: transform 0.16s ease, opacity 0.16s ease, filter 0.16s, box-shadow 0.16s;
    }

    .peg::after {
      content: "";
      position: absolute;
      inset: 12%;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 50%;
    }

    .cell.has-peg .peg {
      opacity: 1;
      transform: scale(1);
    }

    .cell.has-peg:hover .peg {
      filter: brightness(1.12);
      transform: translateY(-2px) scale(1.025);
    }

    .cell.is-selected::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      border: 2px solid rgba(255, 255, 255, 0.88);
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 9px var(--cyan), inset 0 0 8px rgba(85, 246, 255, 0.25);
      animation: selected-ring 1.35s ease-in-out infinite;
    }

    .cell.is-selected .peg {
      filter: brightness(1.2) saturate(1.15);
      transform: scale(1.07);
      box-shadow:
        0 0 12px rgba(85, 246, 255, 0.95),
        0 0 26px rgba(155, 123, 255, 0.6),
        0 6px 8px rgba(0, 0, 0, 0.45),
        inset -4px -6px 10px rgba(16, 9, 65, 0.45);
    }

    .cell.is-target .hole {
      border-color: rgba(85, 246, 255, 0.7);
      background: radial-gradient(circle, rgba(31, 108, 129, 0.38), #080e1c 72%);
      box-shadow: inset 0 0 10px rgba(85, 246, 255, 0.16), 0 0 12px rgba(85, 246, 255, 0.18);
    }

    .target-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 3;
      width: 17%;
      aspect-ratio: 1;
      border-radius: 50%;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.5);
      pointer-events: none;
      background: #b9fcff;
      box-shadow: 0 0 7px var(--cyan), 0 0 14px var(--cyan);
    }

    .cell.is-target .target-dot {
      opacity: 1;
      animation: target-pulse 1.15s ease-in-out infinite;
    }

    .cell.just-moved .peg {
      animation: peg-land 0.36s cubic-bezier(0.2, 1.6, 0.45, 1);
    }

    .fx-layer {
      position: absolute;
      inset: var(--frame-pad);
      z-index: 4;
      overflow: visible;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--particle-color, var(--cyan));
      box-shadow: 0 0 6px var(--particle-color, var(--cyan));
      animation: particle-fly 0.58s ease-out forwards;
    }

    .ghost-peg {
      position: absolute;
      width: 10.5%;
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 35% 28%, #ffb3e9, #a358d3 40%, #38205f 85%);
      box-shadow: 0 0 14px rgba(255, 111, 216, 0.65);
      animation: captured 0.38s ease-in forwards;
    }

    .status-bar {
      min-height: 26px;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: #a8b3d1;
      font-size: 11px;
    }

    .status-dot {
      flex: 0 0 auto;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 7px rgba(85, 246, 255, 0.8);
    }

    .status-bar[data-tone="warn"] .status-dot {
      background: var(--danger);
      box-shadow: 0 0 7px rgba(255, 139, 167, 0.75);
    }

    .status-text {
      min-width: 0;
      flex: 1;
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .timer {
      flex: 0 0 auto;
      color: #7682a5;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.06em;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .control-btn {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s, border-color 0.15s;
    }

    .control-btn:active,
    .resume-btn:active,
    .modal-restart:active {
      transform: scale(0.97);
    }

    .control-btn svg {
      width: 17px;
      height: 17px;
    }

    .control-btn.primary {
      border: 1px solid rgba(114, 250, 255, 0.55);
      color: #06151d;
      background: linear-gradient(135deg, #83f9ff, #42dce9 65%, #64c9ff);
      box-shadow: 0 6px 18px rgba(27, 211, 229, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .control-btn.secondary {
      border: 1px solid rgba(143, 164, 255, 0.22);
      color: #c5cee8;
      background: rgba(22, 28, 50, 0.8);
    }

    .control-btn:hover {
      filter: brightness(1.08);
    }

    .control-btn:disabled {
      opacity: 0.45;
      cursor: default;
      filter: none;
    }

    .rules {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #7f8aa9;
      font-size: 10px;
      line-height: 1.55;
      text-align: left;
    }

    .rules p {
      margin: 0;
    }

    .rules strong {
      color: #b6c2df;
      font-weight: 650;
    }

    .rule-icon {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(155, 123, 255, 0.35);
      border-radius: 50%;
      color: #b8a5ff;
      font-family: Georgia, serif;
      font-size: 12px;
      font-weight: bold;
    }

    .keyboard-hint {
      display: none;
      margin: -3px 0 0;
      color: #596584;
      font-size: 10px;
      letter-spacing: 0.05em;
    }

    .pause-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border-radius: inherit;
      text-align: center;
      background: rgba(6, 9, 21, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: fade-in 0.2s ease-out;
    }

    .pause-symbol {
      width: 54px;
      height: 54px;
      margin-bottom: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid rgba(85, 246, 255, 0.3);
      border-radius: 18px;
      background: rgba(85, 246, 255, 0.07);
      box-shadow: 0 0 25px rgba(85, 246, 255, 0.1);
    }

    .pause-symbol i {
      width: 5px;
      height: 21px;
      border-radius: 3px;
      background: var(--cyan);
      box-shadow: 0 0 8px rgba(85, 246, 255, 0.6);
    }

    .pause-overlay h2 {
      margin: 0 0 6px;
      font-size: 20px;
      letter-spacing: 0.08em;
    }

    .pause-overlay p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .resume-btn {
      min-width: 130px;
      min-height: 42px;
      border: 1px solid rgba(85, 246, 255, 0.48);
      border-radius: 12px;
      color: #07171e;
      background: linear-gradient(135deg, #8afaff, #43dce9);
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(3, 5, 13, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: fade-in 0.24s ease-out;
    }

    .modal-card {
      position: relative;
      width: min(88vw, 370px);
      padding: 28px 24px 24px;
      overflow: hidden;
      border: 1px solid rgba(129, 153, 255, 0.28);
      border-radius: 26px;
      text-align: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(115, 88, 226, 0.2), transparent 45%),
        linear-gradient(155deg, rgba(27, 33, 61, 0.98), rgba(10, 14, 29, 0.99));
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55), 0 0 36px rgba(110, 88, 255, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      animation: modal-rise 0.36s cubic-bezier(0.2, 0.9, 0.3, 1.15);
    }

    .result-emblem {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 139, 167, 0.3);
      border-radius: 23px;
      color: var(--danger);
      background: rgba(255, 139, 167, 0.07);
      box-shadow: 0 0 28px rgba(255, 139, 167, 0.1);
      transform: rotate(-4deg);
    }

    .modal.is-win .result-emblem {
      border-color: rgba(85, 246, 255, 0.4);
      color: var(--cyan);
      background: rgba(85, 246, 255, 0.08);
      box-shadow: 0 0 32px rgba(85, 246, 255, 0.16);
    }

    .result-emblem svg {
      width: 42px;
      height: 42px;
    }

    .result-kicker {
      margin: 0 0 6px;
      color: #8f9bbb;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.25em;
    }

    .result-title {
      margin: 0 0 10px;
      font-size: 27px;
      letter-spacing: 0.06em;
    }

    .modal.is-win .result-title {
      color: #c8fdff;
      text-shadow: 0 0 18px rgba(85, 246, 255, 0.3);
    }

    .result-description {
      margin: 0 auto 20px;
      max-width: 270px;
      color: #9ba6c4;
      font-size: 12px;
      line-height: 1.75;
    }

    .result-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-bottom: 12px;
    }

    .result-stat {
      padding: 11px 8px;
      border: 1px solid rgba(139, 160, 236, 0.14);
      border-radius: 13px;
      background: rgba(6, 10, 24, 0.48);
    }

    .result-stat span {
      display: block;
      margin-bottom: 4px;
      color: #7f8aa9;
      font-size: 10px;
    }

    .result-stat strong {
      color: #edf4ff;
      font-size: 23px;
      font-variant-numeric: tabular-nums;
    }

    .best-line {
      margin: 0 0 19px;
      color: #8793b3;
      font-size: 11px;
    }

    .best-line strong {
      color: #d1c5ff;
      font-variant-numeric: tabular-nums;
    }

    .modal-restart {
      width: 100%;
      min-height: 48px;
      border: 1px solid rgba(126, 250, 255, 0.55);
      border-radius: 14px;
      color: #07151e;
      background: linear-gradient(135deg, #93fbff, #47dfea 60%, #75caff);
      box-shadow: 0 8px 24px rgba(44, 218, 232, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.55);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.12em;
      cursor: pointer;
    }

    .confetti {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .confetti i {
      position: absolute;
      top: -12px;
      left: var(--left);
      width: 5px;
      height: 10px;
      border-radius: 2px;
      opacity: 0;
      background: var(--color);
      box-shadow: 0 0 6px var(--color);
      animation: confetti-fall var(--duration) var(--delay) ease-in forwards;
    }

    .noscript {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: grid;
      place-items: center;
      padding: 30px;
      color: white;
      background: #070914;
      text-align: center;
    }

    @keyframes breathe {
      50% { opacity: 0.45; transform: scale(0.82); }
    }

    @keyframes score-bump {
      45% { color: var(--cyan); transform: scale(1.15); text-shadow: 0 0 12px rgba(85, 246, 255, 0.5); }
    }

    @keyframes selected-ring {
      50% { opacity: 0.65; transform: scale(1.06); }
    }

    @keyframes target-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.65; }
      50% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
    }

    @keyframes peg-land {
      0% { transform: scale(0.55); filter: brightness(1.8); }
      70% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    @keyframes particle-fly {
      from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      to { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0); }
    }

    @keyframes captured {
      to { opacity: 0; transform: translate(-50%, -50%) scale(0.2) rotate(35deg); filter: brightness(1.8); }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modal-rise {
      from { opacity: 0; transform: translateY(18px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes confetti-fall {
      0% { opacity: 0; transform: translateY(0) rotate(0); }
      12% { opacity: 1; }
      100% { opacity: 0; transform: translateY(360px) rotate(480deg); }
    }

    @media (min-width: 700px) and (min-height: 700px) {
      .keyboard-hint { display: block; }
    }

    @media (max-height: 620px) and (orientation: portrait) {
      .app { gap: 6px; padding-top: 8px; padding-bottom: 8px; }
      .brand-mark { width: 34px; height: 34px; border-radius: 11px; }
      .topbar { min-height: 36px; }
      .stat-card { padding-top: 6px; padding-bottom: 6px; }
      .rules { font-size: 9px; }
      .status-bar { margin-top: 3px; min-height: 22px; }
      .control-btn { min-height: 40px; }
    }

    /* 矮屏横屏时改为棋盘与信息双栏，避免页面滚动。 */
    @media (orientation: landscape) and (max-height: 600px) {
      :root { --board-size: min(49vw, calc(100dvh - 66px), 390px); }
      .app {
        max-width: 900px;
        display: grid;
        grid-template-columns: auto minmax(250px, 1fr);
        grid-template-rows: auto auto 1fr auto;
        grid-template-areas:
          "board topbar"
          "board stats"
          "board controls"
          "board rules";
        column-gap: clamp(18px, 4vw, 42px);
        row-gap: 9px;
        align-items: center;
        justify-content: center;
        padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      .topbar { grid-area: topbar; width: 100%; }
      .stats { grid-area: stats; width: 100%; }
      .board-area { grid-area: board; width: var(--board-size); }
      .controls { grid-area: controls; width: 100%; align-self: end; }
      .rules { grid-area: rules; width: 100%; align-self: start; }
      .top-badge, .keyboard-hint { display: none; }
      .brand-subtitle { margin-top: 2px; }
      .stat-card { padding: 6px; }
      .stat-value { font-size: 19px; }
      .status-bar { margin-top: 3px; min-height: 20px; }
      .rules { font-size: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="6" r="3" fill="currentColor"/>
            <circle cx="6" cy="16" r="3" fill="currentColor" opacity=".65"/>
            <circle cx="16" cy="16" r="4" fill="currentColor"/>
            <circle cx="26" cy="16" r="3" fill="currentColor" opacity=".65"/>
            <circle cx="16" cy="26" r="3" fill="currentColor" opacity=".45"/>
          </svg>
        </div>
        <div>
          <div class="brand-line">
            <h1>霓虹跳棋</h1>
            <span class="brand-tag">SOLO</span>
          </div>
          <p class="brand-subtitle">PEG SOLITAIRE</p>
        </div>
      </div>
      <div class="top-badge"><span class="live-dot"></span>单人挑战</div>
    </header>

    <section class="stats" aria-label="游戏数据">
      <div class="stat-card">
        <span class="stat-label">当前得分</span>
        <strong class="stat-value" id="score">0</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">剩余棋子</span>
        <strong class="stat-value" id="remaining">32</strong>
      </div>
      <div class="stat-card">
        <span class="stat-label">最高分</span>
        <strong class="stat-value" id="best">0</strong>
      </div>
    </section>

    <section class="board-area" aria-label="跳棋游戏区">
      <div class="board-frame">
        <div class="board" id="board" role="group" aria-label="33 孔单人跳棋棋盘"></div>
        <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>
        <div class="pause-overlay" id="pauseOverlay" hidden>
          <div class="pause-symbol" aria-hidden="true"><i></i><i></i></div>
          <h2>游戏已暂停</h2>
          <p>稍作休息，再继续寻找最优路线</p>
          <button class="resume-btn" id="resumeBtn" type="button">继续游戏</button>
        </div>
      </div>
      <div class="status-bar" id="statusBar">
        <span class="status-dot" aria-hidden="true"></span>
        <p class="status-text" id="statusText" role="status" aria-live="polite">选择一枚棋子开始</p>
        <time class="timer" id="timer" aria-label="本局用时">00:00</time>
      </div>
    </section>

    <div class="controls">
      <button class="control-btn primary" id="pauseBtn" type="button" aria-label="暂停游戏">
        <svg class="pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
        <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M8 5.5v13l10-6.5z"/></svg>
        <span>暂停</span>
      </button>
      <button class="control-btn secondary" id="restartBtn" type="button" aria-label="重新开始游戏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.35 5.65"/><path d="M20 5v6h-6"/></svg>
        <span>重开</span>
      </button>
    </div>

    <footer class="rules">
      <span class="rule-icon" aria-hidden="true">i</span>
      <p><strong>跳一子，吃一子。</strong>点选棋子再点发光空位，或直接拖拽；只能上下左右跳，最后只剩一子即胜利。</p>
    </footer>
    <p class="keyboard-hint">方向键移动焦点 · Enter 确认 · P 暂停 · R 重开</p>
  </main>

  <div class="modal" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="resultTitle" aria-describedby="resultDescription" hidden>
    <div class="modal-card">
      <div class="confetti" id="confetti" aria-hidden="true" hidden></div>
      <div class="result-emblem" id="resultEmblem" aria-hidden="true"></div>
      <p class="result-kicker" id="resultKicker">NO MOVES LEFT</p>
      <h2 class="result-title" id="resultTitle">本局结束</h2>
      <p class="result-description" id="resultDescription"></p>
      <div class="result-stats">
        <div class="result-stat"><span>本局得分</span><strong id="finalScore">0</strong></div>
        <div class="result-stat"><span>剩余棋子</span><strong id="finalRemaining">0</strong></div>
      </div>
      <p class="best-line">历史最高分 <strong id="finalBest">0</strong></p>
      <button class="modal-restart" id="modalRestart" type="button">再来一局</button>
    </div>
  </div>

  <noscript><div class="noscript">请启用 JavaScript 后开始单人跳棋挑战。</div></noscript>

  <script>
    (() => {
      'use strict';

      // ---------- 常量与 DOM ----------
      const SIZE = 7;
      const CENTER = 24;
      const STORAGE_KEY = 'neon-peg-solitaire-best-v1';
      const DIRECTIONS = [[-1, 0], [1, 0], [0, -1], [0, 1]];

      const boardEl = document.getElementById('board');
      const fxLayer = document.getElementById('fxLayer');
      const scoreEl = document.getElementById('score');
      const remainingEl = document.getElementById('remaining');
      const bestEl = document.getElementById('best');
      const statusBar = document.getElementById('statusBar');
      const statusText = document.getElementById('statusText');
      const timerEl = document.getElementById('timer');
      const pauseBtn = document.getElementById('pauseBtn');
      const restartBtn = document.getElementById('restartBtn');
      const pauseOverlay = document.getElementById('pauseOverlay');
      const resumeBtn = document.getElementById('resumeBtn');
      const resultModal = document.getElementById('resultModal');
      const resultEmblem = document.getElementById('resultEmblem');
      const resultKicker = document.getElementById('resultKicker');
      const resultTitle = document.getElementById('resultTitle');
      const resultDescription = document.getElementById('resultDescription');
      const finalScore = document.getElementById('finalScore');
      const finalRemaining = document.getElementById('finalRemaining');
      const finalBest = document.getElementById('finalBest');
      const modalRestart = document.getElementById('modalRestart');
      const confetti = document.getElementById('confetti');

      // null 表示棋盘外，0 表示空位，1 表示有棋子。
      let board = [];
      let selected = null;
      let focusIndex = 2;
      let justMoved = null;
      let score = 0;
      let best = loadBest();
      let gameState = 'playing';
      let elapsedBeforeStart = 0;
      let clockStartedAt = 0;
      let clockId = null;
      let pointerStart = null;
      let suppressNextClick = false;
      const cellElements = new Map();

      // 英式 33 孔棋盘：中间三行与中间三列的并集。
      const validCells = new Set();
      for (let row = 0; row < SIZE; row += 1) {
        for (let col = 0; col < SIZE; col += 1) {
          if ((row >= 2 && row <= 4) || (col >= 2 && col <= 4)) {
            validCells.add(row * SIZE + col);
          }
        }
      }

      // 预计算每个孔位四个方向上的潜在跳法，实际合法性再按当前棋局判断。
      const moveOptions = new Map();
      validCells.forEach((from) => {
        const row = Math.floor(from / SIZE);
        const col = from % SIZE;
        const options = [];
        DIRECTIONS.forEach(([dr, dc]) => {
          const overRow = row + dr;
          const overCol = col + dc;
          const toRow = row + dr * 2;
          const toCol = col + dc * 2;
          if (overRow < 0 || overRow >= SIZE || overCol < 0 || overCol >= SIZE ||
              toRow < 0 || toRow >= SIZE || toCol < 0 || toCol >= SIZE) return;
          const over = overRow * SIZE + overCol;
          const to = toRow * SIZE + toCol;
          if (validCells.has(over) && validCells.has(to)) options.push({ from, over, to });
        });
        moveOptions.set(from, options);
      });

      // ---------- 本地最高分 ----------
      function loadBest() {
        try {
          const value = Number.parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
          return Number.isFinite(value) && value > 0 ? value : 0;
        } catch (error) {
          return 0;
        }
      }

      function saveBest() {
        try {
          localStorage.setItem(STORAGE_KEY, String(best));
        } catch (error) {
          // 隐私模式或禁用存储时仍可正常游玩，仅不保存纪录。
        }
      }

      // ---------- 棋盘渲染 ----------
      function buildBoard() {
        const fragment = document.createDocumentFragment();
        for (let index = 0; index < SIZE * SIZE; index += 1) {
          if (!validCells.has(index)) {
            const placeholder = document.createElement('span');
            placeholder.className = 'cell-placeholder';
            placeholder.setAttribute('aria-hidden', 'true');
            fragment.appendChild(placeholder);
            continue;
          }
          const cell = document.createElement('button');
          cell.type = 'button';
          cell.className = 'cell';
          cell.dataset.index = String(index);
          cell.innerHTML = '<span class="hole"></span><span class="peg"></span><span class="target-dot"></span>';
          cellElements.set(index, cell);
          fragment.appendChild(cell);
        }
        boardEl.appendChild(fragment);
      }

      function getMovesFrom(from) {
        if (board[from] !== 1) return [];
        return (moveOptions.get(from) || []).filter((move) => board[move.over] === 1 && board[move.to] === 0);
      }

      function getAllMoves() {
        const moves = [];
        validCells.forEach((index) => moves.push(...getMovesFrom(index)));
        return moves;
      }

      function countRemaining() {
        return validCells.size ? Array.from(validCells).reduce((sum, index) => sum + board[index], 0) : 0;
      }

      function updateTabStops() {
        cellElements.forEach((cell, index) => {
          cell.tabIndex = index === focusIndex ? 0 : -1;
        });
      }

      function renderBoard() {
        const targets = new Set(selected === null ? [] : getMovesFrom(selected).map((move) => move.to));
        cellElements.forEach((cell, index) => {
          const hasPeg = board[index] === 1;
          cell.classList.toggle('has-peg', hasPeg);
          cell.classList.toggle('is-selected', selected === index);
          cell.classList.toggle('is-target', targets.has(index));
          cell.classList.toggle('just-moved', justMoved === index);
          cell.setAttribute('aria-pressed', selected === index ? 'true' : 'false');
          const row = Math.floor(index / SIZE) + 1;
          const col = index % SIZE + 1;
          const extras = `${selected === index ? '，已选中' : ''}${targets.has(index) ? '，可跳入' : ''}`;
          cell.setAttribute('aria-label', `第 ${row} 行第 ${col} 列，${hasPeg ? '有棋子' : '空位'}${extras}`);
        });
        updateTabStops();
      }

      function renderStats() {
        scoreEl.textContent = String(score);
        remainingEl.textContent = String(countRemaining());
        bestEl.textContent = String(best);
      }

      function setStatus(message, tone = 'normal') {
        statusText.textContent = message;
        statusBar.dataset.tone = tone;
      }

      function addScore(points) {
        score += points;
        if (score > best) {
          best = score;
          saveBest();
        }
        scoreEl.classList.remove('bump');
        void scoreEl.offsetWidth;
        scoreEl.classList.add('bump');
        renderStats();
      }

      // ---------- 计时与游戏状态 ----------
      function renderTimer() {
        const current = elapsedBeforeStart + (gameState === 'playing' ? performance.now() - clockStartedAt : 0);
        const seconds = Math.max(0, Math.floor(current / 1000));
        const minutesText = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secondsText = String(seconds % 60).padStart(2, '0');
        timerEl.textContent = `${minutesText}:${secondsText}`;
      }

      function startClock() {
        window.clearInterval(clockId);
        clockStartedAt = performance.now();
        clockId = window.setInterval(renderTimer, 1000);
      }

      function freezeClock() {
        elapsedBeforeStart += performance.now() - clockStartedAt;
        window.clearInterval(clockId);
        clockId = null;
      }

      function updatePauseButton() {
        const paused = gameState === 'paused';
        pauseBtn.querySelector('span').textContent = paused ? '继续' : '暂停';
        pauseBtn.querySelector('.pause-icon').hidden = paused;
        pauseBtn.querySelector('.play-icon').hidden = !paused;
        pauseBtn.setAttribute('aria-label', paused ? '继续游戏' : '暂停游戏');
      }

      function pauseGame() {
        if (gameState !== 'playing') return;
        freezeClock();
        gameState = 'paused';
        selected = null;
        pauseOverlay.hidden = false;
        renderBoard();
        renderTimer();
        updatePauseButton();
        setStatus('游戏已暂停，点击继续恢复');
        resumeBtn.focus({ preventScroll: true });
      }

      function resumeGame() {
        if (gameState !== 'paused') return;
        gameState = 'playing';
        pauseOverlay.hidden = true;
        startClock();
        renderBoard();
        updatePauseButton();
        setStatus('选择一枚棋子，发光圆点表示可落点');
        pauseBtn.focus({ preventScroll: true });
      }

      function newGame() {
        window.clearInterval(clockId);
        board = Array(SIZE * SIZE).fill(null);
        validCells.forEach((index) => {
          board[index] = index === CENTER ? 0 : 1;
        });
        selected = null;
        focusIndex = 2;
        justMoved = null;
        score = 0;
        elapsedBeforeStart = 0;
        gameState = 'playing';
        pointerStart = null;
        fxLayer.replaceChildren();
        pauseOverlay.hidden = true;
        resultModal.hidden = true;
        confetti.hidden = true;
        pauseBtn.disabled = false;
        updatePauseButton();
        renderBoard();
        renderStats();
        setStatus('选择一枚棋子，发光圆点表示可落点');
        startClock();
        renderTimer();
      }

      function finishGame(won) {
        freezeClock();
        gameState = 'ended';
        selected = null;
        renderTimer();
        if (won) addScore(1000);
        renderBoard();
        renderStats();
        updatePauseButton();
        pauseBtn.disabled = true;
        setStatus(won ? '完美收官，只剩最后一子！' : '棋盘上没有可走的跳法了', won ? 'normal' : 'warn');

        const remaining = countRemaining();
        resultModal.classList.toggle('is-win', won);
        resultKicker.textContent = won ? 'CHALLENGE COMPLETE' : 'NO MOVES LEFT';
        resultTitle.textContent = won ? '完美收官！' : '无路可走了';
        resultDescription.textContent = won
          ? '棋盘上只剩最后一子，你完成了挑战！胜利奖励 +1000 分。'
          : `还剩 ${remaining} 枚棋子，已经没有任何合法跳法。换个开局顺序再试一次吧。`;
        resultEmblem.innerHTML = won
          ? '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l8 7 7-12 7 12 8-7-4 21H13z"/><path d="M15 40h18"/></svg>'
          : '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="24" cy="24" r="17"/><path d="M17 30c2-4 5-6 7-6s5 2 7 6M17 17v2M31 17v2"/></svg>';
        finalScore.textContent = String(score);
        finalRemaining.textContent = String(remaining);
        finalBest.textContent = String(best);
        confetti.hidden = !won;
        if (won) createConfetti();
        resultModal.hidden = false;
        requestAnimationFrame(() => modalRestart.focus({ preventScroll: true }));
      }

      // ---------- 走子与反馈 ----------
      function selectPeg(index) {
        selected = index;
        focusIndex = index;
        renderBoard();
        const moves = getMovesFrom(index);
        setStatus(moves.length > 0
          ? `这枚棋子有 ${moves.length} 个可落点，也可直接拖拽`
          : '这枚棋子暂时无路可走，可改选其他棋子', moves.length > 0 ? 'normal' : 'warn');
      }

      function handleCell(index) {
        if (gameState !== 'playing') return;
        focusIndex = index;
        if (board[index] === 1) {
          if (selected === index) {
            selected = null;
            renderBoard();
            setStatus('已取消选择，请选择另一枚棋子');
          } else {
            selectPeg(index);
          }
          return;
        }

        if (selected === null) {
          renderBoard();
          setStatus('请先选择一枚有棋子的孔位', 'warn');
          return;
        }

        const move = getMovesFrom(selected).find((item) => item.to === index);
        if (move) {
          performMove(move);
        } else {
          renderBoard();
          setStatus('这里不能落下，请选择发光空位', 'warn');
        }
      }

      function performMove(move) {
        if (gameState !== 'playing' || board[move.from] !== 1 || board[move.over] !== 1 || board[move.to] !== 0) return;
        board[move.from] = 0;
        board[move.over] = 0;
        board[move.to] = 1;
        focusIndex = move.to;
        justMoved = move.to;
        selected = move.to;
        addScore(100);

        const remaining = countRemaining();
        if (remaining === 1) {
          renderBoard();
          spawnCaptureEffects(move.over, move.to);
          finishGame(true);
          return;
        }
        if (getAllMoves().length === 0) {
          renderBoard();
          spawnCaptureEffects(move.over, move.to);
          finishGame(false);
          return;
        }

        // 若刚移动的棋子还能跳，则保持选中，方便连续操作。
        selected = getMovesFrom(move.to).length > 0 ? move.to : null;
        renderBoard();
        spawnCaptureEffects(move.over, move.to);
        setStatus(selected === null ? '吃子 +100，选择下一枚棋子' : '吃子 +100，可继续跳或改选其他棋子');
        window.setTimeout(() => {
          if (justMoved === move.to) {
            justMoved = null;
            cellElements.get(move.to)?.classList.remove('just-moved');
          }
        }, 400);
      }

      function cellCenterPercent(index) {
        return {
          x: ((index % SIZE + 0.5) / SIZE) * 100,
          y: ((Math.floor(index / SIZE) + 0.5) / SIZE) * 100
        };
      }

      function spawnCaptureEffects(captured, landed) {
        const capturedPoint = cellCenterPercent(captured);
        const landedPoint = cellCenterPercent(landed);
        const ghost = document.createElement('span');
        ghost.className = 'ghost-peg';
        ghost.style.left = `${capturedPoint.x}%`;
        ghost.style.top = `${capturedPoint.y}%`;
        fxLayer.appendChild(ghost);
        window.setTimeout(() => ghost.remove(), 450);

        for (let i = 0; i < 10; i += 1) {
          const angle = (Math.PI * 2 * i) / 10;
          const distance = 16 + (i % 3) * 7;
          const particle = document.createElement('i');
          particle.className = 'particle';
          particle.style.left = `${landedPoint.x}%`;
          particle.style.top = `${landedPoint.y}%`;
          particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
          particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
          particle.style.setProperty('--particle-color', i % 2 ? '#9b7bff' : '#55f6ff');
          fxLayer.appendChild(particle);
          window.setTimeout(() => particle.remove(), 650);
        }
      }

      function createConfetti() {
        confetti.replaceChildren();
        const colors = ['#55f6ff', '#9b7bff', '#ff6fd8', '#f7e38b'];
        for (let i = 0; i < 20; i += 1) {
          const piece = document.createElement('i');
          piece.style.setProperty('--left', `${(i * 37) % 100}%`);
          piece.style.setProperty('--color', colors[i % colors.length]);
          piece.style.setProperty('--duration', `${1.4 + (i % 5) * 0.16}s`);
          piece.style.setProperty('--delay', `${(i % 7) * 0.07}s`);
          confetti.appendChild(piece);
        }
      }

      // ---------- 触屏、鼠标与键盘 ----------
      boardEl.addEventListener('click', (event) => {
        if (suppressNextClick) {
          suppressNextClick = false;
          return;
        }
        const cell = event.target.closest('.cell');
        if (cell) handleCell(Number(cell.dataset.index));
      });

      boardEl.addEventListener('pointerdown', (event) => {
        if (gameState !== 'playing' || (event.pointerType === 'mouse' && event.button !== 0)) return;
        const cell = event.target.closest('.cell');
        if (!cell) return;
        const index = Number(cell.dataset.index);
        if (board[index] === 1) {
          pointerStart = { id: event.pointerId, index, x: event.clientX, y: event.clientY };
        }
      });

      boardEl.addEventListener('pointermove', (event) => {
        if (!pointerStart || pointerStart.id !== event.pointerId) return;
        if (Math.hypot(event.clientX - pointerStart.x, event.clientY - pointerStart.y) > 10) {
          event.preventDefault();
        }
      });

      boardEl.addEventListener('pointerup', (event) => {
        if (!pointerStart || pointerStart.id !== event.pointerId) return;
        const start = pointerStart;
        pointerStart = null;
        const distance = Math.hypot(event.clientX - start.x, event.clientY - start.y);
        if (distance < 18 || gameState !== 'playing' || board[start.index] !== 1) return;

        // 拖拽已处理，忽略浏览器随后补发的 click，避免重复选择。
        suppressNextClick = true;
        window.setTimeout(() => { suppressNextClick = false; }, 0);
        const dropElement = document.elementFromPoint(event.clientX, event.clientY);
        const targetCell = dropElement ? dropElement.closest('.cell') : null;
        const target = targetCell ? Number(targetCell.dataset.index) : -1;
        const move = getMovesFrom(start.index).find((item) => item.to === target);
        if (move) {
          performMove(move);
        } else {
          selectPeg(start.index);
          setStatus('请将棋子拖到发光空位，或点选空位完成跳跃', 'warn');
        }
      });

      boardEl.addEventListener('pointercancel', () => { pointerStart = null; });
      boardEl.addEventListener('dragstart', (event) => event.preventDefault());
      boardEl.addEventListener('contextmenu', (event) => event.preventDefault());

      boardEl.addEventListener('focusin', (event) => {
        const cell = event.target.closest('.cell');
        if (!cell) return;
        focusIndex = Number(cell.dataset.index);
        updateTabStops();
      });

      boardEl.addEventListener('keydown', (event) => {
        const cell = event.target.closest('.cell');
        if (!cell) return;
        const index = Number(cell.dataset.index);
        const keyDirections = {
          ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1]
        };
        if (keyDirections[event.key]) {
          event.preventDefault();
          const [dr, dc] = keyDirections[event.key];
          let row = Math.floor(index / SIZE) + dr;
          let col = index % SIZE + dc;
          while (row >= 0 && row < SIZE && col >= 0 && col < SIZE) {
            const next = row * SIZE + col;
            if (validCells.has(next)) {
              focusIndex = next;
              updateTabStops();
              cellElements.get(next).focus({ preventScroll: true });
              break;
            }
            row += dr;
            col += dc;
          }
        } else if (event.key === 'Escape' && selected !== null) {
          selected = null;
          renderBoard();
          setStatus('已取消选择');
        }
      });

      pauseBtn.addEventListener('click', () => {
        if (gameState === 'playing') pauseGame();
        else if (gameState === 'paused') resumeGame();
      });
      resumeBtn.addEventListener('click', resumeGame);
      restartBtn.addEventListener('click', newGame);
      modalRestart.addEventListener('click', () => {
        newGame();
        cellElements.get(focusIndex)?.focus({ preventScroll: true });
      });

      document.addEventListener('keydown', (event) => {
        if (gameState === 'ended' && !resultModal.hidden) {
          // 结算弹窗仅保留一个操作，Tab 始终停留在重开按钮。
          if (event.key === 'Tab') {
            event.preventDefault();
            modalRestart.focus({ preventScroll: true });
          }
          return;
        }
        if (event.key.toLowerCase() === 'p') {
          event.preventDefault();
          if (gameState === 'playing') pauseGame();
          else if (gameState === 'paused') resumeGame();
        } else if (event.key.toLowerCase() === 'r') {
          event.preventDefault();
          newGame();
        }
      });

      // 禁止双指缩放、双击缩放及橡皮筋滚动；按钮与棋盘交互不受影响。
      document.addEventListener('dblclick', (event) => event.preventDefault(), { passive: false });
      document.addEventListener('gesturestart', (event) => event.preventDefault(), { passive: false });
      document.addEventListener('touchmove', (event) => event.preventDefault(), { passive: false });
      document.addEventListener('touchstart', (event) => {
        if (event.touches.length > 1) event.preventDefault();
      }, { passive: false });

      // 切到后台时自动暂停，避免计时在玩家看不到页面时继续。
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && gameState === 'playing') pauseGame();
      });

      buildBoard();
      newGame();
    })();
  </script>
</body>
</html>
