<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070815">
  <meta name="description" content="心中默念问题，摇动神奇 8 球，在 45 秒内收集灵力。">
  <title>神奇 8 球 · 霓虹占卜</title>
  <style>
    /* ---------- 基础设置：固定页面，禁止滚动与双击缩放 ---------- */
    :root {
      color-scheme: dark;
      --bg: #070815;
      --panel: rgba(18, 20, 43, 0.72);
      --line: rgba(164, 177, 255, 0.14);
      --text: #f4f5ff;
      --muted: #9297b8;
      --cyan: #61f6ff;
      --violet: #a888ff;
      --pink: #ff75d1;
      --gold: #ffd783;
      --danger: #ff7897;
      --ball-size: min(68vw, 34vh, 272px);
      font-family: Inter, ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }

    body {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -10%, #242055 0, transparent 42%),
        radial-gradient(circle at 100% 90%, #102c3c 0, transparent 38%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      font: inherit;
    }

    button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 4px;
    }

    [hidden] {
      display: none !important;
    }

    /* ---------- 氛围背景 ---------- */
    .backdrop,
    .stars,
    .grid-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .backdrop::before,
    .backdrop::after {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.16;
      animation: ambientDrift 10s ease-in-out infinite alternate;
    }

    .backdrop::before {
      top: 8%;
      left: -130px;
      background: var(--violet);
    }

    .backdrop::after {
      right: -140px;
      bottom: 5%;
      background: var(--cyan);
      animation-delay: -4s;
    }

    .grid-glow {
      top: auto;
      height: 36%;
      opacity: 0.13;
      background-image:
        linear-gradient(rgba(97, 246, 255, 0.24) 1px, transparent 1px),
        linear-gradient(90deg, rgba(97, 246, 255, 0.24) 1px, transparent 1px);
      background-size: 34px 34px;
      transform: perspective(280px) rotateX(58deg) scale(1.5);
      transform-origin: bottom;
      mask-image: linear-gradient(transparent, #000);
      -webkit-mask-image: linear-gradient(transparent, #000);
    }

    .star {
      position: absolute;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: #dce9ff;
      box-shadow: 0 0 7px rgba(170, 220, 255, 0.8);
      opacity: 0.25;
      animation: twinkle var(--duration) ease-in-out var(--delay) infinite;
    }

    /* ---------- 游戏主容器 ---------- */
    .game {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.5vh, 14px);
      width: min(100%, 480px);
      height: 100vh;
      height: 100dvh;
      padding:
        calc(14px + env(safe-area-inset-top))
        calc(18px + env(safe-area-inset-right))
        calc(12px + env(safe-area-inset-bottom))
        calc(18px + env(safe-area-inset-left));
    }

    .topbar {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-mark {
      display: grid;
      width: 39px;
      height: 39px;
      place-items: center;
      border: 1px solid rgba(97, 246, 255, 0.28);
      border-radius: 13px;
      color: var(--cyan);
      background: linear-gradient(145deg, rgba(97, 246, 255, 0.12), rgba(168, 136, 255, 0.08));
      box-shadow: inset 0 0 16px rgba(97, 246, 255, 0.06), 0 0 18px rgba(97, 246, 255, 0.06);
      font-size: 20px;
      font-weight: 800;
    }

    .brand-name {
      margin: 0;
      font-size: 16px;
      font-weight: 750;
      letter-spacing: 0.08em;
    }

    .brand-subtitle {
      margin: 2px 0 0;
      color: #737a9e;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.22em;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-button {
      display: grid;
      width: 42px;
      height: 42px;
      padding: 0;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: #b8bedf;
      background: rgba(18, 20, 42, 0.7);
      cursor: pointer;
      transition: border-color 160ms ease, color 160ms ease, transform 160ms ease;
      touch-action: manipulation;
    }

    .icon-button:active:not(:disabled) {
      transform: scale(0.93);
    }

    .icon-button:hover:not(:disabled) {
      color: var(--cyan);
      border-color: rgba(97, 246, 255, 0.35);
    }

    .icon-button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .icon-button svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sound-off,
    .is-muted .sound-on {
      display: none;
    }

    .is-muted .sound-off {
      display: block;
    }

    /* ---------- 分数、倒计时与目标进度 ---------- */
    .hud {
      display: grid;
      flex: 0 0 auto;
      grid-template-columns: 1fr 1fr 1fr;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(25, 28, 57, 0.82), rgba(12, 15, 34, 0.72));
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.025), 0 12px 35px rgba(0, 0, 0, 0.14);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .stat {
      position: relative;
      padding: 10px 6px 9px;
      text-align: center;
    }

    .stat + .stat::before {
      content: "";
      position: absolute;
      top: 24%;
      bottom: 24%;
      left: 0;
      width: 1px;
      background: var(--line);
    }

    .stat-label {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
    }

    .stat-value {
      color: var(--text);
      font-size: 23px;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      line-height: 1.1;
      text-shadow: 0 0 18px rgba(168, 136, 255, 0.15);
    }

    .stat-value.bump {
      animation: scoreBump 280ms ease;
    }

    .stat-unit {
      margin-left: 2px;
      color: #767d9f;
      font-size: 10px;
      font-weight: 600;
    }

    #scoreValue {
      color: var(--cyan);
    }

    #bestValue {
      color: var(--gold);
    }

    .time-stat.urgent .stat-value {
      color: var(--danger);
      animation: urgentPulse 700ms ease-in-out infinite;
    }

    .goal-progress {
      flex: 0 0 auto;
      height: 4px;
      margin-top: -5px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.06);
    }

    .goal-progress-fill {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--violet), var(--cyan));
      box-shadow: 0 0 12px var(--cyan);
      transition: width 400ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ---------- 占卜区 ---------- */
    .oracle {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      flex-direction: column;
    }

    .intro {
      flex: 0 0 auto;
      padding-top: 2px;
      text-align: center;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 16px;
      margin: 0 0 6px;
      color: var(--violet);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.13em;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 9px currentColor;
      animation: statusPulse 1.8s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 5.8vw, 27px);
      font-weight: 720;
      letter-spacing: 0.035em;
    }

    .gesture-hint {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .ball-stage {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      min-height: 190px;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }

    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: -1;
      width: calc(var(--ball-size) * 1.2);
      height: calc(var(--ball-size) * 0.46);
      border: 1px solid rgba(97, 246, 255, 0.13);
      border-radius: 50%;
      transform: translate(-50%, -30%) rotate(-9deg);
      box-shadow: 0 0 22px rgba(97, 246, 255, 0.025);
    }

    .orbit::before,
    .orbit::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 9px var(--cyan);
    }

    .orbit::before {
      top: 21%;
      left: 4%;
      width: 4px;
      height: 4px;
    }

    .orbit::after {
      right: 9%;
      bottom: 8%;
      width: 3px;
      height: 3px;
      background: var(--violet);
      box-shadow: 0 0 9px var(--violet);
    }

    .ball-button {
      --drag-x: 0px;
      position: relative;
      width: var(--ball-size);
      min-width: 172px;
      aspect-ratio: 1;
      margin: 0 0 14px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      touch-action: none;
      transform: translateX(var(--drag-x));
      transition: transform 180ms ease;
    }

    .ball-button.is-grabbed {
      transition: none;
      cursor: grabbing;
    }

    .ball-button::before {
      content: "";
      position: absolute;
      inset: -10%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(105, 93, 255, 0.18), rgba(97, 246, 255, 0.04) 48%, transparent 70%);
      filter: blur(13px);
      animation: auraBreathe 3s ease-in-out infinite;
    }

    .ball-button::after {
      content: "";
      position: absolute;
      right: 13%;
      bottom: -10%;
      left: 13%;
      z-index: -1;
      height: 15%;
      border-radius: 50%;
      background: #000;
      filter: blur(14px);
      opacity: 0.72;
    }

    .ball-body {
      position: absolute;
      inset: 0;
      display: block;
      overflow: hidden;
      border: 1px solid rgba(179, 197, 255, 0.17);
      border-radius: 50%;
      background:
        radial-gradient(circle at 31% 22%, rgba(255, 255, 255, 0.17) 0, rgba(255, 255, 255, 0.025) 19%, transparent 31%),
        radial-gradient(circle at 66% 77%, #141a38 0, #090c1d 36%, #03050d 66%, #010208 100%);
      box-shadow:
        inset -18px -24px 38px rgba(0, 0, 0, 0.72),
        inset 9px 10px 24px rgba(145, 160, 255, 0.06),
        0 24px 48px rgba(0, 0, 0, 0.5),
        0 0 38px rgba(109, 90, 255, 0.13);
      transform: translateZ(0);
    }

    .ball-body::before {
      content: "";
      position: absolute;
      top: 7%;
      left: 17%;
      width: 48%;
      height: 24%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255, 255, 255, 0.09), transparent 68%);
      transform: rotate(-27deg);
      filter: blur(2px);
    }

    .ball-body::after {
      content: "";
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(255, 255, 255, 0.025);
      border-radius: 50%;
      pointer-events: none;
    }

    .ball-button.is-shaking .ball-body {
      animation: ballShake 150ms ease-in-out infinite;
    }

    .ball-button.is-grabbed .ball-body {
      border-color: rgba(97, 246, 255, 0.38);
      box-shadow:
        inset -18px -24px 38px rgba(0, 0, 0, 0.72),
        inset 9px 10px 24px rgba(145, 160, 255, 0.08),
        0 24px 48px rgba(0, 0, 0, 0.5),
        0 0 45px rgba(97, 246, 255, 0.2);
    }

    .answer-window {
      position: absolute;
      top: 50%;
      left: 50%;
      display: grid;
      width: 46%;
      aspect-ratio: 1;
      place-items: center;
      overflow: hidden;
      border: 3px solid #171a29;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 28%, #fff, #e8e8e3 65%, #b7bac2);
      box-shadow:
        0 0 0 2px rgba(0, 0, 0, 0.68),
        inset 0 0 16px rgba(0, 0, 0, 0.24),
        0 3px 14px rgba(0, 0, 0, 0.6);
      transform: translate(-50%, -50%);
      transition: background 350ms ease, border-color 350ms ease;
    }

    .eight-number {
      color: #10111a;
      font-family: Georgia, serif;
      font-size: calc(var(--ball-size) * 0.25);
      font-weight: 700;
      line-height: 1;
      transform: translateY(-2%);
      transition: opacity 180ms ease, transform 250ms ease;
    }

    .answer-scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(0.72) rotate(-8deg);
      transition: opacity 250ms ease, transform 450ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .answer-window.is-revealed {
      border-color: #101c3d;
      background: radial-gradient(circle at 45% 32%, #142a59, #050c23 68%, #020715);
      box-shadow:
        0 0 0 2px rgba(0, 0, 0, 0.68),
        inset 0 0 25px rgba(45, 135, 255, 0.2),
        0 0 18px rgba(97, 246, 255, 0.14);
    }

    .answer-window.is-revealed .eight-number {
      opacity: 0;
      transform: scale(0.5);
    }

    .answer-window.is-revealed .answer-scene {
      opacity: 1;
      transform: scale(1) rotate(0);
    }

    .answer-window.is-thinking {
      animation: windowPulse 550ms ease-in-out infinite alternate;
    }

    .answer-triangle {
      position: absolute;
      inset: 13% 7% 10%;
      background: linear-gradient(160deg, #318cda, #173f9d 56%, #111e61);
      clip-path: polygon(50% 2%, 98% 91%, 2% 91%);
      filter: drop-shadow(0 0 7px rgba(63, 186, 255, 0.48));
    }

    .answer-triangle::after {
      content: "";
      position: absolute;
      inset: 3px;
      background: linear-gradient(160deg, rgba(20, 75, 153, 0.9), rgba(6, 20, 65, 0.96));
      clip-path: inherit;
    }

    .answer-text {
      position: absolute;
      top: 37%;
      right: 14%;
      left: 14%;
      z-index: 1;
      color: #c4f8ff;
      font-size: clamp(10px, calc(var(--ball-size) * 0.052), 15px);
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      text-shadow: 0 0 8px rgba(97, 246, 255, 0.65);
      overflow-wrap: anywhere;
    }

    .swipe-hint {
      position: absolute;
      bottom: 2px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 9px;
      color: #666e94;
      font-size: 15px;
      transform: translateX(-50%);
    }

    .swipe-hint i {
      display: block;
      width: 32px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #59617f, transparent);
    }

    .answer-caption {
      flex: 0 0 auto;
      min-height: 20px;
      margin: -1px 0 0;
      color: #a6add0;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .answer-caption.positive {
      color: var(--cyan);
    }

    .answer-caption.neutral {
      color: var(--gold);
    }

    .answer-caption.negative {
      color: var(--pink);
    }

    .score-float {
      position: absolute;
      top: 13%;
      left: 72%;
      z-index: 4;
      color: var(--cyan);
      font-size: 20px;
      font-weight: 850;
      opacity: 0;
      pointer-events: none;
      text-shadow: 0 0 14px currentColor;
    }

    .score-float.show {
      animation: floatScore 850ms ease-out;
    }

    .particle {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 5;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--particle-color);
      box-shadow: 0 0 8px var(--particle-color);
      pointer-events: none;
      animation: particleBurst 750ms ease-out forwards;
    }

    /* ---------- 底部规则 ---------- */
    .footer {
      flex: 0 0 auto;
    }

    .rules {
      display: flex;
      justify-content: center;
      gap: 7px;
    }

    .rule-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 99px;
      color: #a4abc9;
      background: rgba(16, 19, 39, 0.56);
      font-size: 10px;
      white-space: nowrap;
    }

    .rule-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 7px currentColor;
    }

    .rule-chip.positive {
      color: var(--cyan);
    }

    .rule-chip.neutral {
      color: var(--gold);
    }

    .rule-chip.negative {
      color: var(--pink);
    }

    .goal-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      color: #777e9f;
      font-size: 10px;
    }

    .goal-line b {
      color: #b9c0e2;
      font-weight: 700;
    }

    .keyboard-hint {
      color: #606787;
    }

    /* ---------- 暂停与结算弹窗 ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      padding:
        calc(24px + env(safe-area-inset-top))
        calc(22px + env(safe-area-inset-right))
        calc(24px + env(safe-area-inset-bottom))
        calc(22px + env(safe-area-inset-left));
      place-items: center;
      background: rgba(3, 4, 13, 0.78);
      backdrop-filter: blur(13px);
      -webkit-backdrop-filter: blur(13px);
      opacity: 0;
      transition: opacity 220ms ease;
      touch-action: none;
    }

    .overlay.is-visible {
      opacity: 1;
    }

    .modal {
      position: relative;
      width: min(100%, 360px);
      overflow: hidden;
      padding: 29px 24px 23px;
      border: 1px solid rgba(157, 169, 255, 0.22);
      border-radius: 27px;
      background:
        radial-gradient(circle at 50% 0, rgba(128, 102, 255, 0.17), transparent 44%),
        linear-gradient(150deg, rgba(27, 29, 60, 0.98), rgba(10, 13, 30, 0.98));
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.55), inset 0 1px rgba(255, 255, 255, 0.04);
      text-align: center;
      transform: translateY(14px) scale(0.97);
      transition: transform 280ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .overlay.is-visible .modal {
      transform: translateY(0) scale(1);
    }

    .modal-icon {
      display: grid;
      width: 66px;
      height: 66px;
      margin: 0 auto 17px;
      place-items: center;
      border: 1px solid rgba(97, 246, 255, 0.24);
      border-radius: 22px;
      color: var(--cyan);
      background: rgba(97, 246, 255, 0.07);
      box-shadow: 0 0 28px rgba(97, 246, 255, 0.1);
      font-size: 30px;
    }

    .modal-kicker {
      margin: 0 0 7px;
      color: var(--violet);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.24em;
    }

    .modal h2 {
      margin: 0;
      font-size: 27px;
      letter-spacing: 0.04em;
    }

    .modal-description {
      margin: 10px auto 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .modal-actions {
      display: grid;
      gap: 10px;
    }

    .primary-button,
    .secondary-button {
      width: 100%;
      min-height: 49px;
      border-radius: 15px;
      font-weight: 750;
      letter-spacing: 0.06em;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 150ms ease, filter 150ms ease;
    }

    .primary-button {
      border: 0;
      color: #07121b;
      background: linear-gradient(105deg, #8b9cff, var(--cyan));
      box-shadow: 0 8px 26px rgba(97, 246, 255, 0.16);
    }

    .secondary-button {
      border: 1px solid var(--line);
      color: #b7bedc;
      background: rgba(255, 255, 255, 0.025);
    }

    .primary-button:active,
    .secondary-button:active {
      transform: scale(0.97);
    }

    .primary-button:hover,
    .secondary-button:hover {
      filter: brightness(1.08);
    }

    .result-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 0 0 20px;
    }

    .result-stat {
      padding: 12px 8px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.025);
    }

    .result-stat span {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 10px;
    }

    .result-stat strong {
      color: var(--text);
      font-size: 25px;
      font-variant-numeric: tabular-nums;
    }

    .result-stat:last-child strong {
      color: var(--gold);
    }

    .result-card.is-win .modal-icon {
      color: var(--gold);
      border-color: rgba(255, 215, 131, 0.28);
      background: rgba(255, 215, 131, 0.07);
      box-shadow: 0 0 32px rgba(255, 215, 131, 0.12);
    }

    .result-card.is-loss .modal-icon {
      color: var(--pink);
      border-color: rgba(255, 117, 209, 0.25);
      background: rgba(255, 117, 209, 0.06);
    }

    .new-best {
      display: inline-block;
      margin: -8px 0 15px;
      padding: 4px 10px;
      border: 1px solid rgba(255, 215, 131, 0.25);
      border-radius: 99px;
      color: var(--gold);
      background: rgba(255, 215, 131, 0.06);
      font-size: 10px;
      font-weight: 700;
    }

    .noscript {
      position: fixed;
      inset: 0;
      z-index: 99;
      display: grid;
      padding: 30px;
      place-items: center;
      color: white;
      background: #070815;
      text-align: center;
    }

    /* 暂停时冻结球体和背景动画，恢复后从原位置继续。 */
    body.is-paused .game *,
    body.is-paused .game *::before,
    body.is-paused .game *::after,
    body.is-paused .backdrop *,
    body.is-paused .backdrop::before,
    body.is-paused .backdrop::after {
      animation-play-state: paused !important;
    }

    /* ---------- 动画 ---------- */
    @keyframes twinkle {
      0%, 100% { opacity: 0.12; transform: scale(0.8); }
      50% { opacity: 0.75; transform: scale(1.35); }
    }

    @keyframes ambientDrift {
      to { transform: translate(35px, 25px) scale(1.15); }
    }

    @keyframes auraBreathe {
      0%, 100% { opacity: 0.65; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    @keyframes statusPulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }

    @keyframes ballShake {
      0% { transform: translate(-5px, 1px) rotate(-3deg); }
      25% { transform: translate(1px, -3px) rotate(2deg); }
      50% { transform: translate(5px, 1px) rotate(3deg); }
      75% { transform: translate(-1px, 3px) rotate(-2deg); }
      100% { transform: translate(-5px, 1px) rotate(-3deg); }
    }

    @keyframes windowPulse {
      to { filter: brightness(1.3); }
    }

    @keyframes scoreBump {
      50% { transform: scale(1.24); }
    }

    @keyframes urgentPulse {
      50% { opacity: 0.55; }
    }

    @keyframes floatScore {
      0% { opacity: 0; transform: translateY(10px) scale(0.75); }
      20% { opacity: 1; transform: translateY(0) scale(1.08); }
      100% { opacity: 0; transform: translateY(-48px) scale(1); }
    }

    @keyframes particleBurst {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0); }
    }

    /* ---------- 小屏、横屏与减少动态效果适配 ---------- */
    @media (max-height: 700px) {
      :root {
        --ball-size: min(61vw, 32vh, 224px);
      }

      .game {
        gap: 7px;
        padding-top: calc(9px + env(safe-area-inset-top));
        padding-bottom: calc(8px + env(safe-area-inset-bottom));
      }

      .stat {
        padding-top: 7px;
        padding-bottom: 7px;
      }

      .stat-value {
        font-size: 20px;
      }

      .intro {
        padding-top: 0;
      }

      .status-line {
        margin-bottom: 3px;
      }

      .gesture-hint {
        margin-top: 4px;
      }

      .ball-stage {
        min-height: 168px;
      }

      .goal-line {
        margin-top: 5px;
      }
    }

    @media (max-height: 560px) {
      :root {
        --ball-size: min(52vw, 38vh, 196px);
      }

      .brand-subtitle,
      .answer-caption,
      .keyboard-hint {
        display: none;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
      }

      .icon-button {
        width: 36px;
        height: 36px;
      }

      .topbar {
        min-height: 36px;
      }

      .ball-button {
        min-width: 138px;
        margin-bottom: 10px;
      }

      .ball-stage {
        min-height: 142px;
      }

      .intro h1 {
        font-size: 18px;
      }

      .gesture-hint {
        font-size: 10px;
      }

      .goal-line {
        justify-content: center;
      }
    }

    @media (min-width: 700px) {
      .game {
        padding-right: 28px;
        padding-left: 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="stars" id="stars"></div>
    <div class="grid-glow"></div>
  </div>

  <main class="game" id="game">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">8</div>
        <div>
          <p class="brand-name">神奇 8 球</p>
          <p class="brand-subtitle">NEON FORTUNE ORACLE</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="soundButton" type="button" aria-label="关闭音效" aria-pressed="true" title="音效开关">
          <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 5 6.5 9H3v6h3.5l4.5 4V5Z"></path>
            <path d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"></path>
          </svg>
          <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 5 6.5 9H3v6h3.5l4.5 4V5Z"></path>
            <path d="m16 9 5 6m0-6-5 6"></path>
          </svg>
        </button>
        <button class="icon-button" id="pauseButton" type="button" aria-label="暂停游戏" title="暂停（P）" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14M16 5v14"></path>
          </svg>
        </button>
      </div>
    </header>

    <section class="hud" aria-label="游戏数据">
      <div class="stat">
        <span class="stat-label">当前灵力</span>
        <strong class="stat-value" id="scoreValue">0</strong>
        <span class="stat-unit">/ 500</span>
      </div>
      <div class="stat time-stat" id="timeStat">
        <span class="stat-label">剩余时间</span>
        <strong class="stat-value" id="timeValue">45</strong>
        <span class="stat-unit">秒</span>
      </div>
      <div class="stat">
        <span class="stat-label">最高灵力</span>
        <strong class="stat-value" id="bestValue">0</strong>
      </div>
    </section>
    <div class="goal-progress" role="progressbar" aria-label="灵力收集进度" aria-valuemin="0" aria-valuemax="500" aria-valuenow="0" id="goalProgress">
      <span class="goal-progress-fill" id="goalProgressFill"></span>
    </div>

    <section class="oracle" aria-label="神奇 8 球占卜区">
      <div class="intro">
        <p class="status-line"><span class="status-dot" aria-hidden="true"></span><span id="statusText">等待你的问题</span></p>
        <h1>心中默念你的问题</h1>
        <p class="gesture-hint" id="gestureHint">轻点 8 球，或按住左右晃动后松开</p>
      </div>

      <div class="ball-stage" id="ballStage">
        <div class="orbit" aria-hidden="true"></div>
        <button class="ball-button" id="ballButton" type="button" aria-label="轻点或左右拖动 8 球来占卜" aria-describedby="gestureHint">
          <span class="ball-body">
            <span class="answer-window" id="answerWindow">
              <span class="eight-number" id="eightNumber">8</span>
              <span class="answer-scene" id="answerScene" aria-hidden="true">
                <span class="answer-triangle"></span>
                <span class="answer-text" id="answerText"></span>
              </span>
            </span>
          </span>
        </button>
        <div class="swipe-hint" aria-hidden="true"><span>‹</span><i></i><span>›</span></div>
        <span class="score-float" id="scoreFloat" aria-hidden="true">+100</span>
      </div>
      <p class="answer-caption" id="answerCaption" aria-live="polite">答案将在球心浮现</p>
    </section>

    <footer class="footer">
      <div class="rules" aria-label="计分规则">
        <span class="rule-chip positive"><i class="rule-dot"></i>肯定 +100</span>
        <span class="rule-chip neutral"><i class="rule-dot"></i>迟疑 +60</span>
        <span class="rule-chip negative"><i class="rule-dot"></i>否定 +40</span>
      </div>
      <div class="goal-line">
        <span>45 秒内集满 <b>500</b> 灵力即可获胜</span>
        <span class="keyboard-hint">空格占卜 · P 暂停</span>
      </div>
    </footer>
  </main>

  <div class="overlay" id="pauseOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="pauseTitle" aria-describedby="pauseDescription">
    <div class="modal">
      <div class="modal-icon" aria-hidden="true">Ⅱ</div>
      <p class="modal-kicker">TIME SUSPENDED</p>
      <h2 id="pauseTitle">暂停占卜</h2>
      <p class="modal-description" id="pauseDescription">时间与命运都已静止。<br>准备好后，继续聆听 8 球的回答。</p>
      <div class="modal-actions">
        <button class="primary-button" id="resumeButton" type="button">继续占卜</button>
        <button class="secondary-button" id="pauseRestartButton" type="button">重新开始</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="resultOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="resultTitle" aria-describedby="resultDescription">
    <div class="modal result-card" id="resultCard">
      <div class="modal-icon" id="resultIcon" aria-hidden="true">✦</div>
      <p class="modal-kicker" id="resultKicker">FORTUNE COMPLETE</p>
      <h2 id="resultTitle">挑战成功</h2>
      <p class="modal-description" id="resultDescription">你集满了灵力，命运之门已为你开启。</p>
      <div class="result-stats">
        <div class="result-stat"><span>本次灵力</span><strong id="resultScore">0</strong></div>
        <div class="result-stat"><span>最高灵力</span><strong id="resultBest">0</strong></div>
      </div>
      <span class="new-best" id="newBestBadge" hidden>✦ 新纪录</span>
      <button class="primary-button" id="restartButton" type="button">再玩一次</button>
    </div>
  </div>

  <noscript><div class="noscript">请启用 JavaScript，让神奇 8 球为你揭晓答案。</div></noscript>

  <script>
    (() => {
      "use strict";

      // ---------- 游戏常量与经典答案 ----------
      const GAME_DURATION = 45;
      const TARGET_SCORE = 500;
      const BEST_KEY = "neonMagic8Ball.bestScore";
      const SOUND_KEY = "neonMagic8Ball.sound";
      const REVEAL_DELAY = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 220 : 900;

      const ANSWERS = [
        { text: "毫无疑问", type: "positive" },
        { text: "一定会实现", type: "positive" },
        { text: "是的，没问题", type: "positive" },
        { text: "可以放心去做", type: "positive" },
        { text: "迹象非常好", type: "positive" },
        { text: "答案就是肯定", type: "positive" },
        { text: "好运正在靠近", type: "positive" },
        { text: "坚持会有回报", type: "positive" },
        { text: "机会已经出现", type: "positive" },
        { text: "宇宙说：可以", type: "positive" },
        { text: "现在还不明朗", type: "neutral" },
        { text: "稍后再问一次", type: "neutral" },
        { text: "先静下心来想想", type: "neutral" },
        { text: "答案仍在迷雾中", type: "neutral" },
        { text: "换个角度再看看", type: "neutral" },
        { text: "暂时不要强求", type: "negative" },
        { text: "这次可能不行", type: "negative" },
        { text: "最好先停一停", type: "negative" },
        { text: "迹象不太乐观", type: "negative" },
        { text: "答案倾向否定", type: "negative" }
      ];

      const TYPE_INFO = {
        positive: { points: 100, label: "好运降临", color: "#61f6ff" },
        neutral: { points: 60, label: "命运迟疑", color: "#ffd783" },
        negative: { points: 40, label: "逆耳箴言", color: "#ff75d1" }
      };

      // ---------- DOM 引用 ----------
      const $ = (id) => document.getElementById(id);
      const ballButton = $("ballButton");
      const ballStage = $("ballStage");
      const answerWindow = $("answerWindow");
      const answerScene = $("answerScene");
      const answerText = $("answerText");
      const answerCaption = $("answerCaption");
      const statusText = $("statusText");
      const gestureHint = $("gestureHint");
      const scoreValue = $("scoreValue");
      const timeValue = $("timeValue");
      const bestValue = $("bestValue");
      const timeStat = $("timeStat");
      const goalProgress = $("goalProgress");
      const goalProgressFill = $("goalProgressFill");
      const scoreFloat = $("scoreFloat");
      const pauseButton = $("pauseButton");
      const soundButton = $("soundButton");
      const pauseOverlay = $("pauseOverlay");
      const resultOverlay = $("resultOverlay");
      const resultCard = $("resultCard");
      const resumeButton = $("resumeButton");
      const restartButton = $("restartButton");

      // 单个状态对象集中管理计时器，避免暂停或重开后出现残留回调。
      const state = {
        phase: "idle", // idle → playing ↔ paused → ended
        score: 0,
        best: readNumber(BEST_KEY),
        initialBest: 0,
        remaining: GAME_DURATION,
        busy: false,
        timerId: null,
        deadline: 0,
        revealId: null,
        revealDue: 0,
        revealRemaining: 0,
        pendingAnswer: null,
        lastAnswer: "",
        runId: 0
      };

      let soundEnabled = readText(SOUND_KEY) !== "off";
      let audioContext = null;
      let gesture = null;
      let suppressClick = false;

      // ---------- 本地存储：隐私模式或禁用存储时自动降级 ----------
      function readText(key) {
        try {
          return localStorage.getItem(key);
        } catch (error) {
          return null;
        }
      }

      function readNumber(key) {
        const value = Number.parseInt(readText(key), 10);
        return Number.isFinite(value) && value >= 0 ? value : 0;
      }

      function writeStorage(key, value) {
        try {
          localStorage.setItem(key, String(value));
        } catch (error) {
          // 存储不可用时仍可进行游戏，只是不保留纪录。
        }
      }

      // ---------- 轻量合成音效，无音频文件或外部依赖 ----------
      function ensureAudio() {
        if (!soundEnabled) return null;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return null;
          if (!audioContext) audioContext = new AudioContext();
          if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
          return audioContext;
        } catch (error) {
          return null;
        }
      }

      function playNotes(notes) {
        const context = ensureAudio();
        if (!context) return;
        const now = context.currentTime;
        notes.forEach(({ frequency, offset = 0, duration = 0.12, volume = 0.025, wave = "sine" }) => {
          const oscillator = context.createOscillator();
          const gain = context.createGain();
          oscillator.type = wave;
          oscillator.frequency.setValueAtTime(frequency, now + offset);
          gain.gain.setValueAtTime(0.0001, now + offset);
          gain.gain.exponentialRampToValueAtTime(volume, now + offset + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + duration);
          oscillator.connect(gain);
          gain.connect(context.destination);
          oscillator.start(now + offset);
          oscillator.stop(now + offset + duration + 0.02);
        });
      }

      function playSound(name) {
        if (!soundEnabled) return;
        const sounds = {
          shake: [{ frequency: 105, duration: 0.18, volume: 0.018, wave: "triangle" }],
          positive: [
            { frequency: 440, duration: 0.18 },
            { frequency: 660, offset: 0.08, duration: 0.24 }
          ],
          neutral: [
            { frequency: 360, duration: 0.16 },
            { frequency: 480, offset: 0.07, duration: 0.2 }
          ],
          negative: [
            { frequency: 280, duration: 0.18, wave: "triangle" },
            { frequency: 220, offset: 0.09, duration: 0.22, wave: "triangle" }
          ],
          win: [
            { frequency: 523, duration: 0.22 },
            { frequency: 659, offset: 0.11, duration: 0.22 },
            { frequency: 784, offset: 0.22, duration: 0.36 }
          ],
          lose: [
            { frequency: 260, duration: 0.24, wave: "triangle" },
            { frequency: 180, offset: 0.17, duration: 0.35, wave: "triangle" }
          ]
        };
        if (sounds[name]) playNotes(sounds[name]);
      }

      function vibrate(pattern) {
        if (navigator.vibrate) navigator.vibrate(pattern);
      }

      // ---------- 界面更新 ----------
      function updateHUD() {
        scoreValue.textContent = state.score;
        bestValue.textContent = state.best;
        timeValue.textContent = Math.max(0, Math.ceil(state.remaining));
        const progress = Math.min(100, (state.score / TARGET_SCORE) * 100);
        goalProgressFill.style.width = `${progress}%`;
        goalProgress.setAttribute("aria-valuenow", String(Math.min(state.score, TARGET_SCORE)));
        timeStat.classList.toggle("urgent", state.phase === "playing" && state.remaining <= 10);
      }

      function updateSoundButton() {
        soundButton.classList.toggle("is-muted", !soundEnabled);
        soundButton.setAttribute("aria-pressed", String(soundEnabled));
        soundButton.setAttribute("aria-label", soundEnabled ? "关闭音效" : "开启音效");
      }

      function showOverlay(overlay) {
        overlay.hidden = false;
        requestAnimationFrame(() => overlay.classList.add("is-visible"));
      }

      function hideOverlay(overlay) {
        overlay.classList.remove("is-visible");
        overlay.hidden = true;
      }

      function animateScore() {
        scoreValue.classList.remove("bump");
        void scoreValue.offsetWidth;
        scoreValue.classList.add("bump");
      }

      function showScoreFloat(points, color) {
        scoreFloat.textContent = `+${points}`;
        scoreFloat.style.color = color;
        scoreFloat.classList.remove("show");
        void scoreFloat.offsetWidth;
        scoreFloat.classList.add("show");
      }

      function burstParticles(color) {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        for (let index = 0; index < 12; index += 1) {
          const particle = document.createElement("i");
          const angle = (Math.PI * 2 * index) / 12;
          const distance = 75 + Math.random() * 55;
          particle.className = "particle";
          particle.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
          particle.style.setProperty("--y", `${Math.sin(angle) * distance}px`);
          particle.style.setProperty("--particle-color", color);
          ballStage.appendChild(particle);
          particle.addEventListener("animationend", () => particle.remove(), { once: true });
          setTimeout(() => particle.remove(), 1000);
        }
      }

      // ---------- 倒计时与可暂停的答案揭晓计时 ----------
      function startTimer() {
        clearInterval(state.timerId);
        state.deadline = performance.now() + state.remaining * 1000;
        state.timerId = setInterval(tickTimer, 100);
        tickTimer();
      }

      function tickTimer() {
        if (state.phase !== "playing") return;
        state.remaining = Math.max(0, (state.deadline - performance.now()) / 1000);
        updateHUD();
        if (state.remaining <= 0) finishGame(false);
      }

      function scheduleReveal(delay) {
        clearTimeout(state.revealId);
        state.revealRemaining = delay;
        state.revealDue = performance.now() + delay;
        const currentRun = state.runId;
        state.revealId = setTimeout(() => revealAnswer(currentRun), delay);
      }

      function clearGameTimers() {
        clearInterval(state.timerId);
        clearTimeout(state.revealId);
        state.timerId = null;
        state.revealId = null;
      }

      // ---------- 核心占卜流程 ----------
      function pickAnswer() {
        let answer;
        do {
          answer = ANSWERS[Math.floor(Math.random() * ANSWERS.length)];
        } while (ANSWERS.length > 1 && answer.text === state.lastAnswer);
        return answer;
      }

      function beginReading() {
        if ((state.phase !== "idle" && state.phase !== "playing") || state.busy) return;

        // 第一次占卜才启动倒计时，给玩家留出默念问题的时间。
        if (state.phase === "idle") {
          state.phase = "playing";
          pauseButton.disabled = false;
          startTimer();
        }

        state.busy = true;
        state.pendingAnswer = pickAnswer();
        statusText.textContent = "命运正在转动";
        gestureHint.textContent = "感受掌心的共鸣…";
        answerCaption.textContent = "正在穿越命运迷雾…";
        answerCaption.className = "answer-caption";
        ballButton.classList.add("is-shaking");
        answerWindow.classList.add("is-thinking");
        playSound("shake");
        vibrate(18);
        scheduleReveal(REVEAL_DELAY);
      }

      function revealAnswer(currentRun) {
        if (currentRun !== state.runId || state.phase !== "playing" || !state.busy) return;

        state.revealId = null;
        state.busy = false;
        const answer = state.pendingAnswer;
        const info = TYPE_INFO[answer.type];
        const previousBest = state.best;
        state.lastAnswer = answer.text;
        state.score += info.points;
        state.best = Math.max(state.best, state.score);
        if (state.best > previousBest) writeStorage(BEST_KEY, state.best);

        ballButton.classList.remove("is-shaking");
        answerWindow.classList.remove("is-thinking");
        answerWindow.classList.add("is-revealed");
        answerScene.setAttribute("aria-hidden", "false");
        answerText.textContent = answer.text;
        answerCaption.textContent = `「${answer.text}」 · ${info.label}，获得 ${info.points} 灵力`;
        answerCaption.className = `answer-caption ${answer.type}`;
        statusText.textContent = "答案已揭晓";
        gestureHint.textContent = "继续默念问题，再次轻点或晃动";
        ballButton.setAttribute("aria-label", `答案：${answer.text}。再次轻点或拖动来占卜`);

        updateHUD();
        animateScore();
        showScoreFloat(info.points, info.color);
        burstParticles(info.color);
        playSound(answer.type);
        vibrate(answer.type === "positive" ? [20, 35, 30] : 25);

        if (state.score >= TARGET_SCORE) finishGame(true);
      }

      // ---------- 暂停、继续、结束与重开 ----------
      function pauseGame() {
        if (state.phase !== "playing") return;

        state.remaining = Math.max(0, (state.deadline - performance.now()) / 1000);
        if (state.remaining <= 0) {
          finishGame(false);
          return;
        }

        clearInterval(state.timerId);
        state.timerId = null;
        if (state.busy && state.revealId !== null) {
          state.revealRemaining = Math.max(0, state.revealDue - performance.now());
          clearTimeout(state.revealId);
          state.revealId = null;
        }

        state.phase = "paused";
        document.body.classList.add("is-paused");
        updateHUD();
        showOverlay(pauseOverlay);
        setTimeout(() => resumeButton.focus({ preventScroll: true }), 80);
      }

      function resumeGame() {
        if (state.phase !== "paused") return;
        state.phase = "playing";
        document.body.classList.remove("is-paused");
        hideOverlay(pauseOverlay);
        startTimer();
        if (state.busy) scheduleReveal(state.revealRemaining);
        pauseButton.focus({ preventScroll: true });
      }

      function finishGame(won) {
        if (state.phase === "ended") return;
        state.phase = "ended";
        state.runId += 1;
        clearGameTimers();
        state.busy = false;
        ballButton.classList.remove("is-shaking", "is-grabbed");
        answerWindow.classList.remove("is-thinking");
        pauseButton.disabled = true;
        document.body.classList.remove("is-paused");
        hideOverlay(pauseOverlay);

        const previousBest = state.best;
        state.best = Math.max(state.best, state.score);
        if (state.best > previousBest) writeStorage(BEST_KEY, state.best);
        // 是否刷新纪录由本局开始前的纪录决定，避免平分旧纪录也提示新纪录。
        const isRecord = state.score > 0 && state.score > state.initialBest;

        updateHUD();
        resultCard.classList.toggle("is-win", won);
        resultCard.classList.toggle("is-loss", !won);
        $("resultIcon").textContent = won ? "✦" : "⌛";
        $("resultKicker").textContent = won ? "FORTUNE COMPLETE" : "TIME HAS RUN OUT";
        $("resultTitle").textContent = won ? "挑战成功" : "时间到";
        $("resultDescription").textContent = won
          ? "你集满了灵力，命运之门已为你开启。"
          : `还差 ${Math.max(0, TARGET_SCORE - state.score)} 灵力。再问一次，命运或许会改变。`;
        $("resultScore").textContent = state.score;
        $("resultBest").textContent = state.best;
        $("newBestBadge").hidden = !isRecord;
        showOverlay(resultOverlay);
        playSound(won ? "win" : "lose");
        vibrate(won ? [35, 45, 35, 45, 70] : [80, 50, 80]);
        setTimeout(() => restartButton.focus({ preventScroll: true }), 100);
      }

      function resetGame() {
        state.runId += 1;
        clearGameTimers();
        state.phase = "idle";
        state.score = 0;
        state.remaining = GAME_DURATION;
        state.busy = false;
        state.pendingAnswer = null;
        state.lastAnswer = "";
        state.revealRemaining = 0;
        state.initialBest = state.best;
        gesture = null;
        suppressClick = false;

        document.body.classList.remove("is-paused");
        hideOverlay(pauseOverlay);
        hideOverlay(resultOverlay);
        pauseButton.disabled = true;
        ballButton.classList.remove("is-shaking", "is-grabbed");
        ballButton.style.setProperty("--drag-x", "0px");
        ballButton.setAttribute("aria-label", "轻点或左右拖动 8 球来占卜");
        answerWindow.classList.remove("is-revealed", "is-thinking");
        answerScene.setAttribute("aria-hidden", "true");
        answerText.textContent = "";
        answerCaption.textContent = "答案将在球心浮现";
        answerCaption.className = "answer-caption";
        statusText.textContent = "等待你的问题";
        gestureHint.textContent = "轻点 8 球，或按住左右晃动后松开";
        scoreFloat.classList.remove("show");
        ballStage.querySelectorAll(".particle").forEach((particle) => particle.remove());
        updateHUD();
      }

      // ---------- Pointer Events：同一套代码支持手指、触控笔与鼠标 ----------
      ballButton.addEventListener("pointerdown", (event) => {
        if ((state.phase !== "idle" && state.phase !== "playing") || state.busy) return;
        if (event.pointerType === "mouse" && event.button !== 0) return;
        gesture = {
          id: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          dx: 0,
          dy: 0,
          dragged: false
        };
        ballButton.setPointerCapture(event.pointerId);
        ballButton.classList.add("is-grabbed");
      });

      ballButton.addEventListener("pointermove", (event) => {
        if (!gesture || event.pointerId !== gesture.id) return;
        gesture.dx = event.clientX - gesture.startX;
        gesture.dy = event.clientY - gesture.startY;
        if (Math.abs(gesture.dx) > 10 && Math.abs(gesture.dx) > Math.abs(gesture.dy) * 0.7) {
          gesture.dragged = true;
        }
        const dragX = Math.max(-28, Math.min(28, gesture.dx));
        ballButton.style.setProperty("--drag-x", `${dragX}px`);
        if (gesture.dragged) {
          gestureHint.textContent = "松开，揭晓你的答案";
          event.preventDefault();
        }
      });

      function endGesture(event, cancelled = false) {
        if (!gesture || event.pointerId !== gesture.id) return;
        const shouldReveal = !cancelled && (gesture.dragged || Math.abs(gesture.dx) >= 22);
        if (ballButton.hasPointerCapture(event.pointerId)) ballButton.releasePointerCapture(event.pointerId);
        gesture = null;
        ballButton.classList.remove("is-grabbed");
        ballButton.style.setProperty("--drag-x", "0px");
        if (!state.busy && state.phase !== "paused") {
          gestureHint.textContent = state.lastAnswer
            ? "继续默念问题，再次轻点或晃动"
            : "轻点 8 球，或按住左右晃动后松开";
        }
        if (shouldReveal) {
          // 拖动已触发占卜，屏蔽随后产生的兼容 click，避免连续抽两次。
          suppressClick = true;
          beginReading();
          setTimeout(() => { suppressClick = false; }, 0);
        }
      }

      ballButton.addEventListener("pointerup", (event) => endGesture(event));
      ballButton.addEventListener("pointercancel", (event) => endGesture(event, true));

      ballButton.addEventListener("click", () => {
        if (suppressClick) {
          suppressClick = false;
          return;
        }
        beginReading();
      });

      // ---------- 按钮、键盘与页面生命周期 ----------
      pauseButton.addEventListener("click", pauseGame);
      resumeButton.addEventListener("click", resumeGame);
      $("pauseRestartButton").addEventListener("click", () => {
        resetGame();
        ballButton.focus({ preventScroll: true });
      });
      restartButton.addEventListener("click", () => {
        resetGame();
        ballButton.focus({ preventScroll: true });
      });

      soundButton.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        writeStorage(SOUND_KEY, soundEnabled ? "on" : "off");
        updateSoundButton();
        if (soundEnabled) playSound("neutral");
      });

      document.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        const activeOverlay = !pauseOverlay.hidden ? pauseOverlay : (!resultOverlay.hidden ? resultOverlay : null);

        // 弹窗打开时将 Tab 焦点限制在当前弹窗内。
        if (event.key === "Tab" && activeOverlay) {
          const buttons = [...activeOverlay.querySelectorAll("button:not(:disabled)")];
          const first = buttons[0];
          const last = buttons[buttons.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
          return;
        }

        if (key === "p" && !event.repeat) {
          event.preventDefault();
          if (state.phase === "playing") pauseGame();
          else if (state.phase === "paused") resumeGame();
          return;
        }

        if (event.key === "Escape" && state.phase === "paused") {
          event.preventDefault();
          resumeGame();
          return;
        }

        if (key === "r" && !event.repeat && (state.phase === "paused" || state.phase === "ended")) {
          event.preventDefault();
          resetGame();
          ballButton.focus({ preventScroll: true });
          return;
        }

        const interactive = event.target.closest("button, input, textarea, select, a");
        if ((event.code === "Space" || event.key === "Enter") && !interactive && !event.repeat && !activeOverlay) {
          event.preventDefault();
          beginReading();
        }
      });

      // 切到后台时自动暂停，避免倒计时在看不见页面时继续。
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && state.phase === "playing") pauseGame();
      });

      // iOS 手势、双击和页面拖动均不改变视口或滚动页面。
      document.addEventListener("gesturestart", (event) => event.preventDefault(), { passive: false });
      document.addEventListener("dblclick", (event) => event.preventDefault(), { passive: false });
      document.addEventListener("touchmove", (event) => event.preventDefault(), { passive: false });
      document.addEventListener("contextmenu", (event) => {
        if (event.target === ballButton || ballButton.contains(event.target)) event.preventDefault();
      });

      // ---------- 初始化星空与界面 ----------
      function createStars() {
        const fragment = document.createDocumentFragment();
        for (let index = 0; index < 42; index += 1) {
          const star = document.createElement("i");
          star.className = "star";
          star.style.left = `${Math.random() * 100}%`;
          star.style.top = `${Math.random() * 100}%`;
          star.style.setProperty("--size", `${0.7 + Math.random() * 1.7}px`);
          star.style.setProperty("--duration", `${2.5 + Math.random() * 4}s`);
          star.style.setProperty("--delay", `${-Math.random() * 6}s`);
          fragment.appendChild(star);
        }
        $("stars").appendChild(fragment);
      }

      state.initialBest = state.best;
      createStars();
      updateSoundButton();
      updateHUD();
    })();
  </script>
</body>
</html>
