<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070a14">
  <title>方块拼图 · 1010</title>
  <style>
    /* ---------- 基础与手机适配 ---------- */
    :root {
      color-scheme: dark;
      --bg: #070a14;
      --panel: rgba(15, 21, 39, .82);
      --line: rgba(139, 163, 255, .13);
      --text: #f2f5ff;
      --muted: #8490ad;
      --cyan: #37e6f5;
      --violet: #9a7bff;
      --pink: #ff65b3;
      --board-size: min(calc(100vw - 52px), 45dvh, 460px);
      --grid-gap: clamp(2px, .7vw, 4px);
      --mini-size: clamp(9px, 3.2vw, 17px);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 4%, rgba(74, 70, 180, .2), transparent 34%),
        radial-gradient(circle at 90% 90%, rgba(0, 211, 224, .1), transparent 32%),
        var(--bg);
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .24;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    button { font: inherit; color: inherit; touch-action: none; }
    button:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }
    [hidden] { display: none !important; }

    .ambient {
      position: fixed;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .12;
      pointer-events: none;
    }
    .ambient.one { top: -100px; right: -70px; background: var(--violet); }
    .ambient.two { bottom: -120px; left: -80px; background: var(--cyan); }

    /* ---------- 整体布局 ---------- */
    .game-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(7px, 1.25dvh, 12px);
    }

    .topbar {
      width: 100%;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-mark {
      width: 39px;
      height: 39px;
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
      padding: 6px;
      border: 1px solid rgba(80, 231, 245, .25);
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(55,230,245,.12), rgba(154,123,255,.1));
      box-shadow: inset 0 0 15px rgba(55,230,245,.06), 0 0 20px rgba(55,230,245,.07);
      transform: rotate(-4deg);
    }
    .brand-mark i { border-radius: 2px; background: var(--cyan); box-shadow: 0 0 7px rgba(55,230,245,.65); }
    .brand-mark i:nth-child(2) { background: var(--violet); box-shadow: 0 0 7px rgba(154,123,255,.7); }
    .brand-mark i:nth-child(3) { background: var(--pink); box-shadow: 0 0 7px rgba(255,101,179,.65); }
    .brand-mark i:nth-child(4) { opacity: .2; }

    .brand h1 { margin: 0; font-size: clamp(19px, 5vw, 25px); line-height: 1.05; letter-spacing: .08em; }
    .brand p { margin: 5px 0 0; color: var(--muted); font-size: 9px; letter-spacing: .22em; text-transform: uppercase; }

    .top-actions { display: flex; gap: 8px; }
    .icon-button {
      width: 40px;
      height: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(18, 25, 45, .75);
      cursor: pointer;
      transition: border-color .18s, background .18s, transform .18s;
    }
    .icon-button:hover { border-color: rgba(55,230,245,.42); background: rgba(28,38,64,.9); }
    .icon-button:active { transform: scale(.92); }
    .icon-button:disabled { opacity: .35; cursor: default; }
    .icon-button svg { width: 18px; height: 18px; fill: currentColor; }

    /* ---------- 分数与目标进度 ---------- */
    .stats { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-card {
      position: relative;
      overflow: hidden;
      min-height: 58px;
      padding: 9px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: linear-gradient(135deg, rgba(20,28,51,.88), rgba(12,17,32,.8));
      box-shadow: inset 0 1px rgba(255,255,255,.025);
    }
    .stat-card::after {
      content: "";
      position: absolute;
      width: 60px;
      height: 60px;
      right: -25px;
      top: -25px;
      border-radius: 50%;
      background: var(--cyan);
      filter: blur(28px);
      opacity: .12;
    }
    .stat-card.best::after { background: var(--violet); }
    .stat-label { color: var(--muted); font-size: 11px; letter-spacing: .08em; }
    .stat-value { font-size: clamp(22px, 6vw, 29px); font-weight: 750; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
    .stat-card:first-child .stat-value { color: #dffcff; text-shadow: 0 0 18px rgba(55,230,245,.22); }
    .stat-card.best .stat-value { color: #e8e0ff; }

    .progress-row { width: 100%; display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 10px; }
    .progress-row > span:first-child { white-space: nowrap; }
    .progress-track { height: 4px; flex: 1; overflow: hidden; border-radius: 9px; background: rgba(133,151,198,.12); }
    .progress-fill {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--violet), var(--cyan));
      box-shadow: 0 0 10px rgba(55,230,245,.5);
      transition: width .35s ease;
    }
    #progressText { width: 31px; text-align: right; font-variant-numeric: tabular-nums; }

    /* ---------- 10×10 棋盘 ---------- */
    .board-section { display: flex; flex-direction: column; align-items: center; min-height: 0; }
    .board-frame {
      position: relative;
      padding: clamp(6px, 1.5vw, 9px);
      border: 1px solid rgba(113,143,220,.2);
      border-radius: clamp(16px, 4vw, 23px);
      background: linear-gradient(145deg, rgba(23,31,56,.94), rgba(9,14,28,.96));
      box-shadow: 0 18px 50px rgba(0,0,0,.3), inset 0 1px rgba(255,255,255,.04), 0 0 35px rgba(74,91,190,.06);
      transition: border-color .15s, box-shadow .15s;
    }
    .board-frame::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(120deg, rgba(55,230,245,.08), transparent 35%, transparent 70%, rgba(154,123,255,.08));
    }
    .board-frame.can-drop { border-color: rgba(55,230,245,.55); box-shadow: 0 0 28px rgba(55,230,245,.12), inset 0 1px rgba(255,255,255,.04); }
    .board-frame.cannot-drop { border-color: rgba(255,91,128,.45); }
    .board-frame.line-burst { animation: boardPulse .3s ease; }

    .board-grid {
      position: relative;
      width: var(--board-size);
      height: var(--board-size);
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: var(--grid-gap);
      padding: 4px;
      border-radius: 13px;
      background: rgba(3,7,17,.6);
      --active-color: var(--cyan);
    }
    .cell {
      position: relative;
      min-width: 0;
      min-height: 0;
      border-radius: clamp(2px, .8vw, 5px);
      background: rgba(116,139,192,.075);
      box-shadow: inset 0 1px 2px rgba(0,0,0,.16), inset 0 0 0 1px rgba(141,164,221,.025);
      transition: background .1s, box-shadow .1s, opacity .15s;
    }
    .cell.filled, .mini-cell.filled, .drag-cell.filled {
      background: linear-gradient(145deg, var(--tone-light), var(--tone) 58%, var(--tone-dark));
      box-shadow: inset 0 1px 1px rgba(255,255,255,.32), inset 0 -2px 3px rgba(0,0,0,.2), 0 0 8px var(--tone-glow);
    }
    .cell.filled::after, .mini-cell.filled::after, .drag-cell.filled::after {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 22%;
      border-top: 1px solid rgba(255,255,255,.18);
      pointer-events: none;
    }
    .tone-0 { --tone: #21cbd9; --tone-light: #6af5f3; --tone-dark: #12879e; --tone-glow: rgba(55,230,245,.28); }
    .tone-1 { --tone: #8264ed; --tone-light: #b9a2ff; --tone-dark: #5134af; --tone-glow: rgba(154,123,255,.32); }
    .tone-2 { --tone: #ed559f; --tone-light: #ff9dca; --tone-dark: #a82971; --tone-glow: rgba(255,101,179,.28); }
    .tone-3 { --tone: #f1a83b; --tone-light: #ffd37a; --tone-dark: #b36520; --tone-glow: rgba(255,184,77,.28); }
    .tone-4 { --tone: #42cf8b; --tone-light: #86f1b7; --tone-dark: #218957; --tone-glow: rgba(75,226,154,.26); }
    .tone-5 { --tone: #488eea; --tone-light: #8bc5ff; --tone-dark: #2757ac; --tone-glow: rgba(88,157,255,.3); }

    .cell.just-placed { animation: placePop .2s ease-out; }
    .cell.preview-valid {
      background: var(--active-color);
      opacity: .52;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.4), 0 0 9px var(--active-color);
    }
    .cell.preview-invalid { background: rgba(255,76,115,.38); box-shadow: inset 0 0 0 1px rgba(255,113,143,.6); }
    .cell.clearing { z-index: 2; animation: clearCell .25s ease-in forwards; }

    .score-pop-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: inherit; }
    .score-pop {
      position: absolute;
      left: 50%;
      top: 43%;
      transform: translate(-50%, -50%);
      color: #eaffff;
      font-size: clamp(23px, 7vw, 36px);
      font-weight: 800;
      text-shadow: 0 0 16px var(--cyan), 0 2px 5px #000;
      animation: scoreFloat .75s ease-out forwards;
      white-space: nowrap;
    }

    .board-caption {
      width: var(--board-size);
      min-height: 20px;
      padding: 5px 3px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 10px;
    }
    #message { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color .2s; }
    #message.hot { color: var(--cyan); }
    #lineCount { flex: 0 0 auto; color: #aab5d2; font-variant-numeric: tabular-nums; }

    /* ---------- 三件套托盘 ---------- */
    .tray-section {
      width: 100%;
      margin-top: auto;
      padding: 10px 12px 8px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(150deg, rgba(19,26,47,.82), rgba(10,15,29,.76));
      box-shadow: inset 0 1px rgba(255,255,255,.025);
    }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
    .section-heading h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; }
    .section-heading span { color: var(--muted); font-size: 9px; }
    .tray { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .piece-slot {
      position: relative;
      height: clamp(64px, 10dvh, 88px);
      padding: 5px;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 13px;
      background: rgba(98,120,172,.045);
      cursor: grab;
      transition: background .15s, border-color .15s, transform .15s, opacity .2s;
    }
    .piece-slot:not(:disabled):hover { background: rgba(100,130,195,.1); border-color: rgba(107,151,221,.16); }
    .piece-slot:not(:disabled):active { cursor: grabbing; transform: scale(.96); }
    .piece-slot.selected { border-color: rgba(55,230,245,.55); background: rgba(55,230,245,.075); box-shadow: 0 0 15px rgba(55,230,245,.07); }
    .piece-slot.drag-source { opacity: .28; }
    .piece-slot.used { cursor: default; opacity: .32; background: transparent; }
    .piece-slot.used::after { content: "已放置"; color: var(--muted); font-size: 10px; letter-spacing: .08em; }
    .piece-slot:disabled { cursor: default; }

    .mini-piece { display: grid; gap: 2px; pointer-events: none; }
    .mini-cell { position: relative; width: var(--mini-size); height: var(--mini-size); border-radius: 3px; }
    .blank { visibility: hidden; }
    .gesture-hint { margin: 6px 0 0; text-align: center; color: var(--muted); font-size: 9px; letter-spacing: .02em; }
    .keyboard-hint { margin: 0; color: #66728e; font-size: 9px; text-align: center; }

    /* ---------- 拖动时的悬浮方块 ---------- */
    .drag-piece {
      position: fixed;
      z-index: 90;
      display: grid;
      pointer-events: none;
      filter: drop-shadow(0 9px 8px rgba(0,0,0,.35));
      will-change: left, top;
    }
    .drag-piece.invalid { filter: drop-shadow(0 0 8px rgba(255,70,110,.65)); opacity: .72; }
    .drag-piece.invalid .drag-cell.filled { background: linear-gradient(145deg, #ff9aae, #e84269); }
    .drag-cell { position: relative; border-radius: clamp(2px, .8vw, 5px); }
    body.dragging, body.dragging .piece-slot { cursor: grabbing; }

    /* ---------- 暂停、胜利与结束弹窗 ---------- */
    .modal {
      position: fixed;
      z-index: 100;
      inset: 0;
      padding: 22px;
      display: grid;
      place-items: center;
      background: rgba(3,6,15,.76);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: fadeIn .2s ease;
    }
    .modal-card {
      position: relative;
      overflow: hidden;
      width: min(90vw, 390px);
      padding: 29px 25px 23px;
      border: 1px solid rgba(116,152,230,.24);
      border-radius: 26px;
      text-align: center;
      background: linear-gradient(150deg, rgba(25,33,60,.98), rgba(10,15,30,.98));
      box-shadow: 0 28px 80px rgba(0,0,0,.5), inset 0 1px rgba(255,255,255,.05);
      animation: modalIn .28s cubic-bezier(.2,.8,.2,1);
    }
    .modal-card::before {
      content: "";
      position: absolute;
      width: 190px;
      height: 130px;
      left: 50%;
      top: -100px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: var(--violet);
      filter: blur(55px);
      opacity: .24;
    }
    .modal.victory .modal-card { border-color: rgba(55,230,245,.35); }
    .modal.victory .modal-card::before { background: var(--cyan); opacity: .3; }
    .modal-icon {
      position: relative;
      width: 66px;
      height: 66px;
      margin: 0 auto 15px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(154,123,255,.3);
      border-radius: 21px;
      color: #ded4ff;
      background: rgba(154,123,255,.09);
      box-shadow: 0 0 28px rgba(154,123,255,.12);
      font-size: 30px;
      font-weight: 300;
    }
    .victory .modal-icon { color: #c8ffff; border-color: rgba(55,230,245,.35); background: rgba(55,230,245,.08); }
    .modal-eyebrow { margin: 0 0 6px; color: var(--cyan); font-size: 9px; letter-spacing: .24em; }
    .modal-card h2 { margin: 0; font-size: 27px; letter-spacing: .06em; }
    .modal-desc { margin: 10px auto 18px; max-width: 280px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .modal-stats { margin: 0 0 20px; display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; }
    .modal-stat { padding: 10px 3px; border-radius: 12px; background: rgba(119,143,202,.065); }
    .modal-stat strong { display: block; font-size: 19px; font-variant-numeric: tabular-nums; }
    .modal-stat span { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; }
    .modal-actions { display: grid; gap: 9px; }
    .action-button {
      min-height: 47px;
      padding: 11px 18px;
      border: 1px solid transparent;
      border-radius: 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 650;
      letter-spacing: .06em;
      transition: transform .15s, filter .15s;
    }
    .action-button:active { transform: scale(.97); }
    .action-button.primary { color: #051117; background: linear-gradient(100deg, #75f2ef, #55d8f4); box-shadow: 0 7px 23px rgba(55,230,245,.17); }
    .action-button.primary:hover { filter: brightness(1.08); }
    .action-button.secondary { border-color: var(--line); color: #c2cbe1; background: rgba(117,139,194,.07); }

    /* ---------- 动画 ---------- */
    @keyframes placePop { 0% { transform: scale(.55); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
    @keyframes clearCell { 0% { transform: scale(1); filter: brightness(1); } 45% { transform: scale(1.12); filter: brightness(2); } 100% { transform: scale(0); filter: brightness(2.5); opacity: 0; } }
    @keyframes boardPulse { 50% { border-color: rgba(55,230,245,.7); box-shadow: 0 0 40px rgba(55,230,245,.2); } }
    @keyframes scoreFloat { 0% { opacity: 0; transform: translate(-50%,-20%) scale(.7); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-150%) scale(1.05); } }
    @keyframes fadeIn { from { opacity: 0; } }
    @keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(.96); } }

    /* 矮屏与横屏手机使用左右布局，避免页面滚动。 */
    @media (orientation: landscape) and (max-height: 600px) {
      :root { --board-size: min(51vw, 79dvh, 440px); --mini-size: clamp(8px, 2.3vh, 14px); }
      .game-shell {
        max-width: 930px;
        display: grid;
        grid-template-columns: minmax(240px, .85fr) minmax(280px, 1.15fr);
        grid-template-rows: auto auto auto 1fr auto;
        column-gap: 22px;
        row-gap: 7px;
      }
      .topbar { grid-column: 1; grid-row: 1; }
      .stats { grid-column: 1; grid-row: 2; }
      .progress-row { grid-column: 1; grid-row: 3; }
      .board-section { grid-column: 2; grid-row: 1 / 6; align-self: center; justify-self: center; }
      .tray-section { grid-column: 1; grid-row: 4; align-self: center; margin: 0; }
      .keyboard-hint { grid-column: 1; grid-row: 5; }
      .piece-slot { height: clamp(52px, 16dvh, 75px); }
      .brand p { display: none; }
      .stat-card { min-height: 48px; padding: 7px 11px; }
      .stat-value { font-size: 22px; }
      .board-caption { padding-top: 3px; }
    }

    @media (max-height: 650px) and (orientation: portrait) {
      .game-shell { gap: 5px; padding-top: max(7px, env(safe-area-inset-top)); }
      .brand p, .keyboard-hint { display: none; }
      .topbar { min-height: 39px; }
      .brand-mark { width: 34px; height: 34px; }
      .icon-button { width: 36px; height: 36px; }
      .stat-card { min-height: 49px; padding: 7px 12px; }
      .tray-section { padding-top: 7px; padding-bottom: 6px; }
      .gesture-hint { margin-top: 3px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="ambient one"></div>
  <div class="ambient two"></div>

  <main class="game-shell" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <div>
          <h1>方块拼图</h1>
          <p>NEON MATRIX · 1010</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-button" id="pauseButton" type="button" aria-label="暂停游戏" title="暂停（P）">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5Zm7 0a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2V5Z"/></svg>
        </button>
        <button class="icon-button" id="restartButton" type="button" aria-label="重新开始" title="重新开始">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.65 9.18 1.5 1.5 0 1 1 2.84.96A4 4 0 1 0 12 8H9.41l1.3 1.3a1.5 1.5 0 0 1-2.13 2.12l-3.2-3.2a3 3 0 0 1-.88-2.12V3.5a1.5 1.5 0 0 1 3 0v2.06A8.96 8.96 0 0 1 12 2a10 10 0 1 1-9.47 13.2 1.5 1.5 0 0 1 2.9-.74A7 7 0 0 0 12 19V5Z"/></svg>
        </button>
      </div>
    </header>

    <section class="stats" aria-label="游戏数据">
      <div class="stat-card">
        <span class="stat-label">当前分数</span>
        <strong class="stat-value" id="score">0</strong>
      </div>
      <div class="stat-card best">
        <span class="stat-label">最高分</span>
        <strong class="stat-value" id="bestScore">0</strong>
      </div>
    </section>

    <div class="progress-row" aria-label="胜利目标进度">
      <span>目标 1010</span>
      <div class="progress-track"><i class="progress-fill" id="progressFill"></i></div>
      <span id="progressText">0%</span>
    </div>

    <section class="board-section" aria-label="拼图区">
      <div class="board-frame" id="boardFrame">
        <div class="board-grid" id="board" role="grid" aria-label="10乘10方块棋盘，点击选块后可点击棋盘放置" tabindex="0"></div>
        <div class="score-pop-layer" id="scorePopLayer" aria-hidden="true"></div>
      </div>
      <div class="board-caption">
        <span id="message" role="status" aria-live="polite">拖动方块，填满整行或整列</span>
        <span id="lineCount">已消除 0 行</span>
      </div>
    </section>

    <section class="tray-section" aria-label="待放方块区">
      <div class="section-heading">
        <h2>待放方块</h2>
        <span>三个一组 · 不可旋转</span>
      </div>
      <div class="tray" id="tray" role="group" aria-label="三个待放方块"></div>
      <p class="gesture-hint">按住拖入棋盘 · 方块会上浮，不挡手指</p>
    </section>

    <p class="keyboard-hint">也可点击选块再点棋盘 · 方向键移动 · 回车放置 · P 暂停</p>
  </main>

  <div id="dragLayer" aria-hidden="true"></div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-card">
      <div class="modal-icon" id="modalIcon" aria-hidden="true">Ⅱ</div>
      <p class="modal-eyebrow" id="modalEyebrow">稍作休息</p>
      <h2 id="modalTitle">游戏已暂停</h2>
      <p class="modal-desc" id="modalDesc">矩阵会在这里等你。</p>
      <div class="modal-stats" id="modalStats" hidden>
        <div class="modal-stat"><strong id="finalScore">0</strong><span>本局分数</span></div>
        <div class="modal-stat"><strong id="finalLines">0</strong><span>消除行列</span></div>
        <div class="modal-stat"><strong id="finalBest">0</strong><span>历史最高</span></div>
      </div>
      <div class="modal-actions">
        <button class="action-button primary" id="modalPrimary" type="button">继续游戏</button>
        <button class="action-button secondary" id="modalSecondary" type="button" hidden>再来一局</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      // ---------- 常量与方块形状：矩阵中的 1 表示有效方格 ----------
      const SIZE = 10;
      const TARGET_SCORE = 1010;
      const STORAGE_KEY = 'neon-block-puzzle-best-v1';
      const COLORS = ['#37e6f5', '#9a7bff', '#ff65b3', '#f1a83b', '#42cf8b', '#488eea'];

      const makeShape = (name, matrix) => ({
        name,
        matrix,
        width: matrix[0].length,
        height: matrix.length,
        count: matrix.flat().reduce((sum, cell) => sum + cell, 0)
      });

      const SHAPES = [
        makeShape('单格', [[1]]),
        makeShape('双格横条', [[1, 1]]),
        makeShape('双格竖条', [[1], [1]]),
        makeShape('三格横条', [[1, 1, 1]]),
        makeShape('三格竖条', [[1], [1], [1]]),
        makeShape('四格横条', [[1, 1, 1, 1]]),
        makeShape('四格竖条', [[1], [1], [1], [1]]),
        makeShape('五格横条', [[1, 1, 1, 1, 1]]),
        makeShape('五格竖条', [[1], [1], [1], [1], [1]]),
        makeShape('小方阵', [[1, 1], [1, 1]]),
        makeShape('大方阵', [[1, 1, 1], [1, 1, 1], [1, 1, 1]]),
        makeShape('横向矩形', [[1, 1, 1], [1, 1, 1]]),
        makeShape('纵向矩形', [[1, 1], [1, 1], [1, 1]]),
        makeShape('小拐角', [[1, 0], [1, 1]]),
        makeShape('小拐角', [[0, 1], [1, 1]]),
        makeShape('小拐角', [[1, 1], [1, 0]]),
        makeShape('小拐角', [[1, 1], [0, 1]]),
        makeShape('大拐角', [[1, 0, 0], [1, 0, 0], [1, 1, 1]]),
        makeShape('大拐角', [[0, 0, 1], [0, 0, 1], [1, 1, 1]]),
        makeShape('大拐角', [[1, 1, 1], [1, 0, 0], [1, 0, 0]]),
        makeShape('大拐角', [[1, 1, 1], [0, 0, 1], [0, 0, 1]]),
        makeShape('T 形', [[1, 1, 1], [0, 1, 0]]),
        makeShape('T 形', [[0, 1, 0], [1, 1, 1]]),
        makeShape('T 形', [[1, 0], [1, 1], [1, 0]]),
        makeShape('T 形', [[0, 1], [1, 1], [0, 1]]),
        makeShape('Z 形', [[1, 1, 0], [0, 1, 1]]),
        makeShape('Z 形', [[0, 1, 1], [1, 1, 0]]),
        makeShape('Z 形', [[1, 0], [1, 1], [0, 1]]),
        makeShape('Z 形', [[0, 1], [1, 1], [1, 0]]),
        makeShape('十字', [[0, 1, 0], [1, 1, 1], [0, 1, 0]])
      ];

      // ---------- DOM 引用 ----------
      const $ = id => document.getElementById(id);
      const boardEl = $('board');
      const boardFrame = $('boardFrame');
      const trayEl = $('tray');
      const dragLayer = $('dragLayer');
      const scoreEl = $('score');
      const bestScoreEl = $('bestScore');
      const messageEl = $('message');
      const lineCountEl = $('lineCount');
      const progressFill = $('progressFill');
      const progressText = $('progressText');
      const pauseButton = $('pauseButton');
      const modal = $('modal');
      const modalPrimary = $('modalPrimary');
      const modalSecondary = $('modalSecondary');

      // ---------- 游戏状态 ----------
      let board = [];
      let pieces = [];
      let boardCells = [];
      let previewCells = new Set();
      let score = 0;
      let bestScore = loadBestScore();
      let clearedLines = 0;
      let combo = 0;
      let state = 'playing'; // playing / paused / won / over
      let inputLocked = false;
      let hasWon = false;
      let selectedPieceId = null;
      let keyboardCursor = { row: 0, col: 0 };
      let drag = null;
      let pieceSerial = 0;
      let gameSerial = 0;
      let modalMode = '';
      let suppressClick = false;

      function loadBestScore() {
        try {
          const value = Number.parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
          return Number.isFinite(value) && value > 0 ? value : 0;
        } catch (_) {
          return 0; // 隐私模式下存储不可用时仍可正常游戏
        }
      }

      function saveBestScore() {
        try { localStorage.setItem(STORAGE_KEY, String(bestScore)); } catch (_) { /* 忽略存储异常 */ }
      }

      function vibrate(pattern) {
        if (navigator.vibrate) navigator.vibrate(pattern);
      }

      // ---------- 棋盘与托盘绘制 ----------
      function buildBoard() {
        boardEl.innerHTML = '';
        boardCells = [];
        for (let index = 0; index < SIZE * SIZE; index++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.setAttribute('role', 'gridcell');
          cell.dataset.index = index;
          boardEl.appendChild(cell);
          boardCells.push(cell);
        }
      }

      function renderBoard(justPlaced = new Set()) {
        clearPreview();
        boardCells.forEach((cell, index) => {
          const value = board[index];
          cell.className = 'cell';
          if (value !== null) cell.classList.add('filled', `tone-${value}`);
          if (justPlaced.has(index)) cell.classList.add('just-placed');
          const row = Math.floor(index / SIZE) + 1;
          const col = index % SIZE + 1;
          cell.setAttribute('aria-label', `第${row}行第${col}列，${value === null ? '空' : '已占用'}`);
        });
      }

      function makePieceElement(piece, kind, metrics = null) {
        const shape = piece.shape;
        const element = document.createElement('div');
        element.className = kind === 'drag' ? 'drag-piece' : 'mini-piece';
        element.setAttribute('aria-hidden', 'true');

        if (kind === 'drag') {
          element.style.gridTemplateColumns = `repeat(${shape.width}, ${metrics.cellWidth}px)`;
          element.style.gridAutoRows = `${metrics.cellHeight}px`;
          element.style.gap = `${metrics.gapY}px ${metrics.gapX}px`;
        } else {
          element.style.gridTemplateColumns = `repeat(${shape.width}, var(--mini-size))`;
        }

        shape.matrix.forEach(row => {
          row.forEach(filled => {
            const cell = document.createElement('i');
            cell.className = kind === 'drag' ? 'drag-cell' : 'mini-cell';
            if (filled) cell.classList.add('filled', `tone-${piece.color}`);
            else cell.classList.add('blank');
            element.appendChild(cell);
          });
        });
        return element;
      }

      function renderTray() {
        trayEl.innerHTML = '';
        pieces.forEach(piece => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'piece-slot';
          button.dataset.pieceId = piece.id;
          button.setAttribute('aria-label', piece.used ? `${piece.shape.name}，已放置` : `${piece.shape.name}，${piece.shape.count}格，拖动或点击选择`);

          if (piece.used) {
            button.classList.add('used');
            button.disabled = true;
          } else {
            if (piece.id === selectedPieceId) button.classList.add('selected');
            if (drag && drag.piece.id === piece.id) button.classList.add('drag-source');
            button.disabled = state !== 'playing' || inputLocked;
            button.appendChild(makePieceElement(piece, 'mini'));
          }
          trayEl.appendChild(button);
        });
      }

      function updateHud() {
        scoreEl.textContent = score.toLocaleString('zh-CN');
        bestScoreEl.textContent = bestScore.toLocaleString('zh-CN');
        lineCountEl.textContent = `已消除 ${clearedLines} 行`;
        const progress = Math.min(100, Math.floor(score / TARGET_SCORE * 100));
        progressFill.style.width = `${progress}%`;
        progressText.textContent = `${progress}%`;
        pauseButton.disabled = state !== 'playing' || inputLocked;
      }

      function announce(text, hot = false) {
        messageEl.textContent = text;
        messageEl.classList.toggle('hot', hot);
      }

      function showScorePop(points, lines) {
        const pop = document.createElement('span');
        pop.className = 'score-pop';
        pop.textContent = lines ? `+${points} · ${lines} 连消` : `+${points}`;
        $('scorePopLayer').appendChild(pop);
        window.setTimeout(() => pop.remove(), 800);
      }

      // ---------- 核心规则：合法落点、消除、补给与结束判定 ----------
      function canPlace(shape, row, col) {
        if (row < 0 || col < 0 || row + shape.height > SIZE || col + shape.width > SIZE) return false;
        for (let r = 0; r < shape.height; r++) {
          for (let c = 0; c < shape.width; c++) {
            if (shape.matrix[r][c] && board[(row + r) * SIZE + col + c] !== null) return false;
          }
        }
        return true;
      }

      function findFirstPlacement(shape) {
        for (let row = 0; row <= SIZE - shape.height; row++) {
          for (let col = 0; col <= SIZE - shape.width; col++) {
            if (canPlace(shape, row, col)) return { row, col };
          }
        }
        return null;
      }

      function hasAnyMove() {
        return pieces.some(piece => !piece.used && findFirstPlacement(piece.shape));
      }

      function findCompletedLines() {
        const rows = [];
        const cols = [];
        const indices = new Set();

        for (let row = 0; row < SIZE; row++) {
          let full = true;
          for (let col = 0; col < SIZE; col++) {
            if (board[row * SIZE + col] === null) { full = false; break; }
          }
          if (full) rows.push(row);
        }
        for (let col = 0; col < SIZE; col++) {
          let full = true;
          for (let row = 0; row < SIZE; row++) {
            if (board[row * SIZE + col] === null) { full = false; break; }
          }
          if (full) cols.push(col);
        }

        rows.forEach(row => {
          for (let col = 0; col < SIZE; col++) indices.add(row * SIZE + col);
        });
        cols.forEach(col => {
          for (let row = 0; row < SIZE; row++) indices.add(row * SIZE + col);
        });
        return { rows, cols, indices, count: rows.length + cols.length };
      }

      function createPiece() {
        return {
          id: ++pieceSerial,
          shape: SHAPES[Math.floor(Math.random() * SHAPES.length)],
          color: Math.floor(Math.random() * COLORS.length),
          used: false
        };
      }

      function refillPieces() {
        pieces = [createPiece(), createPiece(), createPiece()];
      }

      async function placePiece(pieceId, row, col) {
        const piece = pieces.find(item => item.id === pieceId);
        if (state !== 'playing' || inputLocked || !piece || piece.used || !canPlace(piece.shape, row, col)) return;

        const thisGame = gameSerial;
        inputLocked = true;
        selectedPieceId = null;
        clearPreview();
        piece.used = true;
        const placedIndices = new Set();

        // 先落块，再统一找出所有满行和满列，交叉格只清除一次。
        piece.shape.matrix.forEach((cells, r) => {
          cells.forEach((filled, c) => {
            if (filled) {
              const index = (row + r) * SIZE + col + c;
              board[index] = piece.color;
              placedIndices.add(index);
            }
          });
        });

        let earned = piece.shape.count * 5;
        score += earned;
        renderBoard(placedIndices);
        renderTray();
        vibrate(12);

        const completed = findCompletedLines();
        if (completed.count > 0) {
          combo += 1;
          const linePoints = completed.count * 100 + Math.max(0, completed.count - 1) * 50 + Math.max(0, combo - 1) * 25;
          earned += linePoints;
          score += linePoints;
          clearedLines += completed.count;
          completed.indices.forEach(index => boardCells[index].classList.add('clearing'));
          boardFrame.classList.add('line-burst');
          announce(combo > 1 ? `连击 ×${combo}！消除 ${completed.count} 条` : `漂亮！消除 ${completed.count} 条`, true);
          vibrate([24, 35, 24]);

          // 短暂展示消除动画；重开后用局序号阻止旧计时任务改动新棋盘。
          await new Promise(resolve => window.setTimeout(resolve, 250));
          if (thisGame !== gameSerial) return;
          completed.indices.forEach(index => { board[index] = null; });
          boardFrame.classList.remove('line-burst');
        } else {
          combo = 0;
          announce('继续填满整行或整列');
        }

        updateBest();
        showScorePop(earned, completed.count);
        if (pieces.every(item => item.used)) refillPieces();

        inputLocked = false;
        renderBoard();
        renderTray();
        updateHud();

        // 达到目标优先展示胜利；继续挑战后仍可冲击更高分。
        if (score >= TARGET_SCORE && !hasWon) {
          hasWon = true;
          showEndModal('won');
        } else if (!hasAnyMove()) {
          showEndModal('over');
        }
      }

      function updateBest() {
        if (score > bestScore) {
          bestScore = score;
          saveBestScore();
        }
      }

      // ---------- 落点预览：拖动与键盘共用 ----------
      function clearPreview() {
        previewCells.forEach(cell => cell.classList.remove('preview-valid', 'preview-invalid'));
        previewCells.clear();
        boardFrame.classList.remove('can-drop', 'cannot-drop');
      }

      function showPreview(piece, row, col, valid) {
        clearPreview();
        boardEl.style.setProperty('--active-color', COLORS[piece.color]);
        boardFrame.classList.add(valid ? 'can-drop' : 'cannot-drop');
        piece.shape.matrix.forEach((cells, r) => {
          cells.forEach((filled, c) => {
            const targetRow = row + r;
            const targetCol = col + c;
            if (filled && targetRow >= 0 && targetRow < SIZE && targetCol >= 0 && targetCol < SIZE) {
              const cell = boardCells[targetRow * SIZE + targetCol];
              cell.classList.add(valid ? 'preview-valid' : 'preview-invalid');
              previewCells.add(cell);
            }
          });
        });
      }

      // ---------- 统一 Pointer Events：触屏与鼠标拖放 ----------
      function getDragMetrics(shape) {
        const first = boardCells[0].getBoundingClientRect();
        const second = boardCells[1].getBoundingClientRect();
        const below = boardCells[SIZE].getBoundingClientRect();
        const pitchX = second.left - first.left;
        const pitchY = below.top - first.top;
        return {
          originX: first.left,
          originY: first.top,
          pitchX,
          pitchY,
          cellWidth: first.width,
          cellHeight: first.height,
          gapX: Math.max(0, pitchX - first.width),
          gapY: Math.max(0, pitchY - first.height),
          width: shape.width * pitchX - (pitchX - first.width),
          height: shape.height * pitchY - (pitchY - first.height)
        };
      }

      function beginDrag(event, button) {
        if (state !== 'playing' || inputLocked || drag || event.button > 0) return;
        const piece = pieces.find(item => item.id === Number(button.dataset.pieceId));
        if (!piece || piece.used) return;

        selectedPieceId = null;
        trayEl.querySelectorAll('.selected').forEach(item => item.classList.remove('selected'));
        clearPreview();
        const metrics = getDragMetrics(piece.shape);
        const element = makePieceElement(piece, 'drag', metrics);
        dragLayer.appendChild(element);
        button.classList.add('drag-source');
        document.body.classList.add('dragging');

        drag = {
          piece,
          pointerId: event.pointerId,
          pointerType: event.pointerType,
          button,
          element,
          metrics,
          startX: event.clientX,
          startY: event.clientY,
          moved: false,
          valid: false,
          row: 0,
          col: 0
        };

        try { button.setPointerCapture(event.pointerId); } catch (_) { /* 部分旧浏览器不支持捕获 */ }
        updateDrag(event);
      }

      function updateDrag(event) {
        if (!drag || event.pointerId !== drag.pointerId) return;
        if (event.cancelable) event.preventDefault();
        if (Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) > 6) drag.moved = true;

        const { piece, metrics, element } = drag;
        // 触屏时把方块抬到手指上方；鼠标只需较小偏移。
        const lift = drag.pointerType === 'mouse' ? 18 : Math.max(54, metrics.cellHeight * 1.55);
        const left = event.clientX - metrics.width / 2;
        const top = Math.max(5, event.clientY - metrics.height - lift);
        element.style.left = `${left}px`;
        element.style.top = `${top}px`;

        const nearBoard = left + metrics.width > metrics.originX - metrics.pitchX &&
          left < metrics.originX + SIZE * metrics.pitchX &&
          top + metrics.height > metrics.originY - metrics.pitchY &&
          top < metrics.originY + SIZE * metrics.pitchY;
        const row = Math.round((top - metrics.originY) / metrics.pitchY);
        const col = Math.round((left - metrics.originX) / metrics.pitchX);
        const valid = nearBoard && canPlace(piece.shape, row, col);

        drag.row = row;
        drag.col = col;
        drag.valid = valid;
        element.classList.toggle('invalid', nearBoard && !valid);
        if (nearBoard) showPreview(piece, row, col, valid);
        else clearPreview();
      }

      function finishDrag(event, cancelled = false) {
        if (!drag || event.pointerId !== drag.pointerId) return;
        if (event.cancelable) event.preventDefault();
        const result = {
          pieceId: drag.piece.id,
          row: drag.row,
          col: drag.col,
          valid: drag.valid,
          moved: drag.moved
        };
        cleanupDrag();

        // 有实际拖动时阻止随后的 click；轻点则走“点选方块”流程。
        suppressClick = result.moved;
        window.setTimeout(() => { suppressClick = false; }, 0);
        if (!cancelled && result.moved && result.valid) {
          placePiece(result.pieceId, result.row, result.col);
        } else if (!cancelled && result.moved) {
          announce('这里放不下，换个位置试试');
        }
      }

      function cleanupDrag() {
        if (!drag) return;
        const oldDrag = drag;
        drag = null;
        oldDrag.element.remove();
        oldDrag.button.classList.remove('drag-source');
        document.body.classList.remove('dragging');
        clearPreview();
        try { oldDrag.button.releasePointerCapture(oldDrag.pointerId); } catch (_) { /* 已自动释放 */ }
      }

      // ---------- 点选与键盘操作 ----------
      function selectPiece(pieceId) {
        if (state !== 'playing' || inputLocked) return;
        const piece = pieces.find(item => item.id === pieceId && !item.used);
        if (!piece) return;
        selectedPieceId = pieceId;
        keyboardCursor = findFirstPlacement(piece.shape) || { row: 0, col: 0 };
        renderTray();
        showPreview(piece, keyboardCursor.row, keyboardCursor.col, canPlace(piece.shape, keyboardCursor.row, keyboardCursor.col));
        announce(findFirstPlacement(piece.shape) ? '点击棋盘放置，或用方向键移动' : '这个方块暂时没有可用位置');
        boardEl.focus({ preventScroll: true });
      }

      function clearSelection() {
        selectedPieceId = null;
        clearPreview();
        renderTray();
      }

      function moveKeyboardSelection(rowDelta, colDelta) {
        const piece = pieces.find(item => item.id === selectedPieceId && !item.used);
        if (!piece) return;
        keyboardCursor.row = Math.max(0, Math.min(SIZE - piece.shape.height, keyboardCursor.row + rowDelta));
        keyboardCursor.col = Math.max(0, Math.min(SIZE - piece.shape.width, keyboardCursor.col + colDelta));
        showPreview(piece, keyboardCursor.row, keyboardCursor.col, canPlace(piece.shape, keyboardCursor.row, keyboardCursor.col));
      }

      trayEl.addEventListener('pointerdown', event => {
        const button = event.target.closest('.piece-slot');
        if (button) beginDrag(event, button);
      });
      window.addEventListener('pointermove', event => updateDrag(event), { passive: false });
      window.addEventListener('pointerup', event => finishDrag(event), { passive: false });
      window.addEventListener('pointercancel', event => finishDrag(event, true), { passive: false });

      trayEl.addEventListener('click', event => {
        const button = event.target.closest('.piece-slot');
        if (!button || suppressClick || button.disabled) return;
        selectPiece(Number(button.dataset.pieceId));
      });

      boardEl.addEventListener('click', event => {
        if (state !== 'playing' || inputLocked || selectedPieceId === null) return;
        const cell = event.target.closest('.cell');
        if (!cell) return;
        const piece = pieces.find(item => item.id === selectedPieceId && !item.used);
        if (!piece) return;
        const index = Number(cell.dataset.index);
        const clickedRow = Math.floor(index / SIZE);
        const clickedCol = index % SIZE;
        // 以形状中心对齐点按位置，并限制在棋盘范围内。
        const row = Math.max(0, Math.min(SIZE - piece.shape.height, clickedRow - Math.floor(piece.shape.height / 2)));
        const col = Math.max(0, Math.min(SIZE - piece.shape.width, clickedCol - Math.floor(piece.shape.width / 2)));
        if (canPlace(piece.shape, row, col)) placePiece(piece.id, row, col);
        else {
          showPreview(piece, row, col, false);
          announce('这个位置有重叠，换一个位置试试');
        }
      });

      document.addEventListener('keydown', event => {
        const key = event.key.toLowerCase();
        if (key === 'p') {
          event.preventDefault();
          if (state === 'playing') pauseGame();
          else if (state === 'paused') resumeGame();
          return;
        }
        if (key === 'escape') {
          if (state === 'paused') resumeGame();
          else if (state === 'playing' && selectedPieceId !== null) clearSelection();
          return;
        }
        if (state !== 'playing' || inputLocked || selectedPieceId === null) return;

        const directions = {
          arrowup: [-1, 0], arrowdown: [1, 0], arrowleft: [0, -1], arrowright: [0, 1]
        };
        if (directions[key]) {
          event.preventDefault();
          moveKeyboardSelection(...directions[key]);
        } else if (key === 'enter' || key === ' ') {
          event.preventDefault();
          const piece = pieces.find(item => item.id === selectedPieceId && !item.used);
          if (piece && canPlace(piece.shape, keyboardCursor.row, keyboardCursor.col)) {
            placePiece(piece.id, keyboardCursor.row, keyboardCursor.col);
          } else {
            announce('当前位置无法放置');
          }
        }
      });

      // ---------- 暂停、胜利、结束与重开 ----------
      function pauseGame() {
        if (state !== 'playing' || inputLocked) return;
        cleanupDrag();
        selectedPieceId = null;
        clearPreview();
        state = 'paused';
        renderTray();
        updateHud();
        showEndModal('paused');
      }

      function resumeGame() {
        if (state !== 'paused') return;
        state = 'playing';
        hideModal();
        renderTray();
        updateHud();
        announce('继续游戏，填满整行或整列');
      }

      function showEndModal(mode) {
        cleanupDrag();
        selectedPieceId = null;
        clearPreview();
        modalMode = mode;
        state = mode;
        modal.classList.toggle('victory', mode === 'won');
        $('modalStats').hidden = mode === 'paused';
        $('finalScore').textContent = score.toLocaleString('zh-CN');
        $('finalLines').textContent = clearedLines;
        $('finalBest').textContent = bestScore.toLocaleString('zh-CN');
        modalSecondary.hidden = mode === 'over';

        if (mode === 'paused') {
          $('modalIcon').textContent = 'Ⅱ';
          $('modalEyebrow').textContent = '稍作休息';
          $('modalTitle').textContent = '游戏已暂停';
          $('modalDesc').textContent = '矩阵会在这里等你，准备好后继续。';
          modalPrimary.textContent = '继续游戏';
          modalSecondary.textContent = '再来一局';
        } else if (mode === 'won') {
          $('modalIcon').textContent = '✦';
          $('modalEyebrow').textContent = '目标达成';
          $('modalTitle').textContent = '霓虹点亮！';
          $('modalDesc').textContent = `你已突破 ${TARGET_SCORE} 分！可以继续挑战极限，也可以开启新一局。`;
          modalPrimary.textContent = '继续挑战';
          modalSecondary.textContent = '再来一局';
          vibrate([35, 45, 35, 45, 70]);
        } else {
          $('modalIcon').textContent = '◈';
          $('modalEyebrow').textContent = '本局结束';
          $('modalTitle').textContent = '无处可放';
          $('modalDesc').textContent = '剩余方块都没有合适的位置了。换个摆放策略，再刷新纪录吧！';
          modalPrimary.textContent = '再来一局';
        }

        modal.hidden = false;
        renderTray();
        updateHud();
        window.requestAnimationFrame(() => modalPrimary.focus({ preventScroll: true }));
      }

      function hideModal() {
        modal.hidden = true;
        modalMode = '';
      }

      modalPrimary.addEventListener('click', () => {
        if (modalMode === 'paused') resumeGame();
        else if (modalMode === 'won') {
          state = 'playing';
          hideModal();
          renderTray();
          updateHud();
          announce('无尽挑战已开启，冲击更高分！', true);
          if (!hasAnyMove()) showEndModal('over');
        } else if (modalMode === 'over') {
          startGame();
        }
      });
      modalSecondary.addEventListener('click', startGame);
      pauseButton.addEventListener('click', pauseGame);
      $('restartButton').addEventListener('click', startGame);

      function startGame() {
        gameSerial += 1;
        cleanupDrag();
        board = Array(SIZE * SIZE).fill(null);
        score = 0;
        clearedLines = 0;
        combo = 0;
        pieceSerial = 0;
        selectedPieceId = null;
        inputLocked = false;
        hasWon = false;
        state = 'playing';
        $('scorePopLayer').innerHTML = '';
        boardFrame.classList.remove('line-burst');
        refillPieces();
        hideModal();
        renderBoard();
        renderTray();
        updateHud();
        announce('拖动方块，填满整行或整列');
      }

      // 切到后台时自动暂停，避免回来后误触。
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && state === 'playing' && !inputLocked) pauseGame();
      });

      // 阻止手机浏览器的页面滚动、双击缩放与长按缩放手势。
      document.addEventListener('touchmove', event => event.preventDefault(), { passive: false });
      document.addEventListener('dblclick', event => event.preventDefault(), { passive: false });
      document.addEventListener('gesturestart', event => event.preventDefault(), { passive: false });
      $('app').addEventListener('contextmenu', event => event.preventDefault());

      buildBoard();
      startGame();
    })();
  </script>
</body>
</html>
