<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="一款深色霓虹风的经典熄灯游戏，轻点格子，熄灭所有灯光。">
  <title>熄灯 · Lights Out</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14;
      --panel: rgba(16, 24, 40, 0.78);
      --line: rgba(153, 180, 211, 0.14);
      --text: #edf8ff;
      --muted: #8394aa;
      --cyan: #55f6d2;
      --cyan-bright: #c8fff2;
      --violet: #9b8cff;
      --board-size: min(calc(100vw - 32px), 43dvh, 420px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }

    body {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, rgba(68, 91, 190, 0.19), transparent 35%),
        radial-gradient(circle at 88% 90%, rgba(26, 181, 157, 0.12), transparent 38%),
        var(--bg);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 细微网格让背景更有层次，同时不使用任何图片资源。 */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(135, 170, 200, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(135, 170, 200, 0.035) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    button {
      font: inherit;
      touch-action: none;
    }

    button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    .game-shell {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.35dvh, 13px);
      width: min(100%, 460px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-mark {
      display: grid;
      width: 45px;
      height: 45px;
      place-items: center;
      border: 1px solid rgba(85, 246, 210, 0.28);
      border-radius: 14px;
      color: var(--cyan);
      background: linear-gradient(145deg, rgba(85, 246, 210, 0.13), rgba(85, 246, 210, 0.025));
      box-shadow: inset 0 0 18px rgba(85, 246, 210, 0.06), 0 0 24px rgba(85, 246, 210, 0.07);
    }

    .brand-mark svg {
      width: 25px;
      height: 25px;
      filter: drop-shadow(0 0 6px rgba(85, 246, 210, 0.55));
    }

    h1 {
      margin: 0;
      font-size: clamp(23px, 6vw, 29px);
      font-weight: 750;
      line-height: 1.08;
      letter-spacing: 0.16em;
    }

    .brand-subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 650;
      letter-spacing: 0.28em;
    }

    .level-badge {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #a9b9cb;
      background: rgba(15, 23, 38, 0.66);
      font-size: 11px;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--panel);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.16), inset 0 1px rgba(255, 255, 255, 0.025);
      backdrop-filter: blur(16px);
    }

    .stat {
      position: relative;
      padding: 10px 6px 9px;
      text-align: center;
    }

    .stat + .stat::before {
      content: "";
      position: absolute;
      top: 22%;
      bottom: 22%;
      left: 0;
      width: 1px;
      background: var(--line);
    }

    .stat-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.12em;
    }

    .stat-value {
      display: block;
      min-height: 24px;
      font-size: clamp(18px, 5vw, 23px);
      font-variant-numeric: tabular-nums;
      font-weight: 720;
      line-height: 1.1;
    }

    .stat:first-child .stat-value {
      color: var(--cyan-bright);
      text-shadow: 0 0 16px rgba(85, 246, 210, 0.2);
    }

    .board-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: var(--board-size);
      min-height: 22px;
      padding: 0 3px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .status-main {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 9px var(--cyan);
      animation: breathe 2.2s ease-in-out infinite;
    }

    .status-bar strong {
      color: #c9d7e5;
      font-weight: 650;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: clamp(6px, 1.8vw, 10px);
      width: var(--board-size);
      aspect-ratio: 1;
      padding: clamp(9px, 2.5vw, 14px);
      border: 1px solid rgba(137, 169, 202, 0.18);
      border-radius: clamp(20px, 6vw, 29px);
      background: linear-gradient(145deg, rgba(19, 29, 47, 0.94), rgba(9, 15, 27, 0.96));
      box-shadow:
        0 22px 55px rgba(0, 0, 0, 0.35),
        inset 0 1px rgba(255, 255, 255, 0.045),
        inset 0 0 35px rgba(75, 113, 151, 0.035);
      transition: filter 180ms ease;
    }

    .board.is-paused {
      filter: saturate(0.45) brightness(0.65);
    }

    .cell {
      position: relative;
      min-width: 0;
      padding: 0;
      overflow: hidden;
      border: 1px solid rgba(129, 158, 187, 0.12);
      border-radius: 23%;
      cursor: pointer;
      background: linear-gradient(145deg, #111b2b, #0a111e);
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.34), 0 1px rgba(255, 255, 255, 0.025);
      transition: transform 100ms ease, border-color 180ms ease, background 180ms ease;
      -webkit-appearance: none;
      appearance: none;
    }

    /* 中央圆形灯芯与高光共同构成一盏灯。 */
    .cell::before {
      content: "";
      position: absolute;
      inset: 19%;
      border: 1px solid rgba(141, 165, 188, 0.08);
      border-radius: 50%;
      background: radial-gradient(circle at 38% 30%, #26364a 0, #162234 34%, #0b1422 72%);
      box-shadow: inset 0 3px 7px rgba(0, 0, 0, 0.5);
      transition: all 180ms ease;
    }

    .cell::after {
      content: "";
      position: absolute;
      top: 27%;
      left: 34%;
      width: 18%;
      height: 10%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.09);
      transform: rotate(-35deg);
      transition: background 180ms ease;
    }

    .cell.is-on {
      border-color: rgba(100, 255, 221, 0.43);
      background: linear-gradient(145deg, rgba(31, 93, 91, 0.72), rgba(10, 43, 48, 0.85));
      box-shadow: inset 0 0 15px rgba(85, 246, 210, 0.1), 0 0 15px rgba(38, 224, 190, 0.07);
    }

    .cell.is-on::before {
      border-color: rgba(215, 255, 247, 0.58);
      background: radial-gradient(circle at 36% 28%, #f2fffc 0, #b7ffed 13%, #58f4d1 38%, #16ae9f 68%, #087376 100%);
      box-shadow:
        0 0 9px rgba(105, 255, 220, 0.78),
        0 0 23px rgba(43, 236, 200, 0.43),
        inset 0 -4px 8px rgba(0, 79, 86, 0.24);
    }

    .cell.is-on::after {
      background: rgba(255, 255, 255, 0.65);
    }

    .cell.is-pressed {
      transform: scale(0.9);
    }

    .cell.changed {
      animation: cell-pulse 260ms ease-out;
    }

    @media (hover: hover) and (pointer: fine) {
      .cell:hover {
        border-color: rgba(85, 246, 210, 0.38);
      }
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .control-button,
    .modal-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 45px;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: #dce8f4;
      background: rgba(18, 28, 45, 0.88);
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.035);
      font-size: 14px;
      font-weight: 620;
      cursor: pointer;
      transition: transform 100ms ease, border-color 150ms ease, background 150ms ease;
    }

    .control-button svg {
      width: 17px;
      height: 17px;
      color: #9db0c5;
    }

    .control-button.primary {
      border-color: rgba(85, 246, 210, 0.25);
      color: #09251f;
      background: linear-gradient(135deg, #8bffdf, #43dbc4);
      box-shadow: 0 7px 24px rgba(41, 218, 184, 0.12), inset 0 1px rgba(255, 255, 255, 0.4);
    }

    .control-button.primary svg {
      color: #0a5447;
    }

    .control-button:active,
    .modal-button:active {
      transform: scale(0.97);
    }

    .control-button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 42px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
      text-align: left;
    }

    .hint-icon {
      display: grid;
      flex: 0 0 auto;
      width: 31px;
      height: 31px;
      place-items: center;
      border: 1px solid rgba(155, 140, 255, 0.2);
      border-radius: 10px;
      color: var(--violet);
      background: rgba(155, 140, 255, 0.07);
      font-size: 20px;
      font-weight: 300;
    }

    .hint p {
      margin: 0;
    }

    .hint strong {
      color: #c3d1df;
      font-weight: 600;
    }

    .keyboard-hint {
      margin: -3px 0 0;
      color: #596b80;
      font-size: 9px;
      letter-spacing: 0.04em;
      text-align: center;
    }

    /* 暂停与胜利共用弹窗，减少重复界面代码。 */
    .modal-backdrop {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(3, 7, 14, 0.78);
      backdrop-filter: blur(12px);
      animation: fade-in 180ms ease-out;
      touch-action: none;
    }

    .modal-card {
      width: min(100%, 360px);
      padding: 29px 25px 24px;
      border: 1px solid rgba(137, 177, 199, 0.2);
      border-radius: 27px;
      background:
        radial-gradient(circle at 50% 0, rgba(85, 246, 210, 0.09), transparent 43%),
        linear-gradient(155deg, #152238, #0b1322);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.52), inset 0 1px rgba(255, 255, 255, 0.06);
      text-align: center;
      animation: modal-in 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .modal-icon {
      display: grid;
      width: 66px;
      height: 66px;
      margin: 0 auto 17px;
      place-items: center;
      border: 1px solid rgba(85, 246, 210, 0.35);
      border-radius: 22px;
      color: var(--cyan);
      background: rgba(85, 246, 210, 0.09);
      box-shadow: 0 0 30px rgba(85, 246, 210, 0.1), inset 0 0 18px rgba(85, 246, 210, 0.05);
      font-size: 30px;
      font-weight: 650;
    }

    .modal-kicker {
      margin: 0 0 7px;
      color: var(--cyan);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.24em;
    }

    .modal-card h2 {
      margin: 0;
      font-size: 27px;
      letter-spacing: 0.06em;
    }

    .modal-message {
      margin: 11px 0 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .new-best {
      display: inline-block;
      margin: -7px 0 15px;
      padding: 5px 11px;
      border: 1px solid rgba(255, 213, 112, 0.25);
      border-radius: 999px;
      color: #ffe19b;
      background: rgba(255, 202, 86, 0.08);
      font-size: 11px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin: 0 0 21px;
      padding: 14px 4px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(4, 10, 19, 0.28);
    }

    .result-item + .result-item {
      border-left: 1px solid var(--line);
    }

    .result-item span {
      display: block;
    }

    .result-label {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 10px;
    }

    .result-value {
      color: #e9fff9;
      font-size: 19px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .modal-actions {
      display: grid;
      gap: 9px;
    }

    .modal-button {
      width: 100%;
      min-height: 47px;
    }

    .modal-button.primary {
      border-color: rgba(85, 246, 210, 0.35);
      color: #07271f;
      background: linear-gradient(135deg, #93ffe3, #46ddc4);
      box-shadow: 0 8px 28px rgba(54, 226, 192, 0.13);
    }

    .modal-button.secondary {
      color: var(--muted);
      background: transparent;
      box-shadow: none;
    }

    @keyframes breathe {
      50% { opacity: 0.45; box-shadow: 0 0 4px var(--cyan); }
    }

    @keyframes cell-pulse {
      45% { transform: scale(1.055); }
    }

    @keyframes fade-in {
      from { opacity: 0; }
    }

    @keyframes modal-in {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
    }

    /* 横屏时改成左右布局，确保小高度手机也能完整显示。 */
    @media (orientation: landscape) and (max-height: 600px) {
      :root {
        --board-size: min(42vw, 72dvh, 390px);
      }

      body {
        padding: max(10px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      }

      .game-shell {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) minmax(240px, auto);
        grid-template-areas:
          "header board"
          "stats board"
          "controls board"
          "hint board"
          "keyboard board";
        align-items: center;
        gap: 8px 24px;
        width: min(100%, 820px);
      }

      .topbar { grid-area: header; }
      .stats { grid-area: stats; }
      .board-section { grid-area: board; }
      .controls { grid-area: controls; }
      .hint { grid-area: hint; }
      .keyboard-hint { grid-area: keyboard; }
      .stat { padding-block: 7px; }
      .brand-mark { width: 40px; height: 40px; }
      .hint { justify-content: flex-start; }
    }

    @media (max-height: 580px) and (orientation: portrait) {
      .keyboard-hint { display: none; }
      .hint { min-height: 30px; line-height: 1.35; }
      .hint-icon { width: 27px; height: 27px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell" id="gameShell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M9 18h6M10 21h4M8.4 14.5A6 6 0 1 1 15.6 14.5C14.6 15.2 14 16 14 17h-4c0-1-.6-1.8-1.6-2.5Z"/>
            <path d="M12 1V0M4.2 4.2 3 3M19.8 4.2 21 3"/>
          </svg>
        </div>
        <div>
          <h1>熄灯</h1>
          <p class="brand-subtitle">LIGHTS OUT</p>
        </div>
      </div>
      <span class="level-badge">经典 5 × 5</span>
    </header>

    <section class="stats" aria-label="游戏数据">
      <div class="stat">
        <span class="stat-label">当前得分</span>
        <strong class="stat-value" id="scoreValue">1000</strong>
      </div>
      <div class="stat">
        <span class="stat-label">最高纪录</span>
        <strong class="stat-value" id="highScoreValue">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">游戏用时</span>
        <strong class="stat-value" id="timeValue">00:00</strong>
      </div>
    </section>

    <section class="board-section" aria-label="游戏区域">
      <div class="status-bar">
        <span class="status-main">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="statusText" role="status" aria-live="polite">还剩 <strong id="remainingValue">0</strong> 盏灯</span>
        </span>
        <span>已走 <strong id="movesValue">0</strong> 步</span>
      </div>
      <div class="board" id="board" role="group" aria-label="5 行 5 列灯阵，方向键移动，空格或回车翻转"></div>
    </section>

    <div class="controls">
      <button class="control-button primary" id="newGameButton" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>
        </svg>
        新游戏
      </button>
      <button class="control-button" id="pauseButton" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>
        </svg>
        <span id="pauseButtonText">暂停</span>
      </button>
    </div>

    <div class="hint">
      <span class="hint-icon" aria-hidden="true">＋</span>
      <p><strong>轻点格子</strong>，翻转自身及上下左右的灯<br>让所有灯光熄灭即可获胜</p>
    </div>
    <p class="keyboard-hint">方向键移动 · 空格 / 回车翻转 · P 暂停 · R 重开</p>
  </main>

  <div class="modal-backdrop" id="gameModal" hidden>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalMessage">
      <div class="modal-icon" id="modalIcon" aria-hidden="true">Ⅱ</div>
      <p class="modal-kicker" id="modalKicker">TAKE A BREAK</p>
      <h2 id="modalTitle">游戏已暂停</h2>
      <p class="modal-message" id="modalMessage">灯光也需要休息一下，准备好再继续。</p>
      <span class="new-best" id="newBestBadge" hidden>✦ 新纪录！</span>
      <div class="result-grid" id="resultGrid" hidden>
        <div class="result-item">
          <span class="result-label">本局得分</span>
          <strong class="result-value" id="finalScore">0</strong>
        </div>
        <div class="result-item">
          <span class="result-label">总步数</span>
          <strong class="result-value" id="finalMoves">0</strong>
        </div>
        <div class="result-item">
          <span class="result-label">完成用时</span>
          <strong class="result-value" id="finalTime">00:00</strong>
        </div>
      </div>
      <div class="modal-actions">
        <button class="modal-button primary" id="modalPrimaryButton" type="button">继续游戏</button>
        <button class="modal-button secondary" id="modalSecondaryButton" type="button">重新开始</button>
      </div>
    </section>
  </div>

  <script>
    (() => {
      "use strict";

      // 常量与 DOM 引用集中管理，便于调整规则和界面。
      const SIZE = 5;
      const CELL_COUNT = SIZE * SIZE;
      const BASE_SCORE = 1000;
      const STORAGE_KEY = "neon-lights-out-high-score-v1";
      const $ = (id) => document.getElementById(id);

      const elements = {
        shell: $("gameShell"),
        board: $("board"),
        score: $("scoreValue"),
        highScore: $("highScoreValue"),
        time: $("timeValue"),
        remaining: $("remainingValue"),
        moves: $("movesValue"),
        status: $("statusText"),
        newGame: $("newGameButton"),
        pause: $("pauseButton"),
        pauseText: $("pauseButtonText"),
        modal: $("gameModal"),
        modalIcon: $("modalIcon"),
        modalKicker: $("modalKicker"),
        modalTitle: $("modalTitle"),
        modalMessage: $("modalMessage"),
        resultGrid: $("resultGrid"),
        newBest: $("newBestBadge"),
        finalScore: $("finalScore"),
        finalMoves: $("finalMoves"),
        finalTime: $("finalTime"),
        modalPrimary: $("modalPrimaryButton"),
        modalSecondary: $("modalSecondaryButton")
      };

      let lights = [];
      let cells = [];
      let state = "playing";
      let moves = 0;
      let focusIndex = 0;
      let highScore = loadHighScore();
      let elapsedMs = 0;
      let runStartedAt = 0;
      let timerId = null;
      let lastFocusedElement = null;

      // localStorage 在隐私模式下可能不可用，读写失败不应影响游戏。
      function loadHighScore() {
        try {
          const saved = Number.parseInt(localStorage.getItem(STORAGE_KEY), 10);
          return Number.isFinite(saved) && saved > 0 ? saved : 0;
        } catch {
          return 0;
        }
      }

      function saveHighScore() {
        try {
          localStorage.setItem(STORAGE_KEY, String(highScore));
        } catch {
          // 无法持久化时仍保留本次页面中的最高纪录。
        }
      }

      function formatTime(milliseconds) {
        const totalSeconds = Math.floor(milliseconds / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      function getElapsedMs() {
        return elapsedMs + (state === "playing" ? performance.now() - runStartedAt : 0);
      }

      function calculateScore() {
        const seconds = Math.floor(getElapsedMs() / 1000);
        return Math.max(100, BASE_SCORE - moves * 20 - seconds * 3);
      }

      // 每次操作只翻转自身与上下左右，不包含斜角。
      function toggleLights(target, index) {
        const row = Math.floor(index / SIZE);
        const column = index % SIZE;
        const positions = [
          [row, column],
          [row - 1, column],
          [row + 1, column],
          [row, column - 1],
          [row, column + 1]
        ];
        const changed = [];

        positions.forEach(([r, c]) => {
          if (r >= 0 && r < SIZE && c >= 0 && c < SIZE) {
            const position = r * SIZE + c;
            target[position] = !target[position];
            changed.push(position);
          }
        });
        return changed;
      }

      function shuffledIndexes() {
        const indexes = Array.from({ length: CELL_COUNT }, (_, index) => index);
        for (let i = indexes.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [indexes[i], indexes[j]] = [indexes[j], indexes[i]];
        }
        return indexes;
      }

      // 从全灭状态反向打乱，保证每局都一定有解，且不会直接胜利。
      function generatePuzzle() {
        let puzzle;
        let litCount = 0;
        let attempts = 0;

        do {
          puzzle = Array(CELL_COUNT).fill(false);
          const pressCount = 8 + Math.floor(Math.random() * 5);
          shuffledIndexes().slice(0, pressCount).forEach((index) => toggleLights(puzzle, index));
          litCount = puzzle.filter(Boolean).length;
          attempts += 1;
        } while ((litCount < 6 || litCount > 21) && attempts < 40);

        return puzzle;
      }

      function buildBoard() {
        const fragment = document.createDocumentFragment();
        cells = Array.from({ length: CELL_COUNT }, (_, index) => {
          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = "cell";
          cell.dataset.index = String(index);
          cell.tabIndex = index === 0 ? 0 : -1;
          fragment.appendChild(cell);
          return cell;
        });
        elements.board.appendChild(fragment);
      }

      function updateRovingTabIndex() {
        cells.forEach((cell, index) => {
          cell.tabIndex = index === focusIndex ? 0 : -1;
        });
      }

      function renderBoard(changedIndexes = []) {
        const animated = new Set(changedIndexes);
        cells.forEach((cell, index) => {
          const isOn = lights[index];
          const row = Math.floor(index / SIZE) + 1;
          const column = (index % SIZE) + 1;
          cell.classList.toggle("is-on", isOn);
          cell.setAttribute("aria-pressed", String(isOn));
          cell.setAttribute("aria-label", `第 ${row} 行第 ${column} 列，灯已${isOn ? "点亮" : "熄灭"}`);

          cell.classList.remove("changed");
          if (animated.has(index)) {
            // 强制读取布局以重启动画，快速连续点击也能获得反馈。
            void cell.offsetWidth;
            cell.classList.add("changed");
          }
        });
      }

      function updateStats() {
        elements.score.textContent = String(calculateScore());
        elements.highScore.textContent = String(highScore);
        elements.time.textContent = formatTime(getElapsedMs());
        elements.moves.textContent = String(moves);
        elements.remaining.textContent = String(lights.filter(Boolean).length);
      }

      function tick() {
        updateStats();
      }

      function startTimer() {
        window.clearInterval(timerId);
        timerId = window.setInterval(tick, 250);
        tick();
      }

      function stopTimer() {
        window.clearInterval(timerId);
        timerId = null;
      }

      function openModal(type) {
        if (elements.modal.hidden) {
          lastFocusedElement = document.activeElement;
        }

        const isWin = type === "win";
        elements.modalIcon.textContent = isWin ? "✓" : "Ⅱ";
        elements.modalKicker.textContent = isWin ? "ALL LIGHTS OUT" : "TAKE A BREAK";
        elements.modalTitle.textContent = isWin ? "全场熄灭！" : "游戏已暂停";
        elements.modalMessage.textContent = isWin
          ? "漂亮！你让所有灯光归于宁静。"
          : "灯光也需要休息一下，准备好再继续。";
        elements.resultGrid.hidden = !isWin;
        elements.newBest.hidden = !isWin || !elements.newBest.dataset.show;
        elements.modalPrimary.textContent = isWin ? "再来一局" : "继续游戏";
        elements.modalSecondary.hidden = isWin;
        elements.modal.hidden = false;

        // inert 防止弹窗打开时 Tab 进入背后的棋盘。
        elements.shell.inert = true;
        elements.shell.setAttribute("aria-hidden", "true");
        requestAnimationFrame(() => elements.modalPrimary.focus({ preventScroll: true }));
      }

      function closeModal(restoreFocus = true) {
        elements.modal.hidden = true;
        elements.shell.inert = false;
        elements.shell.removeAttribute("aria-hidden");
        if (restoreFocus && lastFocusedElement instanceof HTMLElement) {
          lastFocusedElement.focus({ preventScroll: true });
        }
      }

      function startNewGame() {
        stopTimer();
        closeModal(false);
        lights = generatePuzzle();
        moves = 0;
        focusIndex = 0;
        elapsedMs = 0;
        state = "playing";
        runStartedAt = performance.now();
        elements.board.classList.remove("is-paused");
        elements.board.setAttribute("aria-disabled", "false");
        elements.pause.disabled = false;
        elements.pauseText.textContent = "暂停";
        elements.status.innerHTML = '还剩 <strong id="remainingValue">0</strong> 盏灯';
        elements.remaining = $("remainingValue");
        elements.newBest.dataset.show = "";
        updateRovingTabIndex();
        renderBoard();
        startTimer();
      }

      function pauseGame() {
        if (state !== "playing") return;
        elapsedMs = getElapsedMs();
        state = "paused";
        stopTimer();
        elements.board.classList.add("is-paused");
        elements.board.setAttribute("aria-disabled", "true");
        elements.pauseText.textContent = "继续";
        updateStats();
        openModal("pause");
      }

      function resumeGame() {
        if (state !== "paused") return;
        state = "playing";
        runStartedAt = performance.now();
        elements.board.classList.remove("is-paused");
        elements.board.setAttribute("aria-disabled", "false");
        elements.pauseText.textContent = "暂停";
        closeModal();
        startTimer();
      }

      function finishGame() {
        elapsedMs = getElapsedMs();
        state = "won";
        stopTimer();
        elements.pause.disabled = true;
        elements.board.setAttribute("aria-disabled", "true");

        const finalScore = calculateScore();
        const isNewBest = finalScore > highScore;
        if (isNewBest) {
          highScore = finalScore;
          saveHighScore();
        }

        updateStats();
        elements.status.textContent = "全部熄灭，漂亮！";
        elements.finalScore.textContent = String(finalScore);
        elements.finalMoves.textContent = String(moves);
        elements.finalTime.textContent = formatTime(elapsedMs);
        elements.newBest.dataset.show = isNewBest ? "true" : "";
        openModal("win");
      }

      function makeMove(index, event) {
        if (state !== "playing") return;
        const changed = toggleLights(lights, index);
        moves += 1;
        focusIndex = index;
        updateRovingTabIndex();
        renderBoard(changed);
        updateStats();

        // 支持的触屏设备提供轻震动；不支持时静默跳过。
        if (event && event.pointerType === "touch" && navigator.vibrate) {
          navigator.vibrate(12);
        }

        if (lights.every((isOn) => !isOn)) {
          finishGame();
        }
      }

      function focusCell(index) {
        focusIndex = Math.max(0, Math.min(CELL_COUNT - 1, index));
        updateRovingTabIndex();
        cells[focusIndex].focus({ preventScroll: true });
      }

      // 使用按钮原生 click，触屏、鼠标、空格与回车共用同一套规则。
      elements.board.addEventListener("click", (event) => {
        const cell = event.target.closest(".cell");
        if (!cell) return;
        makeMove(Number(cell.dataset.index), event);
      });

      elements.board.addEventListener("keydown", (event) => {
        const cell = event.target.closest(".cell");
        if (!cell || state !== "playing") return;
        const index = Number(cell.dataset.index);
        const row = Math.floor(index / SIZE);
        const column = index % SIZE;
        let nextIndex = index;

        if (event.key === "ArrowUp" && row > 0) nextIndex -= SIZE;
        else if (event.key === "ArrowDown" && row < SIZE - 1) nextIndex += SIZE;
        else if (event.key === "ArrowLeft" && column > 0) nextIndex -= 1;
        else if (event.key === "ArrowRight" && column < SIZE - 1) nextIndex += 1;
        else if (event.key === "Home") nextIndex = row * SIZE;
        else if (event.key === "End") nextIndex = row * SIZE + SIZE - 1;
        else return; // 空格和回车交由按钮原生 click 处理，避免重复翻转。

        event.preventDefault();
        focusCell(nextIndex);
      });

      elements.board.addEventListener("pointerdown", (event) => {
        if (state !== "playing" || event.button !== 0) return;
        const cell = event.target.closest(".cell");
        if (cell) cell.classList.add("is-pressed");
      });

      function clearPressedCells() {
        cells.forEach((cell) => cell.classList.remove("is-pressed"));
      }

      window.addEventListener("pointerup", clearPressedCells);
      window.addEventListener("pointercancel", clearPressedCells);
      elements.board.addEventListener("animationend", (event) => {
        if (event.animationName === "cell-pulse") event.target.classList.remove("changed");
      });
      elements.board.addEventListener("contextmenu", (event) => event.preventDefault());

      elements.newGame.addEventListener("click", startNewGame);
      elements.pause.addEventListener("click", () => {
        if (state === "playing") pauseGame();
        else if (state === "paused") resumeGame();
      });
      elements.modalPrimary.addEventListener("click", () => {
        if (state === "paused") resumeGame();
        else if (state === "won") startNewGame();
      });
      elements.modalSecondary.addEventListener("click", startNewGame);

      document.addEventListener("keydown", (event) => {
        if (event.ctrlKey || event.metaKey || event.altKey) return;

        if (!elements.modal.hidden && event.key === "Tab") {
          // 弹窗只有两个按钮，手动循环焦点以保持完整的键盘可访问性。
          const buttons = [elements.modalPrimary, elements.modalSecondary].filter((button) => !button.hidden);
          const current = buttons.indexOf(document.activeElement);
          const direction = event.shiftKey ? -1 : 1;
          const next = (current + direction + buttons.length) % buttons.length;
          event.preventDefault();
          buttons[next].focus();
          return;
        }

        if (event.key === "Escape" && state === "paused") {
          event.preventDefault();
          resumeGame();
        } else if (event.key.toLowerCase() === "p" && state !== "won") {
          event.preventDefault();
          if (state === "playing") pauseGame();
          else resumeGame();
        } else if (event.key.toLowerCase() === "r") {
          event.preventDefault();
          startNewGame();
        }
      });

      // 切到后台时自动暂停，避免计时和得分在看不见页面时继续变化。
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && state === "playing") pauseGame();
      });

      // 补充拦截旧版移动端的双击缩放、捏合缩放和橡皮筋滚动。
      document.addEventListener("dblclick", (event) => event.preventDefault(), { passive: false });
      document.addEventListener("gesturestart", (event) => event.preventDefault(), { passive: false });
      document.addEventListener("touchmove", (event) => event.preventDefault(), { passive: false });

      buildBoard();
      startNewGame();
    })();
  </script>
</body>
</html>
