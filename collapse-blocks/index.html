<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070816">
  <meta name="color-scheme" content="dark">
  <title>消灭星星 · 霓虹版</title>
  <style>
    /* ---------- 基础与移动端适配 ---------- */
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }

    body {
      position: fixed;
      inset: 0;
      color: #f4f5ff;
      background:
        radial-gradient(circle at 12% 8%, rgba(102, 55, 200, 0.22), transparent 35%),
        radial-gradient(circle at 90% 85%, rgba(0, 222, 255, 0.12), transparent 34%),
        #070816;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.32;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.7) 0 0.6px, transparent 0.9px),
        radial-gradient(circle, rgba(98, 235, 255, 0.6) 0 0.7px, transparent 1px);
      background-position: 0 0, 17px 23px;
      background-size: 47px 47px, 71px 71px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }

    button {
      margin: 0;
      border: 0;
      color: inherit;
      font: inherit;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 2px solid #75efff;
      outline-offset: 3px;
    }

    .app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 560px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));
    }

    /* ---------- 顶栏与计分 ---------- */
    .topbar {
      display: flex;
      flex: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 9px;
    }

    .brand-star {
      display: grid;
      flex: none;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 1px solid rgba(255, 126, 230, 0.42);
      border-radius: 13px;
      color: #fff6fd;
      background: linear-gradient(145deg, #ff64d4, #8a48ff);
      box-shadow: 0 0 22px rgba(236, 75, 255, 0.32), inset 0 1px rgba(255, 255, 255, 0.48);
      font-size: 23px;
      text-shadow: 0 0 8px white;
      transform: rotate(-7deg);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.15;
    }

    .brand-subtitle {
      margin: 3px 0 0;
      color: #898da9;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.28em;
    }

    .actions {
      display: flex;
      flex: none;
      gap: 7px;
    }

    .icon-button {
      display: inline-flex;
      min-width: 46px;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 10px;
      border: 1px solid rgba(151, 161, 211, 0.2);
      border-radius: 12px;
      color: #cfd3ee;
      background: rgba(23, 25, 50, 0.8);
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.04);
      cursor: pointer;
      font-size: 12px;
      transition: border-color 160ms, background 160ms, transform 160ms;
    }

    .icon-button .button-icon {
      color: #73ebff;
      font-size: 17px;
      font-weight: 800;
      line-height: 1;
    }

    .icon-button:active {
      transform: scale(0.95);
    }

    .icon-button:disabled {
      cursor: default;
      opacity: 0.42;
    }

    @media (hover: hover) {
      .icon-button:hover:not(:disabled) {
        border-color: rgba(112, 235, 255, 0.55);
        background: rgba(32, 37, 70, 0.94);
      }
    }

    .stats {
      display: grid;
      flex: none;
      grid-template-columns: 1.2fr 1fr 0.8fr;
      overflow: hidden;
      border: 1px solid rgba(136, 148, 207, 0.17);
      border-radius: 16px;
      background: linear-gradient(120deg, rgba(27, 29, 59, 0.91), rgba(15, 18, 40, 0.88));
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.18), inset 0 1px rgba(255, 255, 255, 0.04);
    }

    .stat {
      position: relative;
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 9px 5px 8px;
    }

    .stat + .stat::before {
      content: "";
      position: absolute;
      top: 23%;
      bottom: 23%;
      left: 0;
      width: 1px;
      background: linear-gradient(transparent, rgba(151, 161, 211, 0.25), transparent);
    }

    .stat-label {
      margin-bottom: 2px;
      color: #9298b9;
      font-size: 10px;
      letter-spacing: 0.12em;
    }

    .stat-value {
      max-width: 100%;
      overflow: hidden;
      color: #f5f6ff;
      font-size: 21px;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      line-height: 1.2;
      text-overflow: ellipsis;
    }

    .stat:first-child .stat-value {
      color: #78efff;
      text-shadow: 0 0 15px rgba(73, 224, 255, 0.38);
    }

    .stat-value.bump {
      animation: score-bump 260ms ease-out;
    }

    /* ---------- 棋盘与星星 ---------- */
    .board-wrap {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      align-items: center;
      justify-content: center;
    }

    .board {
      position: relative;
      flex: none;
      width: min(100%, 520px);
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid rgba(134, 151, 225, 0.23);
      border-radius: 20px;
      background-color: rgba(10, 12, 30, 0.87);
      background-image:
        linear-gradient(rgba(131, 149, 220, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(131, 149, 220, 0.055) 1px, transparent 1px),
        radial-gradient(circle at 50% 45%, rgba(62, 55, 132, 0.16), transparent 70%);
      background-size: 10% 10%, 10% 10%, 100% 100%;
      box-shadow:
        0 20px 55px rgba(0, 0, 0, 0.42),
        0 0 35px rgba(80, 68, 190, 0.1),
        inset 0 1px rgba(255, 255, 255, 0.055),
        inset 0 0 30px rgba(0, 0, 0, 0.28);
      container-type: inline-size;
      isolation: isolate;
    }

    .tile {
      --row: 0;
      --col: 0;
      position: absolute;
      z-index: 2;
      top: calc(var(--row) * 10%);
      left: calc(var(--col) * 10%);
      width: 10%;
      height: 10%;
      padding: 0;
      border-radius: 25%;
      outline: none;
      background: transparent;
      cursor: pointer;
      transition:
        top 280ms cubic-bezier(0.22, 0.8, 0.28, 1),
        left 280ms cubic-bezier(0.22, 0.8, 0.28, 1);
    }

    .tile::before {
      content: "";
      position: absolute;
      inset: 7%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 26%;
      background: linear-gradient(145deg, var(--light) 0%, var(--color) 46%, var(--dark) 100%);
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.5),
        inset 0 -3px 5px rgba(0, 0, 0, 0.2),
        0 0 9px var(--glow);
      transition: transform 150ms, filter 150ms, box-shadow 150ms;
    }

    .tile::after {
      content: "★";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, 0.91);
      font-size: clamp(14px, 5vw, 28px);
      font-size: 5.4cqi;
      line-height: 1;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.8), 0 2px 2px rgba(0, 0, 0, 0.22);
      transition: transform 150ms;
    }

    .color-0 {
      --light: #ff8be5;
      --color: #f34bbb;
      --dark: #a8279a;
      --glow: rgba(255, 70, 201, 0.48);
    }

    .color-1 {
      --light: #80f5ff;
      --color: #24c9ed;
      --dark: #2372c6;
      --glow: rgba(44, 220, 255, 0.46);
    }

    .color-2 {
      --light: #b5ff9b;
      --color: #54d888;
      --dark: #159787;
      --glow: rgba(85, 244, 161, 0.4);
    }

    .color-3 {
      --light: #ffe993;
      --color: #ffb640;
      --dark: #ee6478;
      --glow: rgba(255, 183, 66, 0.45);
    }

    .color-4 {
      --light: #c7a0ff;
      --color: #8b66f6;
      --dark: #5540c7;
      --glow: rgba(151, 105, 255, 0.5);
    }

    @media (hover: hover) {
      .tile:hover::before {
        filter: brightness(1.13);
        transform: translateY(-1px) scale(1.065);
        box-shadow:
          inset 0 1px 2px rgba(255, 255, 255, 0.55),
          inset 0 -3px 5px rgba(0, 0, 0, 0.18),
          0 0 15px var(--glow);
      }

      .tile:hover::after {
        transform: scale(1.08) rotate(-5deg);
      }
    }

    .tile:active::before {
      transform: scale(0.9);
    }

    .tile:focus-visible::before {
      outline: 2px solid white;
      outline-offset: 1px;
      box-shadow: 0 0 0 3px rgba(107, 234, 255, 0.45), 0 0 17px var(--glow);
    }

    .tile.spawn {
      animation: tile-spawn 330ms both;
      animation-delay: var(--delay, 0ms);
    }

    .tile.removing {
      z-index: 6;
      pointer-events: none;
      animation: tile-remove 230ms ease-in forwards;
    }

    .tile.invalid {
      animation: tile-shake 280ms ease;
    }

    .score-float {
      position: absolute;
      z-index: 12;
      pointer-events: none;
      color: #fff8c8;
      font-size: 19px;
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      text-shadow: 0 0 9px #ffb837, 0 2px 4px rgba(0, 0, 0, 0.5);
      transform: translate(-50%, -50%);
      animation: score-float 800ms ease-out forwards;
    }

    .particle {
      position: absolute;
      z-index: 10;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      pointer-events: none;
      background: var(--light);
      box-shadow: 0 0 7px var(--color);
      animation: particle-fly 560ms ease-out forwards;
    }

    .toast {
      position: absolute;
      z-index: 30;
      bottom: 9px;
      left: 50%;
      width: max-content;
      max-width: 92%;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      color: #f5f2ff;
      background: rgba(18, 19, 42, 0.94);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      opacity: 0;
      font-size: 12px;
      text-align: center;
      transform: translate(-50%, 8px);
      transition: opacity 180ms, transform 180ms;
    }

    .toast.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ---------- 操作说明 ---------- */
    .help {
      flex: none;
      min-height: 40px;
      color: #858ba9;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    .help p {
      margin: 0;
    }

    .help-main {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 2px 8px;
    }

    .help strong {
      color: #c9cee8;
      font-weight: 600;
    }

    .hint-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #62eaff;
      box-shadow: 0 0 8px #38d9ff;
    }

    .desktop-help {
      margin-top: 2px !important;
      color: #646b8c;
      font-size: 10px;
    }

    /* ---------- 暂停与结算弹窗 ---------- */
    .modal {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
      background: rgba(4, 5, 15, 0.76);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: modal-fade 180ms ease-out;
    }

    .modal-card {
      width: min(100%, 370px);
      padding: 27px 24px 23px;
      border: 1px solid rgba(146, 158, 226, 0.27);
      border-radius: 25px;
      background:
        radial-gradient(circle at 50% 0%, rgba(124, 81, 230, 0.19), transparent 45%),
        linear-gradient(145deg, rgba(29, 31, 63, 0.98), rgba(13, 15, 35, 0.98));
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.52), inset 0 1px rgba(255, 255, 255, 0.07);
      text-align: center;
      animation: card-enter 260ms cubic-bezier(0.2, 0.8, 0.25, 1.1);
    }

    .modal-icon {
      display: grid;
      width: 65px;
      height: 65px;
      margin: 0 auto 14px;
      place-items: center;
      border: 1px solid rgba(126, 233, 255, 0.35);
      border-radius: 21px;
      color: #a4f5ff;
      background: linear-gradient(145deg, rgba(47, 210, 244, 0.22), rgba(121, 74, 232, 0.24));
      box-shadow: 0 0 28px rgba(74, 220, 255, 0.18);
      font-size: 34px;
      text-shadow: 0 0 12px currentColor;
    }

    .modal-icon.victory {
      color: #fff0a0;
      border-color: rgba(255, 222, 112, 0.4);
      background: linear-gradient(145deg, rgba(255, 195, 64, 0.25), rgba(238, 77, 190, 0.2));
      box-shadow: 0 0 30px rgba(255, 194, 74, 0.2);
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #777fA6;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.26em;
      text-transform: uppercase;
    }

    .modal h2 {
      margin: 0;
      font-size: 27px;
      letter-spacing: 0.05em;
    }

    .modal-description {
      margin: 10px auto 20px;
      color: #9ba2c2;
      font-size: 13px;
      line-height: 1.75;
    }

    .result {
      display: flex;
      margin: 17px 0 12px;
      flex-direction: column;
      padding: 15px;
      border: 1px solid rgba(122, 231, 255, 0.14);
      border-radius: 16px;
      background: rgba(7, 10, 27, 0.52);
    }

    .result span {
      color: #8c94b5;
      font-size: 11px;
      letter-spacing: 0.12em;
    }

    .result strong {
      margin-top: 2px;
      color: #80efff;
      font-size: 36px;
      font-variant-numeric: tabular-nums;
      line-height: 1.25;
      text-shadow: 0 0 18px rgba(65, 223, 255, 0.35);
    }

    .result-meta {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      color: #858eaf;
      font-size: 12px;
    }

    .result-meta b {
      margin-left: 4px;
      color: #e5e8f8;
      font-variant-numeric: tabular-nums;
    }

    .modal-button {
      width: 100%;
      min-height: 49px;
      padding: 0 18px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.06em;
      transition: transform 150ms, filter 150ms;
    }

    .modal-button:active {
      transform: scale(0.97);
    }

    .modal-button.primary {
      color: #07131d;
      background: linear-gradient(105deg, #76f2ff, #8eb7ff 52%, #d49aff);
      box-shadow: 0 8px 25px rgba(80, 214, 255, 0.2), inset 0 1px rgba(255, 255, 255, 0.65);
    }

    .modal-button.secondary {
      margin-top: 9px;
      border: 1px solid rgba(149, 158, 208, 0.2);
      color: #b8bed8;
      background: rgba(34, 37, 67, 0.62);
    }

    @media (hover: hover) {
      .modal-button:hover {
        filter: brightness(1.08);
      }
    }

    /* ---------- 小屏、横屏与动画 ---------- */
    @media (max-width: 360px) {
      .app {
        padding-right: 10px;
        padding-left: 10px;
      }

      h1 {
        font-size: 19px;
      }

      .brand-star {
        width: 36px;
        height: 36px;
      }

      .icon-button {
        padding: 0 8px;
      }

      .button-text {
        display: none;
      }
    }

    @media (max-height: 650px) and (orientation: portrait) {
      .app {
        gap: 6px;
        padding-top: calc(6px + env(safe-area-inset-top));
        padding-bottom: calc(6px + env(safe-area-inset-bottom));
      }

      .brand-star {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        font-size: 20px;
      }

      h1 {
        font-size: 19px;
      }

      .brand-subtitle {
        display: none;
      }

      .icon-button {
        min-height: 36px;
      }

      .stat {
        padding-top: 6px;
        padding-bottom: 6px;
      }

      .stat-value {
        font-size: 18px;
      }

      .help {
        min-height: 29px;
        font-size: 10px;
      }

      .desktop-help {
        display: none;
      }
    }

    @media (orientation: landscape) and (max-height: 600px) {
      .app {
        display: grid;
        max-width: 900px;
        grid-template-columns: minmax(0, 1fr) minmax(245px, 0.82fr);
        grid-template-rows: auto auto 1fr;
        gap: 8px 15px;
        padding-top: calc(8px + env(safe-area-inset-top));
        padding-bottom: calc(8px + env(safe-area-inset-bottom));
      }

      .board-wrap {
        grid-column: 1;
        grid-row: 1 / 4;
      }

      .topbar {
        grid-column: 2;
        grid-row: 1;
      }

      .stats {
        grid-column: 2;
        grid-row: 2;
      }

      .help {
        grid-column: 2;
        grid-row: 3;
        align-self: start;
      }

      .brand-subtitle,
      .desktop-help {
        display: none;
      }

      .brand-star {
        width: 34px;
        height: 34px;
        font-size: 19px;
      }

      h1 {
        font-size: 18px;
      }

      .icon-button {
        min-height: 35px;
      }
    }

    @keyframes tile-spawn {
      from { opacity: 0; transform: scale(0.45) rotate(-12deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    @keyframes tile-remove {
      0% { opacity: 1; transform: scale(1); filter: brightness(1); }
      38% { opacity: 1; transform: scale(1.2) rotate(5deg); filter: brightness(1.65); }
      100% { opacity: 0; transform: scale(0.15) rotate(-15deg); filter: brightness(2); }
    }

    @keyframes tile-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8%); }
      55% { transform: translateX(8%); }
      78% { transform: translateX(-4%); }
    }

    @keyframes score-bump {
      45% { transform: scale(1.18); }
    }

    @keyframes score-float {
      0% { opacity: 0; transform: translate(-50%, -30%) scale(0.7); }
      20% { opacity: 1; transform: translate(-50%, -55%) scale(1.08); }
      100% { opacity: 0; transform: translate(-50%, -170%) scale(1); }
    }

    @keyframes particle-fly {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.15); }
    }

    @keyframes modal-fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes card-enter {
      from { opacity: 0; transform: translateY(15px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        animation-delay: 0ms !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-star" aria-hidden="true">★</div>
        <div>
          <h1>消灭星星</h1>
          <p class="brand-subtitle">NEON POP</p>
        </div>
      </div>
      <div class="actions">
        <button class="icon-button" id="pauseButton" type="button" aria-label="暂停游戏" title="暂停（Esc）">
          <span class="button-icon" aria-hidden="true">Ⅱ</span><span class="button-text">暂停</span>
        </button>
        <button class="icon-button" id="restartButton" type="button" aria-label="重新开始" title="重新开始">
          <span class="button-icon" aria-hidden="true">↻</span><span class="button-text">重开</span>
        </button>
      </div>
    </header>

    <section class="stats" aria-label="游戏数据">
      <div class="stat">
        <span class="stat-label">本局分数</span>
        <strong class="stat-value" id="score">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">最高分</span>
        <strong class="stat-value" id="bestScore">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">剩余</span>
        <strong class="stat-value" id="remaining">100</strong>
      </div>
    </section>

    <section class="board-wrap" id="boardWrap" aria-label="游戏区">
      <div class="board" id="board" role="grid" aria-label="10 行 10 列星星棋盘" aria-rowcount="10" aria-colcount="10"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>

    <footer class="help">
      <p class="help-main">
        <span class="hint-dot" aria-hidden="true"></span>
        <strong>轻点上下左右相连的同色星星</strong>
        <span>2 颗起消除 · 5 × 数量² 分</span>
      </p>
      <p class="desktop-help">方向键移动 · 空格 / 回车消除 · Esc 暂停 · 清屏奖励 2000 分</p>
    </footer>
  </main>

  <div class="modal" id="pauseModal" hidden aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="pauseTitle" aria-describedby="pauseDescription">
      <div class="modal-icon" aria-hidden="true">Ⅱ</div>
      <p class="eyebrow">TAKE A BREAK</p>
      <h2 id="pauseTitle">游戏暂停</h2>
      <p class="modal-description" id="pauseDescription">星星们会在这里等你。<br>准备好后继续冲击高分吧！</p>
      <button class="modal-button primary" id="resumeButton" type="button">继续游戏</button>
      <button class="modal-button secondary" id="pauseRestartButton" type="button">重新开始</button>
    </div>
  </div>

  <div class="modal" id="endModal" hidden aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="endTitle" aria-describedby="endMessage">
      <div class="modal-icon" id="endIcon" aria-hidden="true">✦</div>
      <p class="eyebrow">GAME RESULT</p>
      <h2 id="endTitle">游戏结束</h2>
      <div class="result">
        <span>最终得分</span>
        <strong id="finalScore">0</strong>
      </div>
      <div class="result-meta">
        <span>最高分 <b id="finalBest">0</b></span>
        <span>剩余 <b id="finalRemaining">0</b></span>
      </div>
      <p class="modal-description" id="endMessage">没有可消除的星星了。</p>
      <button class="modal-button primary" id="playAgainButton" type="button">再来一局</button>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      // ---------- 常量与页面元素 ----------
      const ROWS = 10;
      const COLS = 10;
      const COLOR_COUNT = 5;
      const CLEAR_BONUS = 2000;
      const STORAGE_KEY = "neon-pop-best-score-v1";
      const COLOR_NAMES = ["粉色", "蓝色", "绿色", "金色", "紫色"];
      const DIRECTIONS = [[-1, 0], [1, 0], [0, -1], [0, 1]];

      const boardElement = document.getElementById("board");
      const boardWrap = document.getElementById("boardWrap");
      const scoreElement = document.getElementById("score");
      const bestElement = document.getElementById("bestScore");
      const remainingElement = document.getElementById("remaining");
      const toastElement = document.getElementById("toast");
      const pauseButton = document.getElementById("pauseButton");
      const restartButton = document.getElementById("restartButton");
      const pauseModal = document.getElementById("pauseModal");
      const endModal = document.getElementById("endModal");
      const resumeButton = document.getElementById("resumeButton");
      const pauseRestartButton = document.getElementById("pauseRestartButton");
      const playAgainButton = document.getElementById("playAgainButton");
      const endIcon = document.getElementById("endIcon");
      const endTitle = document.getElementById("endTitle");
      const endMessage = document.getElementById("endMessage");
      const finalScore = document.getElementById("finalScore");
      const finalBest = document.getElementById("finalBest");
      const finalRemaining = document.getElementById("finalRemaining");

      let board = [];
      let tileMap = new Map();
      let nextTileId = 1;
      let score = 0;
      let bestScore = loadBestScore();
      let gameState = "playing"; // playing、paused 或 ended
      let busy = false;
      let focusedTileId = null;
      let gameVersion = 0;
      let toastTimer = 0;

      // ---------- 本地最高分 ----------
      function loadBestScore() {
        try {
          const saved = Number.parseInt(localStorage.getItem(STORAGE_KEY), 10);
          return Number.isFinite(saved) && saved > 0 ? saved : 0;
        } catch (error) {
          // 隐私模式或禁用存储时，游戏仍可在当前页面正常运行。
          return 0;
        }
      }

      function saveBestScore() {
        try {
          localStorage.setItem(STORAGE_KEY, String(bestScore));
        } catch (error) {
          // 存储不可用时仅保留本次会话中的最高分。
        }
      }

      // ---------- 棋盘生成与绘制 ----------
      function newGame() {
        gameVersion += 1;
        gameState = "playing";
        busy = false;
        score = 0;
        nextTileId = 1;
        focusedTileId = null;
        tileMap = new Map();
        window.clearTimeout(toastTimer);
        toastElement.classList.remove("visible");
        hideModal(pauseModal, false);
        hideModal(endModal, false);
        pauseButton.disabled = false;
        boardElement.replaceChildren();

        // 极低概率下全盘没有可消除组合，此时直接重新生成。
        do {
          board = Array.from({ length: ROWS }, (_, row) =>
            Array.from({ length: COLS }, (_, col) => ({
              id: nextTileId++,
              color: Math.floor(Math.random() * COLOR_COUNT),
              row,
              col,
              element: null
            }))
          );
        } while (!hasMoves());

        const fragment = document.createDocumentFragment();
        for (const row of board) {
          for (const tile of row) {
            tileMap.set(tile.id, tile);
            tile.element = createTileElement(tile);
            fragment.appendChild(tile.element);
          }
        }
        boardElement.appendChild(fragment);
        setRovingTile(board[0][0]);
        updateStats();
        fitBoard();
      }

      function createTileElement(tile) {
        const element = document.createElement("button");
        element.type = "button";
        element.className = `tile color-${tile.color} spawn`;
        element.dataset.tileId = String(tile.id);
        element.tabIndex = -1;
        element.setAttribute("role", "gridcell");
        element.style.setProperty("--delay", `${(tile.row + tile.col) * 12}ms`);
        updateTileElement(tile, element);
        return element;
      }

      function updateTileElement(tile, element = tile.element) {
        element.style.setProperty("--row", String(tile.row));
        element.style.setProperty("--col", String(tile.col));
        element.setAttribute("aria-rowindex", String(tile.row + 1));
        element.setAttribute("aria-colindex", String(tile.col + 1));
        element.setAttribute(
          "aria-label",
          `${COLOR_NAMES[tile.color]}星星，第 ${tile.row + 1} 行，第 ${tile.col + 1} 列`
        );
      }

      // ---------- 连通组查找、消除与重排 ----------
      function getConnectedGroup(startTile) {
        const group = [];
        const visited = new Set();
        const stack = [startTile];

        while (stack.length > 0) {
          const tile = stack.pop();
          if (visited.has(tile.id)) continue;
          visited.add(tile.id);
          group.push(tile);

          // 只检查上下左右，不把斜向相邻算作连通。
          for (const [rowDelta, colDelta] of DIRECTIONS) {
            const row = tile.row + rowDelta;
            const col = tile.col + colDelta;
            if (row < 0 || row >= ROWS || col < 0 || col >= COLS) continue;
            const neighbor = board[row][col];
            if (neighbor && neighbor.color === startTile.color && !visited.has(neighbor.id)) {
              stack.push(neighbor);
            }
          }
        }
        return group;
      }

      function removeTileGroup(tile) {
        if (gameState !== "playing" || busy) return;
        setRovingTile(tile);
        const group = getConnectedGroup(tile);

        if (group.length < 2) {
          tile.element.classList.remove("invalid");
          void tile.element.offsetWidth;
          tile.element.classList.add("invalid");
          showToast("至少需要 2 颗相连的同色星星");
          return;
        }

        busy = true;
        const hadKeyboardFocus = document.activeElement === tile.element;
        const gained = 5 * group.length * group.length;
        addScore(gained);
        updateStats();
        createRemoveEffects(group);

        for (const member of group) {
          member.element.disabled = true;
          member.element.classList.add("removing");
        }

        // 版本号可阻止重开后旧动画回调修改新棋盘。
        const version = gameVersion;
        window.setTimeout(() => {
          if (version !== gameVersion) return;

          for (const member of group) {
            board[member.row][member.col] = null;
            member.element.remove();
            tileMap.delete(member.id);
          }

          collapseBoard();
          busy = false;
          updateStats();
          ensureFocusTarget(hadKeyboardFocus);

          if (tileMap.size === 0) {
            addScore(CLEAR_BONUS);
            updateStats();
            finishGame(true);
          } else if (!hasMoves()) {
            finishGame(false);
          }
        }, 235);
      }

      function collapseBoard() {
        const columns = [];

        // 每一列自下而上收集，保持原有上下顺序。
        for (let col = 0; col < COLS; col += 1) {
          const column = [];
          for (let row = ROWS - 1; row >= 0; row -= 1) {
            const tile = board[row][col];
            if (tile) column.push(tile);
          }
          if (column.length > 0) columns.push(column);
        }

        const collapsed = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
        columns.forEach((column, newCol) => {
          column.forEach((tile, index) => {
            tile.row = ROWS - 1 - index;
            tile.col = newCol; // 非空列整体向左靠拢。
            collapsed[tile.row][tile.col] = tile;
            updateTileElement(tile);
          });
        });
        board = collapsed;
      }

      function hasMoves() {
        for (let row = 0; row < ROWS; row += 1) {
          for (let col = 0; col < COLS; col += 1) {
            const tile = board[row] && board[row][col];
            if (!tile) continue;
            const right = col + 1 < COLS ? board[row][col + 1] : null;
            const down = row + 1 < ROWS ? board[row + 1][col] : null;
            if ((right && right.color === tile.color) || (down && down.color === tile.color)) {
              return true;
            }
          }
        }
        return false;
      }

      // ---------- 分数、提示与结算 ----------
      function addScore(points) {
        score += points;
        scoreElement.classList.remove("bump");
        void scoreElement.offsetWidth;
        scoreElement.classList.add("bump");

        if (score > bestScore) {
          bestScore = score;
          saveBestScore();
        }
      }

      function updateStats() {
        scoreElement.textContent = score.toLocaleString("zh-CN");
        bestElement.textContent = bestScore.toLocaleString("zh-CN");
        remainingElement.textContent = String(tileMap.size);
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toastElement.textContent = message;
        toastElement.classList.add("visible");
        toastTimer = window.setTimeout(() => {
          toastElement.classList.remove("visible");
        }, 1300);
      }

      function createRemoveEffects(group) {
        let centerX = 0;
        let centerY = 0;
        for (const tile of group) {
          centerX += tile.element.offsetLeft + tile.element.offsetWidth / 2;
          centerY += tile.element.offsetTop + tile.element.offsetHeight / 2;
        }
        centerX /= group.length;
        centerY /= group.length;

        const scoreFloat = document.createElement("span");
        scoreFloat.className = "score-float";
        scoreFloat.textContent = `+${5 * group.length * group.length}`;
        scoreFloat.style.left = `${centerX}px`;
        scoreFloat.style.top = `${centerY}px`;
        boardElement.appendChild(scoreFloat);
        window.setTimeout(() => scoreFloat.remove(), 850);

        // 粒子数量设上限，大屏组也不会造成过多 DOM 开销。
        const particleCount = Math.min(18, group.length * 3);
        for (let index = 0; index < particleCount; index += 1) {
          const source = group[index % group.length];
          const particle = document.createElement("i");
          const angle = (Math.PI * 2 * index) / particleCount + Math.random() * 0.35;
          const distance = 24 + Math.random() * 45;
          particle.className = `particle color-${source.color}`;
          particle.style.left = `${centerX}px`;
          particle.style.top = `${centerY}px`;
          particle.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
          particle.style.setProperty("--dy", `${Math.sin(angle) * distance}px`);
          boardElement.appendChild(particle);
          window.setTimeout(() => particle.remove(), 600);
        }
      }

      function finishGame(won) {
        gameState = "ended";
        pauseButton.disabled = true;
        finalScore.textContent = score.toLocaleString("zh-CN");
        finalBest.textContent = bestScore.toLocaleString("zh-CN");
        finalRemaining.textContent = String(tileMap.size);
        endTitle.textContent = won ? "完美清屏！" : "游戏结束";
        endIcon.textContent = won ? "★" : "✦";
        endIcon.classList.toggle("victory", won);
        endMessage.textContent = won
          ? `太棒了！清屏奖励 ${CLEAR_BONUS.toLocaleString("zh-CN")} 分已到账。`
          : "没有相连的同色星星了，再冲一次高分吧！";

        const version = gameVersion;
        window.setTimeout(() => {
          if (version === gameVersion && gameState === "ended") {
            showModal(endModal, playAgainButton);
          }
        }, 330);
      }

      // ---------- 暂停与弹窗焦点管理 ----------
      function pauseGame() {
        if (gameState !== "playing" || busy) return;
        gameState = "paused";
        showModal(pauseModal, resumeButton);
      }

      function resumeGame() {
        if (gameState !== "paused") return;
        gameState = "playing";
        hideModal(pauseModal, false);
        pauseButton.focus({ preventScroll: true });
      }

      function showModal(modal, focusTarget) {
        modal.hidden = false;
        modal.setAttribute("aria-hidden", "false");
        window.requestAnimationFrame(() => focusTarget.focus({ preventScroll: true }));
      }

      function hideModal(modal, restoreFocus) {
        if (modal.hidden) return;
        modal.hidden = true;
        modal.setAttribute("aria-hidden", "true");
        if (restoreFocus) pauseButton.focus({ preventScroll: true });
      }

      function visibleModal() {
        if (!pauseModal.hidden) return pauseModal;
        if (!endModal.hidden) return endModal;
        return null;
      }

      function trapModalFocus(event) {
        const modal = visibleModal();
        if (!modal || event.key !== "Tab") return;
        const buttons = [...modal.querySelectorAll("button:not(:disabled)")];
        if (buttons.length === 0) return;
        const first = buttons[0];
        const last = buttons[buttons.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }

      // ---------- 键盘导航 ----------
      function setRovingTile(tile) {
        if (!tile) return;
        const previous = tileMap.get(focusedTileId);
        if (previous && previous !== tile && previous.element) previous.element.tabIndex = -1;
        focusedTileId = tile.id;
        tile.element.tabIndex = 0;
      }

      function ensureFocusTarget(shouldFocus) {
        let target = tileMap.get(focusedTileId);
        if (!target) target = tileMap.values().next().value || null;
        if (!target) return;
        setRovingTile(target);
        if (shouldFocus) target.element.focus({ preventScroll: true });
      }

      function moveTileFocus(tile, key) {
        const movement = {
          ArrowUp: [-1, 0],
          ArrowDown: [1, 0],
          ArrowLeft: [0, -1],
          ArrowRight: [0, 1]
        }[key];
        if (!movement) return;

        const [rowStep, colStep] = movement;
        let row = tile.row + rowStep;
        let col = tile.col + colStep;
        while (row >= 0 && row < ROWS && col >= 0 && col < COLS) {
          const candidate = board[row][col];
          if (candidate) {
            setRovingTile(candidate);
            candidate.element.focus({ preventScroll: true });
            return;
          }
          row += rowStep;
          col += colStep;
        }
      }

      // ---------- 自适应棋盘：始终取可用区域的宽高中较小值 ----------
      function fitBoard() {
        const bounds = boardWrap.getBoundingClientRect();
        const size = Math.floor(Math.min(bounds.width, bounds.height, 520));
        if (size > 0) {
          boardElement.style.width = `${size}px`;
          boardElement.style.height = `${size}px`;
        }
      }

      // ---------- 事件绑定 ----------
      boardElement.addEventListener("click", (event) => {
        const element = event.target.closest(".tile");
        if (!element || !boardElement.contains(element)) return;
        const tile = tileMap.get(Number(element.dataset.tileId));
        if (tile) removeTileGroup(tile);
      });

      boardElement.addEventListener("keydown", (event) => {
        const element = event.target.closest(".tile");
        if (!element || gameState !== "playing" || busy) return;
        const tile = tileMap.get(Number(element.dataset.tileId));
        if (!tile) return;

        if (event.key.startsWith("Arrow")) {
          event.preventDefault();
          moveTileFocus(tile, event.key);
        } else if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          removeTileGroup(tile);
        }
      });

      pauseButton.addEventListener("click", pauseGame);
      resumeButton.addEventListener("click", resumeGame);
      restartButton.addEventListener("click", newGame);
      pauseRestartButton.addEventListener("click", newGame);
      playAgainButton.addEventListener("click", newGame);

      document.addEventListener("keydown", (event) => {
        trapModalFocus(event);
        if (event.key !== "Escape") return;
        event.preventDefault();
        if (gameState === "paused") resumeGame();
        else if (gameState === "playing") pauseGame();
      });

      // 禁止页面手势滚动、双击缩放与 iOS 捏合缩放。
      document.addEventListener("touchmove", (event) => event.preventDefault(), { passive: false });
      document.addEventListener("dblclick", (event) => event.preventDefault(), { passive: false });
      document.addEventListener("gesturestart", (event) => event.preventDefault(), { passive: false });
      boardElement.addEventListener("contextmenu", (event) => event.preventDefault());

      // 切到后台时自动暂停，返回后由玩家主动继续。
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && gameState === "playing" && !busy) pauseGame();
      });

      if ("ResizeObserver" in window) {
        new ResizeObserver(fitBoard).observe(boardWrap);
      }
      window.addEventListener("resize", fitBoard);
      window.addEventListener("orientationchange", fitBoard);

      newGame();
    })();
  </script>
</body>
</html>
